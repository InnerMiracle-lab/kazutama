<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数の手帳 数理盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 静かで、へりくだった、手のひらの手帳
   IDEA: 藍の墨で刷られた九つの場の盤。指で場に触れると、その頁がひらく
   PICTURE: 大きな数理盤（外周に十二支、中心A場に朱の印）
   COLOUR and TYPE: 白い紙・藍 #1d3557・朱 #c0392b ひとつ／しっぽり明朝
   LAYOUT: 上に生年数理の小盤九つ、左に大盤、右に意味の頁（狭い画面では縦に） */
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#10171f);
  --paper:light-dark(#f4f6f9,#17212c);
  --ink:light-dark(#1b2430,#e6ebf1);
  --muted:light-dark(#5b6675,#9aa7b6);
  --ai:light-dark(#1d3557,#9fc0e6);
  --ai-soft:light-dark(#e6edf6,#1f3047);
  --line:light-dark(#c9d3df,#2d3b4c);
  --shu:light-dark(#c0392b,#ef7a6b);
  --shu-soft:light-dark(#fbecea,#3a2320);
  --kai:light-dark(#f2f7f1,#1a2a22);
  --kai-line:light-dark(#b9d3b4,#335a40);
}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.95 "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;overflow-x:clip}
.band{padding:clamp(22px,3.5vw,48px) max(4vw,14px)}
.wrap{max-width:1240px;margin:0 auto}
header h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:0;font-weight:700;color:var(--ai);text-wrap:balance}
header p{margin:.4em 0 0;color:var(--muted);font-size:15px}

/* 生年数理の選択（小盤） */
.picker{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:10px;margin:22px 0 6px}
.pk{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 6px 6px;cursor:pointer;color:var(--ink);font:inherit;min-height:44px}
.pk:focus-visible,.cell:focus-visible,summary:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.pk .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);aspect-ratio:1}
.pk .mini span{background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;color:var(--muted)}
.pk .mini span.c{color:var(--shu);font-weight:700}
.pk b{display:block;text-align:center;font-size:15px;margin-top:4px;color:var(--ai)}
.pk[aria-pressed=true]{border-color:var(--ai);background:var(--ai-soft);box-shadow:0 0 0 1px var(--ai) inset}
.pk[aria-pressed=true] .mini span{background:var(--ai-soft)}
@media(max-width:700px){.picker{grid-template-columns:repeat(5,minmax(0,1fr))}}

/* 本体 */
.main{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:clamp(20px,3vw,44px);align-items:start;margin-top:18px}
@media(max-width:860px){.main{grid-template-columns:1fr}}
.boardbox{position:sticky;top:14px;background:var(--paper);border-radius:16px;padding:18px 18px 14px}
@media(max-width:860px){.boardbox{position:static}}
.btitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.btitle h2{margin:0;font-size:22px;color:var(--ai)}
.btitle small{color:var(--muted);font-size:13px}
.board{display:grid;grid-template-columns:.62fr 1fr 1fr 1fr .62fr;grid-template-rows:.62fr 1fr 1fr 1fr .62fr;aspect-ratio:1;max-width:400px;margin:0 auto;gap:0}
.eto{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}
.eto.pair{gap:.6em}
.corner{}
.cell{appearance:none;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ai);margin:-.5px;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .2s}
.cell .n{font-size:clamp(30px,7vw,44px);line-height:1;color:var(--ai);font-weight:600}
.cell .f{position:absolute;left:6px;top:3px;font-size:13px;color:var(--muted);line-height:1.4}
.cell.center .n{color:var(--shu)}
.cell.center::after{content:"";position:absolute;inset:5px;border:1px solid var(--shu);border-radius:50%;opacity:.55;pointer-events:none}
.cell:hover{background:var(--ai-soft)}
.cell[aria-current=true]{background:var(--ai);}
.cell[aria-current=true] .n,.cell[aria-current=true] .f{color:var(--bg)}
.cell[aria-current=true].center::after{border-color:var(--bg)}
.zrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.zrow span{font-size:14px;color:var(--muted);margin-right:2px}
.zb{appearance:none;font:inherit;font-size:16px;min-width:44px;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);cursor:pointer}
.zb[aria-pressed=true]{background:var(--ai);color:var(--bg);border-color:var(--ai)}
.zb:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.eto{position:relative}
.eto .me{position:absolute;width:30px;height:30px;border:1.5px solid var(--ai);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.x{color:var(--shu);font-weight:700}
.eto .x,.corner .x{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;line-height:1;opacity:.55;font-weight:400}
.cell .bx{position:absolute;right:5px;top:1px;color:var(--shu);font-size:20px;font-weight:700;line-height:1.3}
.cell.hk .n{color:var(--shu)}
.cell[aria-current=true] .bx{color:#ffb3a8}
.zb small{font-size:12px;margin-left:2px;opacity:.85}
.mb{min-width:0;padding:0 8px;font-size:15px}
.cell .tri{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid var(--shu)}
.cell[aria-current=true] .tri{border-bottom-color:#ffb3a8}
.chip.tc{background:transparent}
.mt{font-size:16px;color:var(--ai);margin:20px 0 8px;text-align:center}
.board.small{max-width:240px}
.board.small .cell{cursor:default}
.board.small .cell:hover{background:var(--bg)}
.board.small .cell .n{font-size:24px}
.board.small .cell .f{font-size:11px;left:4px;top:1px}
.board.small .cell .bx{font-size:14px;right:3px}
.board.small .cell .tri{border-left-width:6px;border-right-width:6px;border-bottom-width:10px;bottom:3px}
.board.small .eto{font-size:12px}
.board.small .eto .x{font-size:20px}
.board.small .eto .me{width:20px;height:20px}
.sw{appearance:none;font:inherit;font-size:15px;color:var(--ai);background:transparent;border:0;display:flex;align-items:center;gap:10px;min-height:44px;padding:0;margin:0 0 6px;cursor:pointer}
.sw .knob{width:44px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.sw .knob::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);transition:left .2s}
.sw[aria-pressed=true] .knob{background:var(--ai)}
.sw[aria-pressed=true] .knob::after{left:23px}
.sw:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.sw .knob,.sw .knob::after{transition:none}}
.legend{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 0;line-height:1.7}
.chip{display:inline-block;font-size:14px;padding:2px 12px;border-radius:999px;background:var(--shu-soft);color:var(--shu);border:1px solid var(--shu);margin:0 0 1em}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:10px 0 0;line-height:1.7}

/* 頁 */
.page h2{font-size:clamp(24px,3vw,32px);line-height:1.3;margin:0;color:var(--ai);text-wrap:balance}
.page .sub{color:var(--muted);font-size:14px;margin:.3em 0 1.1em}
.page p{margin:0 0 1.05em;max-width:42em}
.kai{background:var(--kai);border:1px solid var(--kai-line);border-radius:12px;padding:14px 18px 6px;margin:1.4em 0 1.6em;max-width:44em}
.kai h3{margin:0 0 .4em;font-size:17px}
.kai p{font-size:16px}
details{border-top:1px solid var(--line);max-width:44em}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:12px 2px;font-weight:600;color:var(--ai);list-style:none;display:flex;justify-content:space-between;gap:10px;min-height:44px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--muted);font-weight:400}
details[open]>summary::after{content:"－"}
details .body{padding:0 2px 14px;font-size:16px}
details .body p{margin:0 0 .8em}
.tag{font-weight:600;color:var(--ink)}
.note{color:var(--muted);font-size:14px}
.empty{color:var(--muted);padding:30px 0}

/* 手帳について */
.about{background:var(--paper)}
.about h2{font-size:22px;color:var(--ai);margin:0 0 10px}
.about .body{font-size:16px}
footer{color:var(--muted);font-size:13px;text-align:center;padding:18px}
@media(prefers-reduced-motion:reduce){.cell{transition:none}}
</style>
</head>
<body>
<header class="band" style="padding-bottom:0"><div class="wrap">
  <h1>数の手帳　数理盤</h1>
  <p>インナーミラクル版　生年の数理盤をえらび、場にふれると、その場の頁がひらきます</p>
  <div class="picker" id="picker" role="group" aria-label="生年数理をえらぶ"></div>
</div></header>

<main class="band" style="padding-top:8px"><div class="wrap main">
  <section class="boardbox" aria-label="数理盤">
    <div class="btitle"><h2 id="btitle">生年⑨の数理盤</h2><small>上が南（午）</small></div>
    <button class="sw" id="sw" aria-pressed="false"><span class="knob" aria-hidden="true"></span>破壊数を見る</button>
    <div id="adv" hidden><div class="zrow" id="zrow" role="group" aria-label="生年の十二支"></div>
    <div class="zrow" id="mrow" role="group" aria-label="生月"></div></div>
    <div class="board" id="board"></div>
    <p class="legend" id="legend" hidden></p>
    <p class="hint">九つの場のどれかにふれてみてください</p>
    <div id="mboard" hidden><h3 class="mt" id="mtitle"></h3><div class="board small" id="mgrid" aria-hidden="true"></div><p class="note" style="text-align:center;margin:6px 0 0">生月盤の▲は、生年盤の破壊の場に重なるところです</p></div>
  </section>
  <article class="page" id="page" aria-live="polite"></article>
</div></main>

<section class="band about"><div class="wrap">
  <h2>この手帳について</h2>
  <details><summary>この版について</summary><div class="body" id="preface"></div></details>
  <details><summary>手帳の使い方（インナーミラクル）</summary><div class="body" id="intro"></div></details>
  <details><summary>数に吉凶はあるか（数霊占術講義）</summary><div class="body" id="kikkyo"></div></details>
  <details><summary>底本</summary><div class="body" id="colophon"></div></details>
</div></section>
<footer>インナーミラクル　数の手帳</footer>

const DATA = {"intro": "では、さらに1から9までの数理においてさらにAからJまでの各場の意味を一つ一つ見てみましょう。\nここでは人名数と各生年数別の各場の意味を紹介します。\n応用として、人名数だけではなく、生年数と生月数との対応。姓数。名数。命数。表面数理にある数にも当てはめて見るとより数の意味が深まります。\n例えば2025/02/12でしたら、\n　　　9－2－12ですから、\n表面数理は⑨－②－③になります。\n最初に見るのは生年の数理の意味ですね。これが本質になります。\nつぎに月の数理の意味を読みます。\n年と月とでその人の性格が決まります。\n（基本の場の意味を参照して下さい。）\n次に年の数理盤において月の数理がどこにあるか見ます。その次に月の数理盤において生年数がどこにあるかをみます。\nここでは、月の数理は⑨になりますから、年も月も⑨になりますから⑨が強いわけですね。\n別の例を見てみましょう。例えば、4月生まれの人は月が②になりますから、⑨の数理盤において②の数はC場にきますから、⑨数理において②の数を読みます。次ぎに②の数理盤において⑨の意味を読みます。（意味は生年⑨で人名数②の人の基本的性格の項と生年数②で人名数⑨の人の基本的性格の項を見ます。）\nまた先の⑨-⑨の例の場合、命数は⑤になりますから、占う人の生命環境として⑨の年の数理盤において、⑤の意味の環境があるというように判断します。\n例えば潜在の見えないものを理解したい、把握したいという思いがおこる環境があるというように読みます。（同様に生年数⑨で人名数⑤の項を見ます。）\nまた姓数は家系の影響でその性格や運命が展開されると判断します。（同様に生年数⑨で姓の画数を人名数に当てはめてのその数のの所を見ればいいわけです。）\n表面数理は⑨の年において、表面数理は②と③を持っています。ですから、⑨の数理において②の数③の数を見てみます。その②や③の数も性格や運命に影響を与えます。②の数はC場にありますから金運があるとか③がありますから、環境の変化に新鮮な感覚で対応できる人だと読むことが出来ます。（同様に調べてみてください）\nこの各場の意味は、これから説明しますのでしっかり学んでください。\nここでは初級ですから、まずはしっかり各年における各場の意味をしっかりと把握しましょう。\nでは、①から順番に見ていきましょう。\nもう一度簡略形の①の意味を書いておきますね。", "kikkyo": ["既成観念から考えますと、数には吉凶があると考えられていますが、正しい意味から判断しますと、数そのものには吉凶はありません。吉凶が生じるためには、時間において、位置する場と、対応によって、初めて吉凶が生じるのですから、単独であると思うことは、正しい認識ではありません。", "正しく数の意味を知り、かつ判読するためには、かならず、時間と場と対応する物と事、人と人、数と数によって解釈しなければなりません。", "なぜかといいますと、①数といっても、A場の①数は時間数であるのに対して、B場～J場に回座する1数は、局所場としての1数ですから、時間性の意味をもつA①数と、空間性の意味をもつ、B場～J場に在る1数では、そのもつ意味が違います。それだけでなく、正と反、順と逆の意味、融合と分解の意味によって、数のもつ意味は大きく変化しますので、停止した見方に立つ静態観だけで、数の吉凶を判読するのは誤りです。動態的な意味から判読しますと、数には吉凶が在るというより、吉凶が生じます。この見方が大事な観点です。以上の考え方を念頭に入れて、場の意味と数の意味をお考え下さい。"], "ba": {"A": {"head": "⑤数の意味があります。", "text": "生命。時間。統一。我れ。神。中央。中心。座標。統率。意志。自我。業。支配。宿命。管理。完全。圧力。剛毅。"}, "B": {"head": "⑥数の意味がある。", "text": "政治。政界。官庁。経営。高級。権威。大物。競争意識。権力。回転。運動。理想。高位。父。夫。高位。円形。"}, "C": {"head": "⑦数の意味があります。", "text": "金銭。金運。財力。経済。哲学。分析。宗教。神秘。平和。独創性。金融。繁栄。財務。秋。食物。収穫。直観。"}, "D": {"head": "⑧数の意味があります。", "text": "蓄財。改革。革命。転換。交替。機構。組識。家族。家系。相続。祖先崇拝。骨組み。台座。柱。節約。設備。在庫。"}, "E": {"head": "⑨数の意味があります。", "text": "名声。権利。名誉。精神性。知性。判断。文書。発明発見。美術。華 」の場面で、あなたの独創性と、流れるような社交性はいちばん輝きます。\nただ、その勢いはときに進みすぎます。一度つまずくと、そのことが頭から離れず、いつまでも思い悩んでしまうこともあります。人には見せなくても、心の奥には、自分の主張をどうしても通したい頑固さや、手にしたものを手放したくない気持ちがひそんでいます。そして、あれほど大胆に見えるあなたが、実はとても寂しがりやだということに、周りの人は驚くかもしれません。\n①の水が濁るとき、つまり①数が破壊されるとき、水は低いところ、暗いところへと流れていきます。秘密を抱えこむ。人に言えない借金や異性関係に悩む。夜の遊びやお酒、賭けごとに心がひかれる。眠れない夜が続く。仕事に行き詰まって職を転々とする。そうした形で現れやすくなります。\n人生の流れでいえば、二十代は力がまだ定まらず、気持ちが揺れやすい時期です。三十代から運気は上向き、四十代でその人の評価が定まります。焦らず、力を蓄えていくことが大切です。二月・十月・十一月生まれの人は、運が渋りやすいところがあります。体では、腎臓、耳、婦人科の病、痔、冷え、不眠、気持ちの沈みに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数①の人で①数が吉数の人の場合、積極的に①の数を取る（引っ越しの時、番地、部屋番号に①を選ぶとか、①の数を貼ったアクセサリーを身につける）と以下の長所が生まれる環境が整います。名前を変えると、はっきり性格は変わりますが、番地とか部屋番号の場合はプラスの数の意味が出る環境が整うと言うことです。\n（番地とか部屋番号等複数の数の場合は単数化した数のことです。以下①から⑨までの説明において全てそう考えて下さい。）\n独創的な考えや推理力が出てきます。進歩性がでる。活力と、社交性が生まれます。\n創業者型の気質が出る。冷静な判断力。頭脳明敏。物事に徹底する。物事の隠れた本質を見抜く洞察力、推理力が働きく。とかの意味合いがあります。"}, "1-2": {"ba": "B", "text": "あなたは、進む力と守る力の両方を持っている人です。新しいものに心ひかれる一方で、古いもの、地道なものを大切にする気持ちもあり、情のこまやかさと、人の苦しみを放っておけないやさしさがあります。②は大地の数、努力と忍耐、そして人に尽くす心の数です。その②が、理想や上に立つ力をあらわすB場に入ると、あなたの本領は、表に立つときよりも、誰かを支える立場に立ったときに現れます。補佐役になったとたん、細かいところまで目が届き、驚くほど大胆に、てきぱきと物事を片づけていく。古い問題や地味な研究にもこつこつ取り組み、多少自分が損をしても、人のために動くことをいといません。部下や後輩を育てる力、目上の人から引き立てられる運、手先の器用さも、あなたの恵みです。\n②数が破壊されるときには、その大地が乾いてしまいます。働く意欲がうすれ、意志がはっきりしない、あいまいな態度になりやすい。急に権威ぶったり、古いことを持ち出して人をちくちく責めたりする執念深さが顔を出すこともあります。目標を見失って堂々めぐりをし、努力のわりに物事がはかどらない。疑い深くなり、細かいことにくよくよする。人名数が⑪の場合は、跡継ぎのことで悩みやすく、子どもが家業を継がない、離れて暮らすといった形になることもあります。\n人生の流れでは、十代までは順調に進み、二十代に揺れの時期を迎えます。三十歳前後から運気が上がり、五十歳前後がひとつの曲がり角になります。五月生まれの人は②数が破壊されやすく、努力が報われにくい、下で支えてくれる人が離れるといった苦労が出やすいので、気をつけてください。体では、胃腸、物忘れ、冷え、血圧、婦人科の病、気持ちの沈みに注意しましょう。\n☆開運のために（インナーミラクル）\n生年数①の人で②数が吉数の人の場合、積極的に②の数を取る（引っ越しの時、番地、部屋番号に①を選ぶとか、①の数を貼ったアクセサリーを身につける）と以下の特性が生まれたり、その環境ができあがる可能性があります。\n古い物事に興味をもつ。地道に努力する。親切な面が出てくる。意欲的な行動。忍耐強さ。勤勉になる。部下運に恵まれる。上位の人からの援助、引き立てを受ける。器用に物事を処理できるようになる。人情家になる。と言った意味が出ます。"}, "1-3": {"ba": "C", "text": "あなたは、動いていると気分が晴れる人です。にぎやかな場を好み、感覚が鋭く、言葉も達者。いつも一歩先へ進もうとする、エネルギーに満ちた人です。③は春の芽吹き、声と音と言葉の数。その③が、お金と経済、直観をあらわすC場に入るので、生年①の人にとって③は、金運・財運を呼び込む力になります。話のうまさや明るい応対、回転の速さがそのまま信用や商いにつながり、新しい品物や企画が人に受け入れられやすいのもこの数の恵みです。音楽や言葉に才能を持つ人も少なくありません。\nただ、勢いにまかせてやりすぎると「軽はずみな人」と見られてしまいます。前へ出よう出ようとする気持ちから、気分にむらが出たり、ふいに怒りが顔をのぞかせて物事を壊してしまったりすることがあります。本来持っている冷静さと推理力を生かし、少しずつ進めば、運は自然に釣り合いのとれたものになっていきます。\n③数が破壊されると、言葉の力が逆に働きます。けんか早くなる。しゃべりすぎて失敗する。嘘をつく。お金のことに口うるさくなる。だまされて損をしたり、商売が振るわなくなったりもします。お酒が入ると人が変わってからむ、陰険な言葉づかいで人を不快にする、言葉が出にくくなる、声が出なくなる、神経がたかぶってヒステリックになる、といった形でも現れます。\n人生の流れでは、十一歳ごろから最初の上昇があり、二十歳前後が分かれ目になります。運気の上昇がはっきり感じられるのは三十一歳からで、四十歳までは安定した時期です。三月・六月生まれの人は③数が凶に変わり、お金の損失や資金繰りの苦労が出やすいので注意が必要です。体では、喘息や咳、歯、肝臓、神経痛、恐怖症、のぼせに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数①の人で③数が吉数の人の場合、積極的に③の数を取る（引っ越しの時、番地、部屋番号に③を選ぶとか、③の数を貼ったアクセサリーを身につける）と以下の特性が生まれたり、その環境ができあがる可能性があります。\n活動的になる。敏捷に動きまわれるうよになる。感覚がするどくなる。\n冷静さと推理力能力が強くなる。音楽的な才能が出る。言語感覚が鋭くなる。新鮮な感覚が生まれるとか\n話がうまくなる。応答態度がよくなる。行動が活動的になる。明るくなる。回転が速くなる。キビキビした態度になる。鋭い感覚が生まれる。音声がきれいになる。金儲けの感覚が鋭くなる。静かな態度になる。新製品がうける。等々です。"}, "1-4": {"ba": "D", "text": "あなたは、冷静さの中に、人に合わせるしなやかさと、機を見るに敏な鋭さを持っています。人に尽くす心と、ばらばらのものをまとめる力があるので、気がつくと周りに人が集まっています。④は人と人とをつなぐ数、交流と縁と信用の数です。その④が、改革と蓄え、家族と家系をあらわすD場に入るので、あなたは物事を改良したり、まとめ直したりする才能を持ち、整理や調査、こつこつとした蓄財にも力を発揮します。人とは違った角度から物事を見られるのも、あなたの持ち味です。良い友に恵まれ、信用されやすい人でもあります。\n一方で、右から左へとさっと向きを変える計算高さが心にひそんでいて、それが見えると陰口をたたかれます。世話を焼きすぎてお節介と言われたり、人の争いに巻き込まれたり、異性に好かれすぎて困ったりすることもあります。\n④数が破壊されると、人とのつながりがほころびます。かんしゃくを起こして、それまで築いたものを中途半端にしてしまう。気の合う人ばかりをひいきして、ほかの人を遠ざける。へそ曲がりになり、家族や友に疎まれて孤独になる。同僚に裏切られる、中傷に悩む、物事が途中まで来ると壊れる、貯めたお金を知人や親戚に貸して戻ってこない、といった形でも現れます。D場の数でもあるので、家に縁がうすい、相続のことで悩むといったこともあります。女性は、結婚後に夫や婚家の人々とうまくいかない、夫の浮気に悩むといった形が出やすくなります。\n人生の流れでは、子ども時代から二十代にかけて揺れが大きく、三十一歳ごろから上昇運に入ります。四十代はじめにもう一度曲がり角があり、六十五歳ごろまでは安定した時期です。七月・八月生まれの人は④数が凶に変わり、縁や結婚、取引の面で苦労が出やすくなります。体では、胸や呼吸器、胃腸、かぜ、脱毛、血圧、不眠に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数①の人で④数が吉数の人の場合、積極的に④の数を取る（引っ越しの時、番地、部屋番号に④を選ぶとか、④の数を貼ったアクセサリーを身につける）と以下の特性が生まれたり、その環境ができあがる可能性があります。\n他人との柔軟な対応ができる心が生まれます。機をみるに敏な、社交性を潜在的にもつようになります。他の人とは違った考え方とか行動力がれるようになります。改良、改革の才能をが生まれます。時により、また異性とか友達にもてやすいタイプになります。\n結婚運に恵まれる。従順性がある。良い取引先に恵まれる。友達に助けられる。融通がきくとかです。\n信用されやすいタィプになりますね。社交的。清潔ずきになる。几帳面な性格。世話を親身になってする。調査力、推理力があるとかです。"}, "1-5": {"ba": "E", "text": "あなたは、頭の切れる人です。じっとしているのが苦手で、何でも自分のものにしてやろうという知的な意欲にあふれ、変化を求めて動いているときが、いちばんあなたらしい姿です。⑤は中心の数、意志と統率と管理の数。その⑤が、知性と名声、学問や文書をあらわすE場に入るので、あなたの意志の強さは、知恵と結びついて大きな力になります。管理する力、器用に物事をこなす力があり、世の中が混乱したときには、思いがけない勝負勘も働きます。自由でありたいという、進歩的な心も持っています。\nただ、移り気が強く、一つのことを深く極めるには、腰を落ち着ける必要があります。「自分はよく知っている」という気持ちが言動にちらついたり、ワンマンになって強引に事を進めたりすると、自分から敵をつくってしまいます。あなたの頭の良さは、周りの人がもう知っています。知恵をあえて隠すことを覚えたとき、あなたは自然に光りはじめるでしょう。\n⑤数が破壊されると、心が休まらなくなります。悩みが次から次へと湧いて振り回される。名声を求める気持ちが強くなりすぎ、そのためには人を押しのけてでも進む。激しい感情から争いが絶えず、裁判ざたで才能をつぶしてしまう。慢心する、書類をごまかす、不渡りをつかまされる、保証人になって損をする、異性とのもめごとを起こす、といった形でも現れます。子年の人や八月生まれの人にとっては、⑤数はもともと凶数として働くので、とくに注意が必要です。\n人生の流れでは、十代前半にやや揺れがあり、二十代は順調な人と足踏みする人に分かれます。三十一歳ごろから上昇が確かになり、四十代はきっかけ次第で大きく開ける、変化の年代です。五十代は、急に上がる人と急に下がる人に分かれやすいので、慎重に歩んでください。体では、心臓や血圧、脳の血管、目、やけど、高熱、泌尿器、不眠、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数①の人で⑤数が吉数の人の場合、積極的に⑤の数を取る（引っ越しの時、番地、部屋番号に⑤を選ぶとか、⑤の数を貼ったアクセサリーを身につける）と以下の特性が生まれたり、その環境ができあがる可能性があります。\n知的に、何でも消化しようとする知的貪欲さでます。変化を 求め動こうとします。\n意志力が強くなる。管理能力がでる。進歩的で自由でありたいと願う心がでる。混乱期にはすばらしい投機感覚が働いてくる。剛毅な性格。器用に物事をこなす能力がでる。と言った具合です。"}, "1-6": {"ba": "F", "text": "あなたの運は、明と暗の二つの面に大きく分かれやすいところがあります。水が流れるように、一つの場所に落ち着きにくい気質も持っています。⑥は理想と権威、上に立つ力の数です。その⑥が、隠れたもの、背後のもの、夜と秘密をあらわすF場に入るので、あなたの力は表よりも裏で働きます。良いほうに出れば、抜きんでた推理力と先見の明、鋭い霊感を持つ人になります。冷静に、一歩ずつ的をしぼって推理の糸をたぐり、そこから独自のものを築きあげていく。静かな中にも人を束ねる力があり、大きな視点から物事を判断し、目上の人や力のある人に引き立てられることもあります。親分肌のところもあります。\nただ、生年①の人にとって⑥はもともと凶として働きやすい数です。もう一つの面が出ると、冷たく陰気で、いかにも大物のように大風呂敷を広げる夢想家になったり、外では社交的でも、家の中ではわがままな暴君になったりします。\n⑥数が破壊されると、陰の気が強くなります。引っ込み思案になり、向かい合っただけでその場を白けさせてしまう。理屈を並べて人をちくりと刺す。噂を気にして眠れないほど悩む。人目のないところで快楽や色ごとに溺れ、お酒で我を忘れる。内心は寂しいのに、外見を華やかに飾って浪費する。賭けごとにのめりこんで本業を留守にする。ふだんは無口なのに、お酒が入ると人が変わって上役の悪口を言う。陰で画策する、陰で不正をする、といった形でも現れます。\n人生の流れでは、十代は比較的おだやかで、二十代は吉と凶が入り混じって揺れます。三十一歳ごろから上昇し、強い人は五十歳ごろまで順調ですが、五十代は大きく揺れやすい時期です。三月・四月・九月生まれの人はとくに凶意が強く、大きく踏み出すときほど慎重にしてください。翌年一月生まれの人は、この凶意がやわらぎます。体では、冷え、腎臓、婦人科の病、痔、血圧、不眠、気持ちの沈みに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数①の人で⑥数は破壊数ですから⑥の数は取れません。⑥の数がきた場合は①の数で合局させてください。子年の場合、冬の季質ですので①と共に⑨を取って下さい。⑨が取れない場合は④を取って下さい。\n合局した場合。\n推理力、活動力が抜群で、先見の明が出る。霊感の鋭くなる。独創的な才知がでる。静かな中にも統率力がでる。政治性があって、大所高所的に物事を判断するようになる。頭の回転が速くなる。権力、権威者の引き立て援助を受けるようになる。推理力が強くなる。理想に向かって、もくもくと努力すると言った意味合いが出るようになります。"}, "1-7": {"ba": "G", "text": "あなたは、地味にこつこつと積みあげていく努力の人です。細かいところまで用心深く計算する感覚と推理力を持ち、なかにはお金の動きにすばらしい勘が働く人、数字に明るく計算の得意な人もいます。⑦は実りの数、お金と経済、そして神秘と信仰の数です。その⑦が、努力と忍耐、家庭や妻、大地をあらわすG場に入るので、あなたの実りは、足もとを固める地道な歩みと、身近な人の支えから生まれます。妻に助けられて成功する、一家だんらんの明るい家庭を持つ、食べ物に詳しい、技芸に才がある。そうした恵みもこの組み合わせのものです。未知の世界や神秘的なもの、信仰に心ひかれる一面もあります。\n表面はやわらかく親切ですが、内面は案外強情で、計画どおりに運ばないと気がすまないところや、細かいことにくよくよするところがあります。\n⑦数が破壊されると、実りが空回りします。お金のことに口うるさくなる。頑固になって細かいことに小言を言う。地味さを補おうとして無理に散財する。働きがないのに口だけ達者になる。何でもお金に換算して判断する。理屈っぽくなり、物事が中途半端になる。笑いでごまかす、欲張りになる、遊びや色ごとに溺れてお金を使いながら喜ぶ、といった形でも現れます。不平不満を家に持ち込んで家族を心配させたり、妻の病弱に悩んだりすることもあります。\n人生の流れでは、子ども時代はおだやかで、二十代は上昇の中にも上下があります。確かな開運は三十一歳から。三十代後半に伸び悩む人も、四十三歳ごろからの上昇をしっかりつかんでください。五十代は不安定になりやすい時期です。十月生まれの人、子年の二月生まれの人には⑦数が凶として働きます。体では、口や歯、胃腸、打撲やけが、婦人科の病、胸、肌荒れ、じんましん、冷え、不眠に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数①の人で⑦数が吉数の人の場合、積極的に⑦の数を取る（引っ越しの時、番地、部屋番号に⑦を選ぶとか、⑦の数を貼ったアクセサリーを身につける）と以下の特性が生まれたり、その環境ができあがる可能性があります。\n地味で、コツコツ築き上げる努力家タィプになる。感受性も鋭くなる。金儲けに対するすばらしい感覚がめばえる。計数に明るくなる。神秘な世界に目覚める。直感力、理論的になる。経済観念が強いくなる。とかです。"}, "1-8": {"ba": "H", "text": "あなたは、直感が鋭く、節度のある行動をとる人です。我慢強さでは人に負けず、いったんこうと決めたら、途中にどんな障害があってもはねのけて進む気迫があります。⑧は改革と蓄えの数、家系や相続の数です。その⑧が、行動と発展、声と感覚をあらわすH場に入るので、あなたの改革の力は、行動とひらめきになって外に現れます。次々とアイデアが浮かび、物事の勘どころをつかむのがうまい。ふだんは無口でも、話しだせば要領よく、如才なく話せます。蓄財の才もあり、人が失敗したあとを引き継いで立て直す、改良や改革で成果をあげる、といった力にすぐれています。\nただ、才に溺れやすいところがあります。物事に凝りすぎたり、チャンスを狙う心が強く出たりします。表向きは立派でも、家族や親族の地位や財産を鼻にかけて、自分をよく見せようとする癖が顔を出すこともあります。\n⑧数が破壊されると、築いたものが崩れやすくなります。嘘を並べてごまかす。外では人当たりが良いのに、家に入ると暴君に変わる。職を転々とする。尊大な態度で嫌われる。こつこつ貯めて家を建てるという段になって、悪い不動産業者にだまされる。物事が七、八割まで進むと止まってしまう。せっかくのアイデアを横取りされる。相続や養子のことで争いや悩みが起きる。高いところから落ちる。そうした形で現れやすくなります。\n人生の流れでは、二十代半ばに吉凶が大きく揺れ、三十歳ごろに落ち着いてきます。三十代は重みのある時期なので焦らずに。四十一歳から五十歳は、それまで開けなかった人にとって最後の開運期です。しっかりつかんでください。酉年の人、二月・十一月生まれの人には⑧数が凶として働きます。体では、骨折、鼻、首、腰、神経痛、まひ、盲腸、冷え、不眠に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数①数の人で⑧数が吉数の人の場合、積極的に⑧の数を取る（引っ越しの時、番地、部屋番号に⑧を選ぶとか、⑧の数を貼ったアクセサリーを身につける）と以下の特性が生まれたり、その環境ができあがる可能性があります。\n推理力、活動力が出てきます。先見の明が生まれる。サイキック能力が強くなる。独創的な才知が生まれるとかです。\n静かな中にも統率力がでてきます。政治性がうまれます。大所高所的に物事を判断するようになります。頭の回転が速くなります。権力、権威者の引き立て援助を受けるようになります。\n推理力がある。理想に向かって、もくもくと努力するようになります。"}, "1-9": {"ba": "J", "text": "あなたは、陽気で、華やかさと明るさを求める外向きの人です。世渡りがうまく、人づきあいの輪も広い。⑨は夏の光の数、名声と知性、美と華やかさの数です。その⑨が、人と人とのつながり、情報や縁をあらわすJ場に入るので、あなたは人の輪の中で輝く人になります。物事をまとめる力、調べる力、人に勧める力があり、流行や情報に敏感で、いつも新しいものを求めています。広い知識と高尚なものへの憧れを持ち、芸術や学問、時代の感覚を持つ人にひかれます。良い人との交流、良い縁、良い取引先に恵まれやすいのも、この組み合わせの恵みです。\nけれど、心の奥には寂しがりやで甘えん坊な一面があります。本当は孤独なのに、それを隠すために外向きにふるまっているところがあるのです。いちばん気をつけたいのは、移り気と浮気心。激しい感情を持っていて、いったん燃えあがると止まらないこともあります。\n⑨数が破壊されると、光がまぶしすぎて足もとが見えなくなります。熱くなりすぎて争いを起こす。次から次へと異性問題を起こす。無理をして外見を飾る。お祭り騒ぎに夢中になる。人の迷惑を顧みずに動く。流行を追ううちに自分を見失う。判断を誤る。名を売ることに走る。友に裏切られる、陰口をたたかれる、裁判ざたになる、保証人になって損をする、火事にあう、結婚の縁がうまく結ばれない、うまくいったと思ったことが結局は損になる、といった形でも現れます。\n人生の流れでは、十代後半は明るく順調で、二十代は吉凶が揺れる時期です。焦らずに待つ人に福があります。三十六歳から五十四歳にかけてが本格的な上昇期。五十代後半は吉凶が大きく分かれます。三月・十二月生まれの人、酉年の十月生まれの人には⑨数が凶として働きます。体では、心臓、頭痛、目、胸、がん、日射病、泌尿器、不眠、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数①数の人で⑨数が吉数の人の場合、積極的に⑨の数を取る（引っ越しの時、番地、部屋番号に⑨を選ぶとか、⑨の数を貼ったアクセサリーを身につける）と以下の特性が生まれたり、その環境ができあがる可能性があります。\n陽性の気質になる。外向型のタイプになる。社交性がでる。。\n読書すきになる。知能があがる。美的感覚がよくなる。発明発見の才がめばえる。良い人人との交流に恵まれる。良縁に恵まれる。良い取引先に恵まれる。洞察力にすぐれてくる。名声があがる。昇進。栄転。繁昌する。と言った意味合いがあります。"}, "2-1": {"ba": "J", "text": "あなたは、落ち着いた態度で一歩一歩進んでいく人です。黙々として地味に見えても、内には、どこまでも新しい道を切りひらこうとする開拓者の心が燃えています。踏まれてもたたかれても、そこから立ちあがる雑草のような生命力。表はやわらかくても、芯はとても強い人です。①は水の数、独立と推理、潜在する力の数。その①が、人と人とのつながり、縁や信用をあらわすJ場に入っています。そのためあなたの運は、人を頼るのではなく、自分の力と、自分が積みあげた信用で切りひらいていく形になります。チャンスさえ来れば、相当な力を発揮できる人です。細かいところに目が届き、忍耐強く、独創的な考えも持っています。良い部下や取引先に恵まれ、新しいつながりが良い結果を生むこともあります。\nただ、人間関係の場に入った①は、ときに「一方通行」になりやすいところがあります。あなたが兄弟や身近な人のために尽くしても、困ったときに同じように返ってくるとは限りません。親切が思うように感謝されず、かえってそっぽを向かれることもあります。それでも、あてにせず、自分の足で歩くことが、この組み合わせの開運の道です。\n①数が破壊されると、つながりが暗い方へ流れます。陰うつで重苦しくなる。逆に何でも「自分が」というわがままが出る。神経質になって小さなことに思い悩み、妄想にとらわれる。疑い深くなって友に嫌われる。無口になる、嘘をつく、ごまかす。異性問題を重ねたり、お酒で失敗したり、秘密が知られて信用をなくしたりする。眠れずにいらいらする。良かれと思ってした手が、かえって失敗のもとになる。縁遠くなる。そうした形で現れやすくなります。戌年の人と九月生まれの人には、①数は凶として働きます。\n人生の流れでは、十歳前後に心配ごとが出やすく、二十歳前後に揺れがあります。二十五歳から三十歳ごろに調子が出てきて、三十代後半から四十代はじめが大きな曲がり角。本当の安定は四十三歳以降です。生年②の人は家庭や相続の悩みが出やすいので、⑧数・⑤数の年には気をつけてください。体では、腎臓、婦人科の病、胸、胃腸に注意しましょう。\n☆開運のために（インナーミラクル）\n生年数②の人で①が吉数の人の場合、積極的に①の数を取る（引っ越しの時、番地、部屋番号に①を選ぶとか、①の数を貼ったアクセサリーを身につける）と以下の長所が生まれる可能性があります。\n自力で運を切り開く。努力家タイプ。親切心と細事に眼が行き届く。繊細な神経をもつ。忍耐力が強い。独創的な思考。部下がよく働く。良い下請けに恵まれる。新しい取引が良い結果が生まれる。"}, "2-2": {"ba": "A", "text": "あなたは、正直で堅実、勤勉で忍耐強い人です。人の苦労を見るとじっとしていられない、情の深い心を持っています。②は大地の数、努力と忍耐と奉仕の数。その②が、生命と意志の中心、「わたし」そのものをあらわすA場に座るので、あなたは大地そのもののような人になります。なりふりかまわず、働くことが趣味かと思うほどよく働き、裸一貫から財をなす人もいます。踏まれてもたたかれても「なにくそ」と立ちあがる意志があり、柔和で温厚、貞節で、向上心も旺盛。質素な暮らしを大切にし、古い友に助けられ、土地に縁があります。信仰心の厚い人、霊的な感受性を持つ人も少なくありません。\nけれど、細かいことや古いことにとらわれやすく、くよくよする神経質な面もあります。涙もろく情に弱いので、損をしたり、人に利用されたりしやすい。家族から見ると、人が良くて働き者だと感謝されながら、どこか物足りなく思われることもあります。名前や生月・生日に⑪がある人は、女系の家族になる、養子を迎える・養子に行くといった縁が出やすくなります。\n②数が破壊されると、大地が荒れてしまいます。急に情がなくなってがめつくなる。働く意欲をなくして怠け癖がつく。決断できず、煮えきらない。粗野になる。いつもお金に追われ、楽しみのない暮らしになる。家庭がごたつく、母と意見が合わない、相続のことで難が出る。古い道具集めに夢中になる、片づけが苦手で部屋が散らかる、偏った信仰にのめりこむ、といった形でも現れます。\n人生の流れでは、十三歳ごろから上向きますが、まだ力は弱く、十九歳から二十四歳に一度下がります。二十五歳以降に運気が上がり、四十代が上昇と下降の分かれ目。四十五歳から再び上昇します。三月生まれの人には②数が幸運を呼びますが、四月・翌年一月生まれの人には凶として働きます。体では、胃腸、下痢、皮膚、じんましん、肌荒れ、骨折、関節に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数②の人で②数が吉数の人の場合、積極的に②の数を取る（引っ越しの時、番地、部屋番号に①を選ぶとか、②の数を貼ったアクセサリーを身につける）と以下の長所が生まれる可能性があります。\n働き者になる。良い部下に恵まれるようになる。柔和で温厚。貞節。辛抱強い。忠実さ。向上心が旺盛。調和ある行動。質素。土地で儲かる。古い友達に助けられる。細部を見渡す眼力。霊的な体質。信仰心がある。"}, "2-3": {"ba": "B", "text": "あなたは、正直で堅実でありながら、理想に向かって積みあげていく活力を持った人です。見かけは地味ですが、感覚は新鮮で、細かいところに気づく直観と、人を納得させる説得力を持っています。③は春の芽吹きの数、声と言葉、活動と発展の数。その③が、理想と権威、上に立つ力をあらわすB場に入るので、地味な中にも、にぎやかさや権威を求める気持ちがひそんでいます。ふだんはあまりしゃべらなくても、話しだすと細かいことや古いことまでよく覚えていて、驚くような話が出てきます。古いことを研究して新しい発見を導き出す人、発明の才を持つ人、音楽や言葉に才能を持つ人もいます。声に特徴があり、応対がよく、新しいものを生み出す力にも恵まれています。\n生月によっては、神経が細やかでぴりぴりした秀才型になったり、逆にしゃべりすぎて軽く見られたり、何でもできるという顔をして権威ぶったりすることがあります。\n③数が破壊されると、言葉と行動が離れていきます。大風呂敷を広げる。口のうまさにまかせて嘘をまことしやかに言う。でしゃばる。かっとなってけんか早くなる。言いわけばかりする。物事の締めくくりがなく、投げやりになる。商売でも大きなことばかり夢見て、内側はがたがた。だまされたり、詐欺にあったりする。突然声が出なくなる、言葉がつかえる、父と意見が合わずに家を飛び出す、といった形でも現れます。足のけがにも注意が必要です。\n人生の流れでは、十歳から十八歳ごろに最初の上昇があり、十九歳から二十四歳は運の弱い時期です。二十五歳ごろから本格的に上昇し、三十六歳ごろまで伸びていきます。四十代は大きく転換する人と急に伸びる人に分かれます。辰年の人、二月・十一月生まれの人には③数が凶として働きます。体では、神経痛、喘息、心の病、じんましん、胃腸、手足のけがに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数②の人で③数が吉数の人の場合、積極的に③の数を取る（引っ越しの時、番地、部屋番号に③を選ぶとか、③の数を貼ったアクセサリーを身につける）と以下の長所が生まれる可能性があります。\n親切な行為。態度、応答が良い。音声に特徴があり、綺麗です。フレッシュな感覚。回転が速い。努力家。新製品が当たる。新発見。若い有能な青年が集まる。有益な討論で盛り上がる。気概がある。明るい態度。"}, "2-4": {"ba": "C", "text": "あなたは、努力家で、お金の感覚にすぐれ、如才のない商才を持った人です。物を粗末にせず、人の面倒もよく見るので、自然にまわりに人が集まり、にぎやかな輪ができます。④は人と人とをつなぐ数、交流と縁と信用の数。その④が、お金と実りをあらわすC場に入るので、生年②の人にとって④は、金運を呼ぶ数になります。人づきあいの良さ、相手の心をつかむ商いの勘、正確な情報、良い取引先との縁が、そのまま実りにつながっていきます。結婚してから金運がつく人も多く、温和で順応性があり、人に好かれやすい人です。食べ物にくわしい人もいます。\nただ、世話好きで根っから親切なために、人のもめごとまで引き受けたり、仲裁に入ったりして振りまわされやすいところがあります。調子の良いときは気前よくふるまいますが、心のどこかに焼きもち焼きのところもあり、親切の押し売りで嫌われることもあります。\n④数が破壊されると、つながりがお金のもめごとに変わります。お金のトラブルや手形の災難。中傷や仲たがい。嫉妬深くなり、人の縁をうらやむ。遊びにお金を使い、無理をして見栄を張る。友にお金を貸して返ってこない。近所づきあいがうまくいかず、のけ者にされる。異性のことで信用をなくす。女性は夫の浮気に悩み、心が落ち着かなくなることもあります。\n人生の流れでは、十代後半から二十四歳ごろまでが揺れの時期で、二十五歳から力強く上昇します。三十代後半から四十代はじめは、揺れながら上がる人と下がる人に分かれます。人生の大きな分かれ道は五十五歳から六十歳。⑤数・⑧数の年には、どんでん返しが起きやすいので気をつけてください。三月・十二月生まれの人には④数が凶として働きます。体では、呼吸器、かぜ、胸、胃腸、皮膚、ヘルニア、外科的なけがに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数②の人で④数が吉数の人の場合、積極的に④の数を取る（引っ越しの時、番地、部屋番号に④を選ぶとか、④の数を貼ったアクセサリーを身につける）と以下の長所が生まれる可能性があります。\n良縁に恵まれる。結婚後金運がつく。社交性がある。努力家です。温順な人柄。順応性がある。人に好かれやすい。親切な心。商才がある。整頓が上手くなる。清潔好きになる。情報が正確になる。良いセールスに合う。技術の評判が良い。良い取引先に恵まれる。大衆者が当たる。通販で当たる。"}, "2-5": {"ba": "D", "text": "あなたの中には、親切な心と強引さが同居しています。器用でねばり強く、ふだんはなりふりかまわずこつこつと努力していますが、ここぞというときには、自分の意志をどうしても通そうとする強い自我が顔を出します。⑤は中心の数、意志と統率、管理と剛毅の数。その⑤が、改革と転換、家系と相続、蓄えをあらわすD場に入るので、あなたの意志は「変える力」として働きます。物事を改革する先見の明、投機の勘、細心でいて剛毅な心を持ち、裸一貫からチャンスをつかんで財をなす人もいます。物事を育てる力、全体をまとめる力にもすぐれています。人に縛られることを嫌い、いつも自由でありたいと願っています。\n細かいところに目が届くあまり、何でも貯めこむ人もいて、引っ越しのときに、よくこれだけ集めたものだと驚くかもしれません。改革の才があっても人に阻まれやすく、強引さがおかしな形で出ると、間違っていても押し通そうとしてしまいます。\n⑤数が破壊されると、意志が暴走するか、逆に崩れてしまいます。強引さが度を越して人に嫌われる。逆に意気地がなくなり、ぐずぐずと煮えきらなくなる。自分勝手な理屈で押し通す、独断で動く。一か八かの勝負や賭けごとにのめりこむ。父と合わずに家を出る。財産や家柄だけで人を判断する。物事が行き詰まってどうにもならなくなる。ひどくけちになる。悪い不動産業者にだまされる。空き巣に入られる。D場の数なので、跡継ぎがいない悩み、相続をめぐる兄弟の争いも出やすくなります。強迫観念に苦しむこともあります。\n人生の流れでは、十代後半から二十四歳ごろが運の弱い時期で、二十五歳から本格的に上昇します。四十歳前後がひとつの曲がり角で、五十歳以降はおだやかな運になります。生年②の人にとって⑤は変化しやすい数で、四月・七月・翌年一月生まれの人と未年の人には凶として働きます。体では、骨折、腰、背骨、首、胃腸、がん、脳卒中、盲腸、お酒による乱れに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数②の人で⑤数が吉数の人の場合、積極的に⑤の数を取る（引っ越しの時、番地、部屋番号に⑤を選ぶとか、⑤の数を貼ったアクセサリーを身につける）と以下の長所が生まれる可能性があります。\n強靱な精神と努力が実を結ぶ。不動心。起用。多芸。活力がでる。進歩的になる。親切になる。良い投機感覚をもつ。物事の育成がうまくなる。統括力がある。良い技術者が集まる。混乱期に成功。冒険的に試みが成功。良い管理能力者に恵まれる。行動力がある。物事が充実する。"}, "2-6": {"ba": "E", "text": "あなたは、頭が良く、人の面倒見もよく、自然と人に慕われる人です。行動力もあり、身分の上下を問わずこまめに動きまわり、じっとしていると手持ちぶさたで落ち着かないほどよく働きます。⑥は理想と権威、上に立つ力の数。その⑥が、知性と名声、学問と文書をあらわすE場に入るので、あなたには、自然に上へ押しあげられていく幸運があります。目上の人に目をかけられ、良い上司や指導者に出会い、努力が認められて地位が上がる。気品と知力を備え、大きな視点から物事を考える力が身についていきます。補佐役として抜群の才を見せる人、生真面目で折り目正しい人、竹を割ったようにさっぱりした人もいます。\nただ、神経が細かすぎて相手を窮屈にさせたり、ロマンに流れて現実から離れてしまったりすることがあります。考えがくるくる変わりやすいのも玉にきずです。\n⑥数が破壊されると、理想が見栄に変わります。名声を好み、権威に強く憧れ、政治的なことに引き寄せられて失敗する。傲慢になる、争いを好む、競争心のかたまりになる、執念深くなる。本当はけちなのに、人前では気前よくふるまって威張りたがる。賭けごとに凝る。父や長男、夫と意見が合わなくなる。夫の浮気やお酒に悩む。隠していた浮気が知られて家庭が騒がしくなる。相続の悩みや裁判ざたが起きる。むしゃくしゃした気持ちをスピードで晴らそうとして事故にあう、といった形でも現れます。かっとなりやすく、激しい感情が出ることもあります。\n人生の流れでは、十代は吉凶が揺れ、二十五歳ごろから上昇が始まって三十六歳ごろまで伸びます。強い人はそのまま四十八歳ごろまで好調ですが、三十七歳から四十二歳はどの人にとっても揺れの時期です。五十五歳から六十歳は、⑤数・⑧数の年に気をつけてください。五月生まれの人には⑥数が凶として働きます。体では、がん、目、心臓、脳の血管、胸膜、胃腸、アレルギー、骨折、のぼせ、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数②の人で⑥数が吉数の人の場合、積極的に⑥の数を取る（引っ越しの時、番地、部屋番号に⑥を選ぶとか、⑥の数を貼ったアクセサリーを身につける）と以下の長所が生まれる可能性があります。\n気品が出る。気力充実。知力がある。良い上司に恵まれる。名声が出る。努力が認められる。技術力が高い。良い指導者に出会う。物事が安定する。地位が上がる。多忙になる。大所高所から物事を考える能力が身につく。"}, "2-7": {"ba": "F", "text": "あなたは、地味で引っ込み思案に見えますが、内には独創的な考えと、物事を変えていく鋭い直観を秘めた人です。⑦は実りの数、お金と経済、そして神秘と信仰の数。その⑦が、隠れたもの、背後のもの、潜在する力をあらわすF場に入るので、あなたの力は表に出るより、内側で静かに働きます。神秘的な世界や信仰に心ひかれ、むずかしい哲学や古いことの研究に打ちこむ人もいます。お金に勘の働く人も多く、生月によっては、裸一貫からこつこつ築きあげる勤勉さと、思わぬときにまとまったお金が入る運を持つ人もいます。根は温和で親切、思いやりのある人で、細かいところまで見通す直観も持っています。\nただ、一つひとつの行動に硬さが出て、力がありながら損をしやすいところがあります。運気が沈みやすく、たまった気持ちを晴らそうとして思わず怒りを見せ、せっかくの物事を台なしにしてしまうことがあります。\n⑦数が破壊されると、内に秘めた力がよどみます。ねちねちと理屈を言って人を困らせる。頑固になって融通がきかなくなる。お金にけちになり、口うるさくなる。支払いの段になるとうまく席を外し、貸したお金はいつまでも忘れずに催促する。宗教に凝って周りに無理に勧め、家庭を乱す。人に隠れた異性関係で悩む。本業のかたわら内緒の仕事をする。秘密を持つようになる。部下や使用人が陰でごまかすようになる。盗難にあう、お酒で体をこわす、といった形でも現れます。\n人生の流れでは、十代後半から二十四歳ごろは心が荒れやすい時期で、暴走しないよう気をつけてください。二十五歳から上昇が始まり、三十六歳ごろまで続きます。三十代後半から四十二歳ごろまでは、運の強い人と弱い人に分かれます。遅れた人は四十三歳ごろからの上昇をしっかりつかんでください。六月生まれの人には⑦数が凶として働きます。体では、胸、歯、胃腸、盲腸、関節、神経痛、冷え、不眠、外科的な手術に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数②の人で⑦数が吉数の人の場合、積極的に⑦の数を取る（引っ越しの時、番地、部屋番号に⑦を選ぶとか、⑦の数を貼ったアクセサリーを身につける）と以下の長所が生まれる可能性があります。\n金銭感覚が強く計画性がある。目的に向かってもくもくと努力する。親切な心がある。勘が鋭い。地味でコツコツ蓄積する。行動に手堅さがある。理論的に物事を見抜く力。繁栄する。堅実経営。経営面に明るい知識。要領よく物事をこなす。"}, "2-8": {"ba": "G", "text": "あなたは、勤勉で、何かを根気よくこつこつと続けられる人です。根は善良で親切。そして内には、物事を改良し、改革していく特別な才能を秘めています。⑧は改革と蓄えの数、家系と相続の数。その⑧が、努力と忍耐、家庭や妻、大地をあらわすG場に入っています。ただ、生年②の人にとって⑧はもともと凶として働く数なので、運は全体に弱く、下積みの暮らしを余儀なくされることもあります。基礎づくりはうまくいくのに、仕上がる一歩手前で邪魔が入る、という形も出やすいでしょう。それでも、あなたが成功するかどうかは、物事が行き詰まって、右か左かの瀬戸際に立たされたときに決まります。そこが勝負どころです。この凶をやわらげ、良い方へ変える数は③。生年や命数、波動に③があれば、苦労を経たうえで、思いがけない開運を見せることもあります（辰年の人は③が凶なので、この働きはありません）。\n⑧の人に共通するのは、家族や兄弟、故郷や実家との縁がうすいことです。兄弟がいても仲が悪かったり、力にならなかったり、かえって重荷になったりします。心にいつも重いものを感じる、妻が病弱である、妻と意見が合わないといった、家庭の悩みも出やすくなります。\n⑧数が破壊されると、積みあげたものが崩れていきます。働いても働いても楽にならない。家に縁がなく、狭い住まいを転々とする。苦労して貯めたお金を悪い不動産業者にだまし取られ、家を建てる夢が破れる。何度も事業に失敗する。貯まったと思えば詐欺や火事で失う。跡継ぎがいない、相続で争う、養子を迎えてから財を失う。職を変えて失敗する。世の中の変化で地位や財産を失う。そうした形で現れやすくなります。\n人生の流れでは、十九歳ごろは上昇の準備をする底固めの時期で、条件が悪いと崩れやすいので油断は禁物です。本格的な上昇は三十三歳から。三十代後半に足踏みがあり、四十三歳からは安心して上がっていけます。七月生まれと翌年一月生まれの人は、とくに凶意が強く出ます。体では、盲腸、胃腸、便秘、関節、骨折、背骨、神経痛、蓄膿症に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数②の人は⑧数学凶数になるため③数が吉数になります。積極的に③の数を取る（引っ越しの時、番地、部屋番号に③を選ぶとか、③の数を貼ったアクセサリーを身につける）と⑧×をカバーできます。ただ、辰年の人は③も破壊数になりますので使用できません。④を取って下さい。"}, "2-9": {"ba": "H", "text": "あなたは、ロマンを持った人です。理想的なもの、高尚なものに憧れ、学問や芸術の空気にひたるのが好きです。直観力があり、活動家でもあります。⑨は夏の光の数、知性と名声、美と発見の数。その⑨が、行動と発展、声と言葉をあらわすH場に入るので、あなたの憧れは、外へ向かう行動になって現れます。発明や発見の才を秘めた人、計画性のある人も多く、新しいことを思いつき、研究を実らせ、努力が認められて人気が出る。にぎやかで華やかなものにひかれ、話も上手で、人づきあいも十分にできます。生月によっては、表は開放的でも、内面は案外保守的で、細かいことを気にする人もいます。\nただ、浮気心と新しがりやのところがあり、見栄を張る面もあります。孤独には耐えられない性分で、苦しい立場に立たされると感情的になり、とてももろくなります。移り気で、物事に一貫性を欠くこともあります。\n⑨数が破壊されると、光が外見ばかりを照らすようになります。女性は、子どもの才能を考えずに教育に熱中しすぎて、子どもを追いつめてしまう。役員などを無理して引き受ける。見栄っ張りになる。気ぜわしく落ち着かなくなる。歯の浮くような言葉を平気で口にする。夫と意見が合わなくなる。訪問販売にだまされやすい。隠しごとが知られないかと、いつも不安になる。浮気をくり返す、口先で異性を誘う、書類のミスで損をする、保証人になって損をする、裁判ざたになる、苦心した発明を横取りされて権利を失う、火事にあう、熱湯でやけどをする、といった形でも現れます。\n人生の流れでは、十代はおだやかで、十九歳から二十代は上昇の気配があっても底が不安定です。二十五歳から本格的に上昇する人もいます。三十代後半から四十歳前後はジグザグの運なので根気よく。四十三歳からは、遅れた人にも明るい見通しが開けます。八月生まれの人には⑨数が凶として働きます。体では、目、不眠、胃腸、腰、胆石、がん、骨折、のどの病、心の疲れに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数②の人で⑨数が吉数の人の場合、積極的に⑨の数を取る（引っ越しの時、番地、部屋番号に⑨を選ぶとか、⑨の数を貼ったアクセサリーを身につける）と以下の長所が生まれる可能性があります。\n頭脳明晰になる。発明・発見の才能が現れる。直感が鋭くなる。計画的になる。社交性が出る。新しいものに興味がわく。"}, "3-1": {"ba": "H", "text": "あなたは、現実を見る目の鋭い人です。表は冷静で無口に見えますが、それは用心深さからで、自分なりの意見はしっかり持っています。内面は強情で、人の意見を容易には受け入れません。①は水の数、潜在と推理、秘密の数。その①が、行動と発展、声と言葉をあらわすH場に入っています。生年③の人にとって①はもともと破壊数なので、春の活力の場に冷たい水が差すように、良い面より悪い面が出やすい組み合わせです。ときには素早く動くこともありますが、たいていは出だしで考えすぎ、「失敗したら」という思いにつきまとわれて迷い、石橋を叩きすぎてチャンスを逃してしまいます。慎重で秘密主義なのに、誘われるとぽろりと口をすべらせる。人の隠しごとを疑いの目で見たり、口にしたりしやすいところもあります。\nただ、この凶を良い方へ変える数があります。それは⑥。命数や波動に⑥があれば、物事を大きな視点で判断するようになり、行動に慎重さが加わって、隠れていた力が表に出てきます。上の人に力を認められる、思いがけないところから大きな取引が舞いこむ、といった開運もあります。⑧も、間接的に凶をやわらげます（申年の人は⑥が破壊数なので、⑧でやわらげます）。\n①数が破壊されると、水が暗くよどみます。神経質になって妄想に悩まされる。陰気で重苦しくなる。人の秘密やうわさ話に興味を持つ。陰で不平不満をこぼす。悪知恵が働くようになる。お酒でからむ、けんか早くなる。色ごとに溺れて身を誤る。結婚をえさにだまされる。人に言えない異性関係で、心の底でいつも苦しむ。部下や同僚に裏切られ、部下の不正の責任を負わされて信用をなくす。中傷や悪評に悩む。そうした形で現れやすくなります。\n人生の流れでは、二十五歳ごろから運が開けますが、三月・四月・六月生まれの人は開運が遅れ、四十歳前後にようやく上向く傾向があります。上昇しても落とし穴があり、力を十分に出しきれない難しさを抱えています。金運は⑤数や⑦数の時期に開けやすいので、波動がその数になるときは大きく伸びる可能性があります。五月生まれの人はとくに凶意が強く出ます。体では、神経痛、言葉の障害、腎臓、婦人科の病、冷え、不眠、恐怖症に気をつけてください。\n☆開運のために（インナーミラクル）\n命数や波動数理に⑥数があると破局性をカバーして吉化するときもあります。\n潜在的に思考が大局的になる。行動が慎重になる。隠れた性能が表れる。発展のチャンスをつかむ。上司に性能を買われる。大きな取引が思いかけないところから飛び込む。といった意味が出ます。"}, "3-2": {"ba": "J", "text": "あなたは、活発に動きまわるときと、急に引っ込み思案になるときの、両方の顔を持っています。創造力と、霊的な直観にも恵まれています。②は大地の数、努力と誠実、人に尽くす心の数。その②が、人と人とのつながり、縁と信用をあらわすJ場に入るので、生年③の人にとって②は、誠実さによって良い人間関係を呼び、発展をもたらす数になります。本来、勤勉で正直、親切な人。用意周到で辛抱強く、良い部下や協力者に恵まれ、人を育てることにも心を注ぎます。言葉がはっきりしていて、応対にも好感が持たれます。\nただ、人が良すぎて、頼まれるといやと言えず、友の面倒や後始末まで引き受けて、振りまわされたり、利用されたりしやすいところがあります。感覚は細かく鋭いのに、細部にとらわれて慎重になりすぎ、決断が鈍って、行動が後手にまわりがちです。早めに動くことを心がけてください。表は新しがりやに見えて、内面は案外古風で地味なところもあります。\n②数が破壊されると、大地が乾いてしまいます。感覚が鈍り、意欲をなくす。注意が散漫になる。働く気をなくして、遊びや趣味に夢中になり、本業を留守にする。古いものに異常に執着して、手当たり次第に集めたり、修理に夢中になったりする。口先ばかりで働きがともなわない。ふだんは親切なのに、急に激しくなって努力を無にする。こつこつ貯めたお金を友や親戚、兄弟に貸して戻ってこない。悪い不動産業者にとんでもない土地をつかまされる。隠していた昔のことが知られて信用をなくす。妻が病弱である、古い持病に悩む、といった形でも現れます。\n人生の流れでは、運気が上向くのは二十五歳以降です。上昇が遅れた人には四十歳が一つの曲がり角になります。五十代後半は、どの人にとっても運命の大きな曲がり角になるので、慎重に歩んでください。六月生まれの人と亥年の人には②数が凶として働き、人間関係がうまく回らず、内にこもりやすくなるので、気力を奮い立たせてください。体では、胸、咳、胃腸、肌荒れ、脱毛、腎臓、神経の疲れ、がんに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数③の人で②数が吉数の人の場合、積極的に②の数を取る（引っ越しの時、番地、部屋番号に②を選ぶとか、②の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n活動的になる。親切になる。用意周到。辛抱強い。決断が早い。良い部下に恵まれる。 良い下請けに恵まれる。細部を見通す眼力がでる。向上心が旺盛。意欲的な行動。部下の育成に意をそそぐ。言語明晰で応答態度に好感がもてる。回転が速くなるとかの意味合いが出ます。"}, "3-3": {"ba": "A", "text": "あなたは、才気あふれる人です。何でもやりこなす力を持ち、にぎやかなもの、華やかなものに心ひかれます。③は春の芽吹きの数、声と音と言葉、若々しい活力の数。その③が、生命と意志の中心、「わたし」そのものをあらわすA場に座るので、あなた自身が春の勢いそのものになります。感覚は新鮮で鋭く、活力も十分。言葉の才、話の上手さ、音楽や文学の才を持つ人、発明の才を持つ人もいます。直観が鋭く、動きがきびきびしていて、新しいものを生み出し、評判を呼ぶ力にも恵まれています。\nいちばん気をつけたいのは、「出る杭は打たれる」ということです。思いがけないところでつまずく、隠れた危うさを持っています。しゃべりすぎたり、出しゃばったりするのはマイナスです。自分から前に出なくても、自然にそういう場が生まれて、光を浴びる機会は十分にあります。おっとりと構えているほうが、運は開けます。強引さは禁物です。\n③数が破壊されると、春の勢いが荒れた風になります。神経がたかぶっていらいらし、心が疲れきってしまう。しゃべりすぎて軽く見られ、「おしゃべりな人」と陰で言われる。高慢で口うるさくなって嫌われる。自慢ばかりする。口から出まかせの嘘をつく。かっとなってヒステリックにふるまう。言葉がつかえる、うまく話せなくなる。友に裏切られる、中傷や悪評に悩む。お金や異性、結婚話のもめごと。父と対立して家を出る。けんか早くなる。口先だけで行動がともなわない。そうした形で現れやすくなります。\n人生の流れでは、十八歳ごろまで上昇の気配はあっても力が弱く、二十七歳ごろまでは揺れが続きます。二十八歳を過ぎてから上昇の気運が見えはじめ、四十歳を中心に運の強弱が分かれます。六十代が人生の分かれ目です。三月生まれの人には③数の凶意が強く働き、四月・六月・七月生まれの人には吉凶が半々に出ます。体では、喘息、のど、神経痛、のぼせ、肝臓、腎臓、婦人科の病、心の不安定に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数③の人で③数が吉数の人の場合、積極的に③の数を取る（引っ越しの時、番地、部屋番号に③を選ぶとか、③の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n直感が鋭くなる。言語感覚が鋭くなる。新鮮さがある。新商品が当たる。人気が爆発的に出る。新しく発見する。進出する。発展する。回転が速くなる。動きが敏捷になる。若々しくなる。キビキビしてくる。才能のある青年に恵まれる。評判がよくなる。"}, "3-4": {"ba": "B", "text": "あなたは、実直で親切な人です。物事をまとめる力、調べて整理する力に、特別なひらめきを持っています。④は人と人とをつなぐ数、交流と縁と信用の数。その④が、権威と理想、目上の人や父・夫をあらわすB場に入るので、あなたの人づきあいの力は、上の人からの引き立てや援助となって返ってきます。信用を得やすく、社交性も十分で、誰とでもすぐ親しくなれる。情報を集める力、良い評判、販路を広げる力、良縁にも恵まれやすい人です。生まれつき、内に権威を重んじる気風も備えています。\nただ、信用や体面を重んじるあまり、「長いものには巻かれろ」というずるさが出たり、自分の信用に傷がつきそうなことには深入りしない臆病さが出たりします。調子に乗りやすく、お節介を焼きすぎるところもあります。部下や同僚の面倒を見ても裏切られやすく、権威に弱いために、かえって部下を裏切る形になることもあるので、慎重に動いてください。巳年の人は、結婚のもめごと、縁遠さ、父との縁のうすさや衝突、夫の浮気の悩みが出やすくなります。\n④数が破壊されると、つながりがほころびます。結婚運が悪くなる。色ごとのために家庭を顧みず、夫婦とは名ばかりの、気持ちの通わない暮らしを体面だけで続ける。わがままになって、夫や先輩、上司と争う。契約の話が途中で変わって損をする。部下に裏切られる。地位を鼻にかけて人を見下す。中傷や悪評に悩む。見栄を張って夫に内緒で借金をし、一人で返済に苦しむ。お節介から友のもめごとに巻きこまれる。旅先でもめごとやけがにあう。そうした形で現れやすくなります。\n人生の流れでは、十代はおだやかで、二十代前半に揺れがあります。運気の上昇は二十五歳を過ぎてからで、三十歳ごろから力が強まります。遅れた人は四十歳ごろから上がりはじめます。強い人は五十代が安定した時期です。八月生まれの人と巳年の人には④数が凶として働き、巳年の五月生まれの人はとくに凶意が強く出ます。体では、胸、かぜ、脱毛、神経痛、腎臓、泌尿器、冷え、不眠に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数③の人で④数が吉数の人の場合、積極的に④の数を取る（引っ越しの時、番地、部屋番号に④を選ぶとか、④の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n情報網が完備する。調査能力が出る。良い情報をキャッチする。評判が良くなる。販路が拡張する。人に好 かれる。融通がきく。他の人々ともすぐ親密となる。物事に対して順応性がでてくる。温順な人柄になる。世話好きになる。良縁に恵まれる。大量の取引。商才が出てくる。几帳面になる。といった意味が出ます。"}, "3-5": {"ba": "C", "text": "あなたは、お金を生むことに鋭い感覚と執念を持った人です。計算にすぐれ、こつこつ積みあげるより、一度にどんと大きくつかみたい気持ちを、いつも内に秘めています。⑤は中心の数、意志と統率と剛毅の数。その⑤が、お金と経済、実りをあらわすC場に入るので、生年③の人にとって⑤は金運を呼ぶ数になります。目的に向かって黙々と頑張る強い意志、変革のときに大きなチャンスをつかむ勝負勘、器用さと統率力。お金の面での計画性もあり、波動しだいでは、金もうけの機会が向こうから転がりこんでくることもあります。\nただ、損得の計算が先に立って、人情がうすくなりやすいところがあります。自分本位に物事を考え、言うことと行うことが別になる。人のお金には口うるさいのに、自分には甘い。人によっては、とてもけちになったり、人の迷惑を考えず、法に触れないぎりぎりのところで自分の利益だけを追ったりします。生月によっては、お金のために態度ががらりと変わる、執念深くまとわりつく、衝動的に動く、といった面も出ます。\n⑤数が破壊されると、お金が人生を振りまわすようになります。お金のために一生苦しむ、争いが絶えない。財力を鼻にかけて無理押しする。お金しか信用しなくなる。苦労して築いた財産をめぐって相続の争いが起きる。不正をして大きく取りこむ。何度も不渡りをつかまされ、働いても楽にならない。逆に、自分だけ得をするような倒産を企てる。保証人になって責任を負う。遊びや色ごとで財を失う。うまい話に乗って投資に失敗する。宗教に凝って狂信的になる。お金のために地位や信用を失う。そうした形で現れやすくなります。\n人生の流れでは、十代は順調で、二十代は吉凶が揺れます。三十一歳ごろから上昇気味になり、遅れた人には三十六歳ごろから二度目の上昇が来ます。一生の大きな転機は四十六歳から五十歳で、ここから上がり続ける人と下がる人に分かれます。九月生まれの人には⑤数が凶として働きます。体では、食中毒、胸、口の病、がん、婦人科の病、外科的な手術に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数③の人で5数が吉数の人の場合、積極的にの数を取る（引っ越しの時、番地、部屋番号に⑤数を選ぶとか、の⑤数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n意志が強くなる。目的に向かって黙々と頑張る強靱な精神力が出てくる。投機感覚が鋭くなる。剛毅（意思がしっかりして、物事にひるまない）な性格になる。器用。多芸になる。進歩的になる。考えが前向きになる。統括力が出てくる。勘が鋭くなる。強引さがプラスに働く。強力なパトロンを持つ。管理能力が冴える。充実する。"}, "3-6": {"ba": "D", "text": "あなたは、理想を追う人です。頭が良く、人とは違った角度から物事を見つめ、すぐれたアイデアを持っています。⑥は理想と権威、上に立つ力の数。その⑥が、改革と転換、家系と相続をあらわすD場に入るので、あなたの理想は、行き詰まったものを立て直す力として働きます。人が失敗したことを引き受けて挽回し、信用と名声を得る。行き詰まった物事を改革して良い結果を生む。相続の面で幸運に恵まれる人もいます。高尚さや権威を求め、活動的で向上心も旺盛。上の人の引き立てや紹介を受け、大きな視点から判断する力も持っています。勘も鋭く、話も多弁になりやすい人です。\nただ、計算高くなると目上にばかり取り入り、物事の進み具合によっては途中で急に向きを変えて、同僚を裏切ってしまうことがあります。そのために敵をつくりやすいところがあります。口ではかっこいいことを言っても、行動がともなわない人もいます。申年の人は⑥数が凶として働き、相続の難、父との縁のうすさや衝突、夫の浮気の悩みが出やすくなります。\n⑥数が破壊されると、理想が空まわりします。家族や親戚の家柄、地位、財産を鼻にかけて自分の力不足を隠そうとする。大きなことばかり夢見る。かっとなりやすく、執念深くなって、からんでけんかになる。親分らしく見せたくて無理をする。異性のもめごと、お酒の乱れ、賭けごと、車やスピードへの熱中。家を新築したとたんに夫を亡くす、相続で争う、養子を迎えてから家庭がうまくいかなくなる、懸命に働いても商売がうまくいかず失敗が続く。そうした形で現れやすくなります。\n人生の流れでは、七歳から十八歳ごろはおだやかで、二十代後半は揺れやすい時期です。運気の上昇は三十一歳を過ぎてからで、強い人は四十八歳ごろまで順調に進みます。五十歳前後は良い運と悪い運に分かれやすい時期です。申年の人、とくに申年の二月生まれの人には凶意が強く出ます。体では、骨折、関節、胸膜、血圧、冷え、神経痛、腎臓、肝臓、気持ちの沈み、心の疲れに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数③の人で⑥数が吉数の人の場合、積極的に⑥の数を取る（引っ越しの時、番地、部屋番号に⑥を選ぶとか、⑥の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n物事が安定する。多忙になる。調和ある言動。高い理想に向かって黙々と努力する。変わり身が早い。行動範囲が広くなる。目上の人から、援助、引き立て、紹介を得る。発展する。よい上司に恵まれる。統率力が出てくる。大所高所から判断するようになる。機械設備が完備するようになる。"}, "3-7": {"ba": "E", "text": "あなたは、感受性が鋭く、頭の切れる人です。企画し、分析する力を持ち、物事を理詰めで考え、あいまいなことを嫌います。⑦は実りの数、お金と経済、そして神秘と信仰の数。その⑦が、知性と名声、学問と精神性をあらわすE場に入るので、あなたの中では、精神的なものと現実的なものが二つの方向に分かれて働きます。ちょっとしたきっかけで神秘の世界に興味を持ったり、いつのまにか信仰の縁につながったりする一方で、経済にすぐれた才を持つ人、数字に明るく、計算や予測が正確な人もいます。商才があり、要領よく物事を処理し、独創的な見方で金もうけの勘も鋭い。敬虔な心と円満さを持つ人もいます。\nただ、理屈っぽさと堅さが表に出やすく、人に近寄りがたく思われることがあります。暮らしの面では、明るく華やかな環境を求めて贅沢になりやすく、つまらないところで無理に見栄を張ってしまうこともあります。浮気心から、異性とのつきあいが乱れやすい面もひそんでいます。\n⑦数が破壊されると、知恵が損得の計算に縛られます。理屈っぽくなって敬遠される。お金にがめつくなる。芸ごとや飲み食い、遊びに夢中になって、家庭や本業を留守にする。お金のもめごとが起きる。物事の締めくくりがなくなる。頑固になる。判断を誤る。気分屋になる。人生の半ばで百八十度の大転換が起きる。信用の問題で悩む。異性とのもめごと、結婚生活の危機、縁遠さ。裁判ざた。思いこみにとらわれる。人の隠しごとを暴きたがる、といった形でも現れます。\n人生の流れでは、子ども時代から十代はおおむね順調です。二十二歳から二十四歳は運の弱い時期になりやすく、三十歳前後に、上昇する人と低迷する人に分かれます。強い人は四十二歳ごろまで上昇運です。五十代に吉凶が二つに分かれます。二月・十一月生まれの人と、寅年の十二月生まれの人には、⑦数が凶として働きます。体では、心臓、胸、目、やけど、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数③の人で⑦数が吉数の人の場合、積極的にの数を取る（引っ越しの時、番地、部屋番号に⑦を選ぶとか、⑦の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n直観力が鋭くﾅる。頭の回転が速くなる。理論的思考に富んでくる。経済感覚が鋭くなる。商才が出てくる。要 領よく物事を処理するようになる。分析能力がでてくる。金儲けの勘が鋭くなる。独創的な見方、考え方をするようになる。計算、予 測が正確になる。敬虔な宗教心が出てくる。円満な人相。利権が手に入る。といった意味合いが出てきます。"}, "3-8": {"ba": "F", "text": "あなたは、冷静なまなざしの奥に、鋭い感覚と創造性を秘めた人です。仕事の面でも、表には出さない、いろいろなアイデアと計画を持っています。⑧は改革と蓄えの数、家系と相続の数。その⑧が、隠れたもの、潜在する力をあらわすF場に入るので、あなたの力は、表面ではなく内側で、静かに積みあがっていきます。蓄財の才があり、表は派手に見えても、陰では地味にこつこつ貯えていく。運が弱いときでも、忍耐強く努力を重ねていけます。社交上手ではないので地味に見られ損をしがちですが、内には大きな自信と、誰にも負けない忍耐力と研究熱心さがあります。焦らずに一つのことに打ちこめば、きっと望みはかないます。\nただ、感じとる力のわりに、それが行動に結びつきにくいところがあります。「もうそろそろ自分が表に出る番だ」と期待しても、線香花火のようにすぐ下火になりやすいので、無理につま先立ちで歩かず、どっしりと腰を落ち着けて、周りから自然に持ちあがってくるチャンスを待ってください。チャンスが来れば、一躍脚光を浴びる可能性は十分にあります。\n⑧数が破壊されると、静かに積んだものが崩れます。こつこつ築いた財産や地位を、つまらないことで失う。家を新築したと喜んでいたら、突然火事で失う。息子のことで家庭がめちゃくちゃになる。賭けごとで家屋敷を失う。お酒や色ごとで人生を誤る。夫婦の縁がうまくいかない、子どもに恵まれない、跡継ぎがいない、相続や家屋のことで争う。貧しさから抜けきれない。気持ちが沈む。口車に乗せられて失敗する。そうした形で現れやすくなります。\n人生の流れでは、十代後半から二十四歳ごろまでは運の弱い時期で、焦りや暴走は禁物です。二十五歳から上昇が始まり、二十八歳から三十歳に運が満ちてきます。三十代から四十歳までに上昇が確かになりますが、四十代は伸び悩みの足踏みの時期なので、自重してください。五十代半ばに運が大きく二つに分かれます。三月・十二月生まれの人には⑧数が凶として働きます。体では、腰、背骨、鼻、リウマチ、神経痛、腎臓、泌尿器、冷えに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数③の人で⑧数が吉数の人の場合、積極的に⑧の数を取る（引っ越しの時、番地、部屋番号に⑧数を選ぶとか、⑧の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n忍耐強くなる。勤勉になる。改革性が生まれる。よいアイデアが浮かぶ。節度ある行動がとれるようになる。変わり身が速くなる。じっくりものごとをみて判断するようになる。伝統を重んじるようになる。酔い相続者に恵まれる。設備投資がうまく行く。組織替えを行い気分転換しやる気が出る。しっかりした組織になる。交代の時期が的確になる。組織の内部が堅固になる。とかです。"}, "3-9": {"ba": "G", "text": "あなたは、頭の回転が速く、なかなかの切れ者です。細かいところにまで目が届いて器用で、口も達者。勘が良く、活動力もあります。⑨は夏の光の数、知性と名声、美と発見の数。その⑨が、努力と忍耐、家庭や妻、支える人をあらわすG場に入るので、あなたの輝きは、身近な人の支えとともに現れます。⑨が良く働いているときには、部下や友、妻の助けで、予想以上の成果をあげ、仕事で脚光を浴びるチャンスがあります。生月によっては発明や発見の才を持つ人、学問や芸術を好む人もいます。高度な知識や技術、正しい判断と予測、研究の充実にも恵まれています。\nただ、物事に熱中するあまり、周りとの調和を崩して妬まれたり、相手の策に乗せられたりしやすいところがあります。気分にむらがあり、じっと耐えて自重することが苦手で、図に乗って物事を壊してしまうことも。口で理想を語っても行動がともなわず、痛くもない腹を探られることもあります。自分を売りこみたい気持ちも心にひそんでいます。\n⑨数が破壊されると、光が家庭の外へ散っていきます。妻と意見が合わなくなって家庭が乱れる。浮気心から色ごとの問題を次々に起こし、信用をなくす。暮らしが派手になって無駄づかいが増える。気分に流されて地道な努力をしなくなる。部下に裏切られる。文書や名誉のことで争う。知識や学歴をひけらかして敬遠され、助けてくれる人がだんだん減っていく。華やかな暮らしに憧れて怠ける、お金に困って過ちを犯す。親と意見が合わずに家を出る。大きな夢ばかりで実現しない。土地の争い、放火、相続のもめごと。病気がちになる。そうした形で現れやすくなります。\n人生の流れでは、十代は心が不安定になりやすく、思いどおりにならない時期なので自重してください。十九歳から二十七歳は上昇の気配があっても本格的にはつながりにくく、三十歳前後から上昇に向かう人が出てきます。五十代半ばから六十代前半に、運命が大きく二つに分かれます。寅年の人と、四月・翌年一月生まれの人には⑨数が凶として働きます。体では、心臓、目、やけど、がん、血圧、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数③の人で⑨数が吉数の人の0 場合、積極的に⑨の数を取る（引っ越しの時、番地、部屋番号に⑨数を選ぶとか、⑨の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n技術、知識が高度になる。繁昌する。人気が出る。頭が良くなる。試験に合格する。権利を手にする。 発見、発明する。正しい判断力がついてくる。正しい予測ができるようになる。研究が充実する。研究所の内部が充実する。頭脳集団になる。裁判に勝 つ。高尚。名声。といった意味があります。"}, "4-1": {"ba": "G", "text": "あなたは、すばらしい推理力と創造力、そして内に秘めた活動力を持つ、独立独歩の人です。親や親族の助けを待つより、裸一貫、自分の力で道をひらいていく気概が似合います。①は水の数、独立と進歩、推理と潜在する力の数。その①が、努力と忍耐、大地と家庭をあらわすG場に入るので、あなたの独立心は、地に足のついた歩みの中で育ちます。社交性も十分で、物事をまとめ、推理する力が強く、冷静に判断し、人を惹きつける魅力と誠実さも備えています。新しい取引やつながりが始まる運もあります。\nただ、負けん気が強く、いつも先頭に立ちたい、人を動かしたいという気持ちが知らず知らず表に出て、野心家に見られやすいところがあります。生月によっては、使い走りのように人に利用されやすい面もあります。あなたは攻めには強くても、守りが弱い人です。早く結果を求めるより、どっしりと腰を落ち着けて足もとを固め、一歩一歩確かに進むことを身につけてください。一か八かの冒険は禁物です。\n①数が破壊されると、水が地中で冷たくよどみます。迷いが多くなり、陰うつになる。無口で引っ込み思案になる。疑い深く、頑固になる。誠実さが薄れてごまかすことを覚える。怠け癖がつく。人に疑われるようなことをする。人の言葉に動かされやすく、本当の友がいなくなる。G場の数なので家庭にも影が差し、妻が病弱になって家の中が暗くなる、妻と意見が合わずに外に心を移す、色ごとやお酒に溺れる、夜遊びをする、といった形にもなります。土地のもめごと、日当たりのことで隣ともめる、水害、溝や穴に落ちてけがをする、という暗示もあります。\n人生の流れでは、二十歳を過ぎると上昇気味になります。生年④の人にとって三十三歳から三十六歳は破壊期なので、慎重に。大きく運が開くのは三十七歳ごろ以降なので、大きな計画はそこに照準を合わせると力が確かに出せます。二月・十月・十一月生まれの人と、午年の一月生まれの人には①数が凶として働きます。体では、腎臓、胃腸、冷え、婦人科の病、痔、不眠、胸、神経痛、お酒の乱れに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数④の人で①数が吉数の人の場合、積極的に①の数を取る（引っ越しの時、番地、部屋番号に①数を選ぶとか、①の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。（あくまで可能性ですが）\n物事を新保的に捉える。また冷静な考えにたって判断がおこなえるようになる。人をひきつける魅力を醸し出す。社交性を身につけるようになる。柔和な態度。人をそらせない態度。知性を身につける。新しい道が開ける。推進力がでてくる。誠実さが出てくる。というような意味合いが出てくる可能性があります。"}, "4-2": {"ba": "H", "text": "あなたは、細かいところにまで目が届き、感覚が鋭く、手先も器用な人です。親切で社交性もあり、自然に人が集まってくる不思議な運を持っています。②は大地の数、努力と忍耐、育てる力の数。その②が、行動と発展、春の芽吹きをあらわすH場に入るので、あなたの努力は、時が満ちると芽を出し、ぐんぐん伸びていきます。初めは地味で、もたもたしているように見えますが、土台が固まり、先の見通しが立ってくると、感覚はますます冴え、見違えるほど活発に動きだして、思いがけない成果をあげます。どんな困難にもくじけず、初めの志を貫く気力と忍耐力。表はやわらかく、誰とでも気さくに友だちになれます。古いことを研究して新しい面を掘り起こす才、霊的な直観、物事を育てる才能も隠れています。物事に正面から四つに組めれば、必ず大きな成果が期待できます。\nただ、その強さが表に見えない分、内に頑固さを抱えているところもあります。\n②数が破壊されると、大地が硬くこわばります。頑固で口うるさくなる。人に従うのを嫌って、強情でわがままにふるまう。謙虚さがなくなる。怠け癖が出て、誠実さが欠けていく。家では妻にばかり我慢を強いて、自分は勝手にふるまう。部下を育てても肝心なときに力にならず、逃げられたり裏切られたりする。神経質でぴりぴりする。言うことと行うことがちぐはぐになる。努力しても努力しても成果があがらない。陰で悪口を言われ、中傷に悩む。土地のことで争って神経をすり減らす。色ごとに溺れて信用をなくす。そうした形で現れやすくなります。\n人生の流れでは、少年期は上昇気味に進みます。二十五歳から二十八歳が、上がる人・横ばいの人・下がる人の分かれ目です。三十三歳から三十六歳は生年④の破壊期で、人間関係が悪化しやすいので気をつけてください。四十代は好調に進む時期です。五十代後半から六十歳までが、運命の吉凶の分かれ目になります。十月・八月生まれの人には②数が幸運を呼びます。酉年の人と、二月・十一月生まれの人には凶として働きます。体では、胃腸、肌荒れ、神経痛、言葉の障害、不眠、胸、がん、心の疲れに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数④の人で②数が吉数の人の場合、積極的に②の数を取る（引っ越しの時、番地、部屋番号に②数を選ぶとか、②の数を貼ったアクセサリーを身につけるとかする）と以下の長所が出てくる可能性があります。\n労働意欲が高まる。下請けに恵まれる。技術力が高度になる。細部に気がつくようになる。創造性が高まる。研究熱心になる。温和な性格になる。教育熱心になる。献身的になる。用意周到になる。土地・材料でもうける。というような特性が出ます。"}, "4-3": {"ba": "J", "text": "あなたは、如才のない、人を惹きつける社交性を持った人です。誰とでもすぐ友だちのように親しくなれ、あなたがふと口にした一言には、相手を魅了する不思議な力があって、実力以上に買われやすいところがあります。③は春の芽吹きの数、声と言葉、活動の数。その③が、人と人とのつながり、情報や縁をあらわすJ場に入るので、あなたの言葉の力は、人の輪の中で大きく広がっていきます。裸一貫で財をなす人もいて、音楽や言葉、話術に特別な才能を持つ人もいます。世話好きで常識が発達し、調べる力、まとめる力もあります。\nただ、生年④の人にとって③は破壊数です。上昇の運に入っても力が弱く、そのまま横すべりしたり、良い運も短く終わったりしやすいところがあります。にぎやかで華やかなものに心を奪われ、花を求めて移り歩くように、じっとしていられない。そのため耳学問になりやすく、一般的な知識や常識は豊かでも、一つの道を深く突き進めるのは苦手です。運はおおむね四十歳までが盛りなので、後半に逆転しないよう、それまでに基礎を固めておいてください。予期しない事故で手足をけがする、言葉や耳の障害にかかる、といった暗示もあるので注意が必要です。\n③数が破壊されると、言葉が人を傷つける刃になります。進むことは知っても退くことを知らない。悪い仲間が集まって、身の回りにもめごとが絶えない。大言壮語ばかりで行動がともなわない。かっとなりやすく、けんか早くなる。悪い評判が立つ。嘘をつく。詐欺のようなことをする。しゃべりすぎて軽く見られる。色ごとに溺れ、異性問題がついてまわる。友に裏切られ、利用される。縁談が出ても途中で立ち消えになり、結婚しても口げんかが絶えない。夫の浮気に悩む。そうした形で現れやすくなります。\n人生の流れでは、子ども時代は不安定ですが、十三歳を過ぎると整いはじめ、二十歳前後から上昇の気運と活力が出てきます。三十三歳から三十六歳は生年④の破壊期です。三月・六月・十二月生まれの人はとくに凶意が強く出ます。体では、喘息、神経痛、胸、のぼせ、ヒステリー、手足の外科的な手術に気をつけてください。"}, "4-4": {"ba": "A", "text": "あなたは、如才ない社交性を持ち、人に好かれる得な人です。内面は案外強情なのに、表はやわらかく寛容で、包みこむような大らかさがあるので、自然に人が集まってくる徳を持っています。ときに憎まれ口をたたいても、どこか愛嬌があって、相手に嫌な思いをさせない不思議な雰囲気もあります。④は人と人とをつなぐ数、交流と縁と信用の数。その④が、生命と意志の中心、「わたし」そのものをあらわすA場に座るので、あなた自身が、人と人とを結ぶ要になります。勘が鋭く、物事をまとめたり整理したりする才能が隠れていて、もめごとや気まずい空気をほどくのが上手です。活動的で、信用を受けやすく、情報が正確で、連絡も速く確か。整頓好きで、商才もあります。\nただ、面倒見の良さが高じてお節介になり、相手のもめごとにまで深入りして巻きこまれることがあります。親切があだになって返ってきたり、簡単に調子を合わせて口先だけの約束を乱発してしまったりすることもあるので、気をつけてください。\n④数が破壊されると、つながりの糸がもつれます。人の面倒を見ても感謝されるどころか、恩を仇で返される。自分本位にふるまって調和を崩す。旅行好きなために、旅先で災難にあう。中傷や陰口に悩む。浮気心が強くなり、異性の間を転々として身を誤ったり、信用をなくしたりする。何度お見合いをしても途中で話が壊れ、縁遠くなる。結婚できても、初めの約束が変わって「だまされた」という結果になりやすい。そうした形で現れやすくなります。\n人生の流れでは、十三歳ごろから上昇気味になり、安定した運が続きます。三十三歳から三十六歳は生年④の破壊期なので注意が必要ですが、そこを過ぎると、運の定まった人は力強く上昇していきます。六十五歳から七十二歳ごろが、晩年の吉凶の分かれ目です。四月・一月・八月生まれの人には、④数が吉と凶の半々に働きます。体では、胸、喘息、脱毛、神経痛、ヘルニアに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数④の人で④数が吉数の人の場合、積極的に④の数を取る（引っ越しの時、番地、部屋番号に④数を選ぶとか、④の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n整理・整頓好きになる。調査能力が強くなる。正しい情報に出会う。連絡を密にし素早く確実になる。評判があがる。信用してもらえる。世話好きになる。融通が利くようになる。商才がよくなる。いい縁に恵まれる。販路拡大、良い取引先に恵まれる。良いセールスマンが集まる。といった意味合いが出ます。"}, "4-5": {"ba": "B", "text": "あなたは、こせこせしたことや小さな問題には目もくれず、大きな問題、権威あるものに向かっていく人です。人がどう見ようと、どう考えようと気にかけず、自分の考えに向かって突き進む剛気さを持っています。⑤は中心の数、意志と統率と管理の数。その⑤が、権威と理想、上に立つ力をあらわすB場に入るので、あなたには、人を束ね、上に立つ器が備わっています。物事を掌握する術が自然に身についていて、政治的な力も十分。若くして大家の風格を見せる人、将来を期待させる「何か」を持つ人、グループのリーダーとして人を包みこみ、人間関係をうまく動かす親分肌の人もいます。調べる力、まとめる力もあります。\nそのため、こつこつ積みあげることは好まず、一度にどんと成果をあげる、一攫千金のような夢を見やすいところがあります。強引に物事を進めて争いを招いたり、大ざっぱに考えすぎたりする点が、しいて言えば欠点です。\n⑤数が破壊されると、上に立つ力が圧力に変わります。人の親切を当たり前と思い、感謝の気持ちが薄れる。ずる賢くなる。疑い深くなる。素直さがなくなり、物事を自分本位に解釈する。ワンマンになって、人に威圧感や恐れを与える。逆に、上の人からの圧迫や周りの環境に、自分の意志を阻まれる。口では権威ぶっても足が地に着かず、理想倒れになる。物を壊したり、争いを好んだり、賭けごとに凝ったりする。狂信的になる、誇大な思いこみにとらわれる、政治に関わって身を誤る、といった形でも現れます。女性は夫の暴力や浮気に苦しめられ、結婚運が悪くなる暗示があります。\n人生の流れでは、二十五歳を過ぎると運が安定してきます。三十七歳から四十歳が人生の大転換期で、本格的に上昇する人と、伸びきれずに横ばいになる人に分かれます。運の良い人は四十歳から物事が順調に運び、四十五歳ごろから急に上昇する人も出てきます。五月生まれの人には⑤数が凶として働きます。体では、中毒、がん、胸、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数④の人で⑤数が吉数の人の場合、積極的に⑤の数を取る（引っ越しの時、番地、部屋番号に⑤を選ぶとか、⑤の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n意思強くなる。管理能力がでてくる。多芸になる。臨機応変にたち振る舞えるようになる。勘がよくなる。投機感覚が強くなる。意欲が出てくる。実力が身につく。冒険的になる。行動力が出てくる。良い管理者になる。活力が出てくるといった意味合いです。"}, "4-6": {"ba": "C", "text": "あなたは、こつこつ積みあげるより、一つの独創的なアイデアや企画で大きく稼ぐ商才を持った人です。社交性も豊かで、政治的な力も備えています。⑥は理想と権威、大きく回る力の数。その⑥が、お金と実りをあらわすC場に入るので、生年④の人にとって⑥は、金運を呼ぶ吉数になります。どこかおおらかで、お金にも恵まれやすく、気前が良いので友が集まってきます。そして、どこかロマンの香りが漂っているのが、あなたの魅力です。全体を見渡す力、理想に向かって一歩ずつ登っていく力、争いをまとめる力を持つ人もいます。チャンスに恵まれると大きく開運し、研究が実る、大きな取引先ができる、といった喜びも訪れます。\nただ、卯年の人には⑥数が凶として働きます。大風呂敷を広げて理想倒れになりやすく、親分らしく見せたいために無理をして散財し、お金の争いや失敗を起こしやすくなります。隠れた危うさを持っているので、十分に注意して慎重に行動してください。\n⑥数が破壊されると、大きく回る力がお金を吹き飛ばします。権威ぶる。一攫千金を夢見て、株や賭けごとに手を出して財産を失う。父の借金の尻ぬぐいをする。地位が上がってから、お金がらみの失敗で信用をなくす。事故にあっても補償が得られず、暮らしに苦しむ。だまされて財産を失う。事業に失敗する。父や上司と意見が合わなくなる。計算高くなって周りに嫌われる。お金や地位を目当てにした結婚で失敗し、後悔する。お酒や色ごとで失敗する。地位や財に対して妬みや執着が強くなる。心が落ち着かず、右に左に揺れて一貫性がなくなる。そうした形で現れやすくなります。\n人生の流れでは、十歳ごろを境に順調な運になります。運気が大きく遅れた人も、四十五歳近くになってようやく身辺が明るくなります。順調な人は、五十歳前後からさらに運が強まります。卯年の人と、十二支を問わず六月生まれの人には⑥数が凶として働きます。体では、胸膜、脳の血管、心の疲れ、のぼせ、けが、神経痛、目、がんに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数④の人で⑥数が吉数の人の場合、積極的に⑥の数を取る（引っ越しの時、番地、部屋番号に⑥数を選ぶとか、⑥の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n多忙になる。物事が調和する。迫力が出てくる。気品が漂う。円満な相が顔に出る。行動力が出てくる。喜び事が増える。頭の回転が速くなる。研究が大きく実ってくる。大きな取引先ができる。機械化によって利益が上がる。このような良い意味合いが出てきます。"}, "4-7": {"ba": "D", "text": "あなたは、落ち着いた態度で物事の良し悪しを見分ける、すばらしい勘を持った人です。数字に強く、分析し整理する力があり、アイデアマンであることも大きな武器です。⑦は実りの数、お金と経済、直観の数。その⑦が、蓄えと家、家系と相続をあらわすD場に入るので、あなたの実りは、家庭と暮らしの土台を固める形で現れます。一家だんらん、家庭の安らぎを願う堅実な心を持ち、お金の感覚も旺盛。計算しつくした物事でも急いで進めず、石橋を叩きながら一歩一歩築きあげる用心深さがあります。独創的なやり方で裸一貫から財をなす人、信仰心が厚く、やわらかで思いやり深い人もいます。円満で愛嬌があり、明るい笑いのある人です。生月によっては、誰とでもすぐ友だちになれる不思議な社交性を持つ人もいます。\nしいて言えば、理屈っぽいところ、まじめで堅物と思われ「融通のきかない人」と見られがちなところが欠点です。自分を売りこもうとする気持ちが強すぎて、自分本位になることもあります。\n⑦数が破壊されると、実りへの執着が強くなりすぎます。頑固になり、何でもお金、お金になる。理屈っぽくなる。逆に贅沢になって意志が弱くなる。浮気心が出て、家ではけちなのに異性には気前よく、湯水のようにお金を使って喜ぶ。貯金が目標に近づくと、何やかやと出費がかさむ。宗教に凝って狂信的になり、家業や家庭をそっちのけにして出歩く。細かいことに口うるさくなる。何度も事業に失敗する。高い利息のお金を借りて返済に苦しむ。D場の数でもあるので、家に縁がうすい、土地や家屋、お金のことで争う、家庭に悩みや争いが起きる、跡継ぎのことで悩む、縁のもめごとや縁遠さ、といった形でも現れます。\n人生の流れでは、十三歳以降は運が整い、二十二歳ごろから上昇が感じられます。三十七歳から四十歳に運の強弱が分かれ、四十一歳から四十四歳はとくに注意が必要な時期です。七月生まれの人、酉年の八月生まれの人、子年の二月・十一月生まれの人には⑦数が凶として働きます。体では、口の病、胸、婦人科の病、盲腸、神経痛、骨折に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数④の人で⑦数が吉数の人の場合、積極的に⑦の数を取る（引っ越しの時、番地、部屋番号に⑦数を選ぶとか、⑦の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n性格がなる。円満に直感力が出てくる。思考が理論的になる。あなたの愛嬌が人を魅了する。要領よくまとめるようになる。敬虔（けいけん）な心になる。明るく笑いが絶えなくなる。金儲けの才能が出てくる｡直感力が出てくる｡理論的な思考になる。計数に強くなる。金運がつく。財務がしっかりしている。金融がうまくいく。直観が当たる｡利益がアップする。喜び事がある。といような意味合いが出ます｡"}, "4-8": {"ba": "E", "text": "あなたは、とても頭の良い人です。勉強家で、こつこつ築きあげていく努力家でもあります。⑧は改革と転換、蓄えの数。その⑧が、知性と名声、学問と判断をあらわすE場に入るので、あなたの改革の力は、鋭い知恵となって働きます。物事の欠陥や弱点を見抜く直観、行き詰まりを打ち破る力、革新的な考え方、次々と生まれるアイデア。調べ、集める才にもすぐれています。蓄財の才もあるので、努力しだいで名と富の両方を手にすることもできます。人が失敗したことを引き継いで、そこからとんとん拍子に良くなる人。人の失敗を見つめる中からすばらしいヒントを見つけて成功する人。それまで冷や飯を食わされていた職場を変えてから開運する人もいます。行き詰まったところこそが、発展の入口になる人です。生年④の人にとって③は破壊数ですが、⑧はその凶をやわらげる働きも持っています。\n⑧数が破壊されると、変える力が裏目に出ます。努力して築いたものが行き詰まる。改良や改革したことが、かえってマイナスを生む。アイデアが枯れてくる。物事を中止や断念に追いこまれる。変えたことで失敗する。こりずに再起を図っても、また同じ失敗をくり返す。物事の出発点や、交代の時期を誤る。変化についていけなくなる。在庫や返品に苦しむ。欲が強くなる。家庭が乱れる。跡継ぎの難、家系が途絶える心配、土地や家屋の争い。高いところから落ちてけがをする、火事にあう、といった暗示もあります。\n人生の流れでは、十七歳から三十二歳ごろは運気の上昇期ですが、身の回りが揺れて吉凶が入り混じります。四十代は順調な運です。五十代に、強い運と弱い運、上昇・横ばい・下降に分かれます。子年の人と八月生まれの人には⑧数が凶として働き、十二月生まれの人には吉凶が半々に出ます。体では、盲腸、骨折、関節、背骨、肩こり、鼻、がんに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数④の人で⑧数が吉数の人の場合、積極的に⑧の数を取る（引っ越しの時、番地、部屋番号に⑧数を選ぶとか、⑧の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n頭の切り替えが速くなる。職業替えして成功する｡改良じょうずになる。組織を変更して成功する｡家屋・不動産で儲ける｡設備投資が上手く行く｡蓄財の才が出てくる｡といった意味合いが出てきます｡"}, "4-9": {"ba": "F", "text": "あなたは、すばらしい推理力と直観力を内に秘めた人です。もの静かな中に、情熱に満ちた行動力を持っています。⑨は夏の光の数、知性と情熱、美と華やかさの数。その⑨が、隠れたもの、潜在する力、夜と秘密をあらわすF場に入るので、あなたの中では、光と影が交互に顔を出します。にぎやかで快活なときがあるかと思えば、急にふさぎこんでしまう。表は何でもやってのける行動派なのに、内面は案外寂しがりや。そうした二つの面を持つ人です。人に親切でよく面倒を見るので、好かれ、頼りにされます。勉強家で地味に研究を重ねる人、行き詰まりを突破する方法を見つけ出す人、予測や判断が的確な人もいます。\nただ、気分に流されるお天気屋のところがあり、自分本位に物事を押し通す面もあります。移り気で、一つのことにじっくり腰を据えて取り組むのは苦手。直観で何かを感じると、それを追いかけていきます。感情が激しやすく、何かの拍子に爆発して、それまでの努力を無にしてしまうことがあるので、十分気をつけてください。秘密を守るのが苦手なところもあります。\n⑨数が破壊されると、隠れた場所の光が乱れます。華やかさやにぎやかさを求めて遊びに夢中になる。落ち着きがなくなり、流行のものに何でも飛びつく。感情にむらが出て、衝動的に動いて失敗する。ずる賢くなる。思ったことをすぐ口にして損をする、告げ口をする、中傷される。浮気心のままに異性の間を転々とし、色ごとのもめごとを起こす。情事を得意げに話す。熱湯で大やけどをする、目を悪くする、眠れなくなる、お酒で体をこわす、火事にあう。書類の不正や隠しごとが明るみに出る。そうした形で現れやすくなります。\n人生の流れでは、十代は順調です。二十八歳から三十六歳は、うまくいきそうで足踏みする、吉凶の揺れる時期です。運気が上がるのは三十七歳からで、急に身の回りが明るく感じられるでしょう。午年の人、九月生まれの人、卯年の七月生まれの人には⑨数が凶として働きます。体では、心臓、血圧、不眠、やけど、目、胸、腰、神経痛、乳がんに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数④の人で⑨数が吉数の人の場合、積極的に⑨の数を取る（引っ越しの時、番地、部屋番号に⑨数を選ぶとか、⑨の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n勉強がすすむ。地味に何かを研究する。頭脳が明るくなる。行き詰まりを突破する対策を発見する。予測があたる。正しい診断。昇進する。試験にパスする。発明・発見する。資格を取る。繁盛する。栄転する。とかの意味合いが出ます。"}, "5-1": {"ba": "F", "text": "あなたは、独立独歩の人です。推理力があり、困難をものともしない強い意志を持っています。①は水の数、独立と推理、潜在する力の数。その①が、同じく①の意味を持つF場、隠れたもの、背後のもの、夜と秘密をあらわす場に入るので、水が水の場所に戻るように、あなたの力は、深いところ、見えないところで静かに育っていきます。あなたの運には、無から有を生み出す創業者の性質が隠れています。一つのことに打ちこめば成功のチャンスにも恵まれますが、その途中に苦難はつきものです。それに負けない強い心で進んでください。人の援助をあてにして物事を良くしようと依頼心を起こすと、かえって先々にマイナスが出て、人を動かそうとしたつもりが逆に動かされ、悩むことになります。\n活動力は旺盛で社交性もあり、つい前へ出ようとする気持ちが強く働きます。そのため「出しゃばり」「野心家」と陰で言われ、警戒されやすい損なところがあります。人に縛られるのを嫌う一方で、強引に人の心に入りこむ面もあります。裏で努力を積み重ね、最低限の基礎さえ固めれば、そのときこそあなたの出番です。慌てず、どっしりと腰を落ち着けて、一つのことに邁進してください。途中で気をつけたいのは、お酒と異性のことです。\n①数が破壊されると、深い水が暗くよどみます。わがままになって「自分が」という気持ちが強くなる。秘密主義になり、陰でこそこそする。気持ちが沈む。悪知恵が働く。性の不安に悩む。物事にしつこくまとわりつく。人に疑われるようなことをする。お酒や色ごとで失敗する。表は善良そうでも陰で悪事を働く。放浪癖が出る。ごまかす。落ちぶれて日陰で暮らす。結婚運が悪く、人目を忍ぶ異性関係が生じやすい。そうした形で現れやすくなります。\n人生の流れでは、二十代半ばに、吉凶と心の変化が大きく揺れ動きます。三十歳から三十五歳に運命の大きな転換が起き、三十六歳ごろから上昇の気流がやってきます。生年⑤の人にとって①は破壊数ではありませんが、運を弱めやすい数です。ただし辰年の人には吉として働きます。体では、腎臓、婦人科の病、痔、冷え、不眠、気持ちの沈み、お酒の害に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑤の人で①数が吉数の人の場合、積極的にの数を取る（引っ越しの時、番地、部屋番号に①数を選ぶとか、①の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n目的に向かって出発する。発展する。跳躍する。言語明晰。創造的見解。発見する。活動的。新鮮。キビキビした態度。感覚がみずみずしい。頭の回転が速い。\nと言った良い意味合いが働いてきます。"}, "5-2": {"ba": "G", "text": "あなたは、創造力に富み、向上心の旺盛な人です。地味に、こつこつと物事を築きあげていく努力家でもあります。②は大地の数、努力と忍耐、誠実と奉仕の数。その②が、同じく②の意味を持つG場、努力と忍耐、母や妻、大地をあらわす場に入るので、あなたは大地にしっかり根を張った人になります。質素で倹約家、なりふりかまわず働き、手先も器用なので、裸一貫で財をなす可能性もあります。物事を育てる特別な才能を持つ人、古いことの研究に心ひかれる人、信仰心が厚く霊的な感受性を持つ人もいます。表は強そうに見えなくても芯は強く、正直で素直、義理堅く、母を大切にする人です。器用なので一つのことだけでは物足りず、あれこれ経験してみたい気持ちもあります。\nしいて欠点を言えば、細かいことにとらわれやすく、物への執着が強いことです。「もったいない」が先に立って古いものを捨てられず、いつまでも手元に置いてしまう。親切が過ぎて世話を焼きすぎ、損をしたり利用されたりしやすい。曲がったことを極端に嫌う面もあります。\n②数が破壊されると、大地が乾いてひび割れます。意欲をなくし、ぐずで何をやってもうまくいかなくなる。忍耐力がなくなり、長続きしない。頑固になる。細かいことに口うるさく、けちになる。貧しさに苦しむ。働くことを嫌って怠ける。人の古傷をあげてからかう。古い知人や部下に裏切られる。自分のことばかり正当化する。感覚が古くさくなる。悪い不動産業者にだまされ、土地のことで争う。母と意見が合わない、早く生き別れ・死に別れる。姑と仲たがいする。妻のことで苦労する、家庭が複雑になる、持病に悩む。そうした形で現れやすくなります。\n人生の流れでは、二十一歳から三十歳は心と運命が大きく揺れる時期で、運気が大きく上がるのは三十代に入ってからです。上昇が確かになるのは三十六歳からです。丑年の人には②数が破壊数として働き、とくに四月・七月・九月・十二月・一月生まれの人は凶意が強く出ます。体では、胃腸、食欲不振、がん、物忘れ、皮膚、不眠に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑤の人で②数が吉数の人の場合、積極的に②の数を取る（引っ越しの時、番地、部屋番号に②を選ぶとか、②の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n努力ｽるようになる。誠実さが出てくる。労働意欲が湧いてくる。柔順な性格になる。柔和な。節操がある。義堅くなるとかの意味合いも出て来ます。\n創造性でてきたり。温厚な性格になったり。ねばり強さが出てきたり。親切心湧いてきたり、正直になったり。細心な注意力をはらったりします。母親を大事にするようになったり。良い技術。良い材料が入ったりします。また生産カアップ土地で利益を得る人も出てきます。"}, "5-3": {"ba": "H", "text": "あなたは、言葉がはっきりしていて弁舌の才があり、感覚も鋭い人です。陽気でにぎやかな場を好み、さっぱりとした気性なので、みんなに好かれます。③は春の芽吹きの数、声と言葉、活動と発展の数。その③が、同じく③の意味を持つH場、行動と発展をあらわす場に入るので、あなたはまさに春の勢いそのもの。活力と行動力にあふれ、目的に向かって勢いよく出発し、跳躍していきます。動きがきびきびしていて、頭の回転が速く、新しいものを発見する力もあります。生月によっては、言葉に才能を持つ人、発明や発見の才を持つ人もいます。\nただ、その勢いがときに強引さやわがままになって表に出たり、感情のままにしゃべりすぎたり動きすぎたりします。短気でかっとなりやすく、人に注意されても「すみません」の一言が言えず、「言い方が悪い」と相手をやりこめようとしたり、理屈を並べてその場をごまかそうとしたりする人もいます。強引さが表に出ると、相手に警戒されるので慎重に。\n③数が破壊されると、春の風が嵐に変わります。強引でわがままになり、人の意見に反発する。まじめな話も茶化して冗談にする。短気になってけんか早くなる。口先でごまかす。嘘をつく。人の欠点をあげつらう。軽率にふるまう。嫉妬深くなる。ヒステリックになる。詐欺のようなことをする。口先ばかりで行動がともなわない。突然声が出なくなる、言葉の障害に悩む、爆発事故でけがをする、手足のけがが多い、異性にだまされる。そうした形で現れやすくなります。\n人生の流れでは、十歳ごろから十五歳ごろに運が強まります。二十代は運の強弱と吉凶が分かれ、揺れが激しい時期です。三十歳ごろから身の回りが大きく変わり、環境の変化と運命の上昇が目まぐるしく訪れます。目的を見誤らないよう、強い意志と冷静な判断が求められます。大きな曲がり角は六十歳から六十五歳です。二月・八月・九月生まれの人には③数が凶をはらんで働きます。体では、肝臓、喘息、神経痛、けいれん、ヒステリー、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑤の人で③数が吉数の人の場合でも③－⑤の変化を起こす可能性がありますので、③数は取らない方がいいと思います。"}, "5-4": {"ba": "J", "text": "あなたは、社交的で明るく、如才のない人です。物事をまとめたり整理したり、管理したりする才能を持っています。④は人と人とをつなぐ数、交流と縁と信用の数。その④が、同じく④の意味を持つJ場、人間関係と情報と縁をあらわす場に入るので、あなたは人と人とのあいだに立つことで、いちばん輝く人になります。人間関係の機微をよくとらえ、相手の心に届く伝え方を自然に身につけていて、誰とでも気軽に話しかけ、友だちになれるしなやかさがあります。商いの才もあり、陽気で活動的なので信頼されやすく、面倒見が良いので友の中心になったり、まとめ役を任されたりします。争いごとの仲裁にはもってこいの人です。良い縁、良い取引先、良い友にも恵まれます。\nただ、世話を焼きすぎて煙たがられたり、軽率な人、手前勝手な人と見られがちなところもあります。人に好かれすぎるために自分の力を過信し、「自分が出なければ物事はまとまらない」と思いこみやすいので、気をつけてください。\n④数が破壊されると、つながりの糸がからまります。おしゃべりになる。無理に人の注目を自分に向けようとする。お節介が過ぎて嫌われる。如才なさが裏目に出て「ご機嫌取り」と悪口を言われる。中傷や悪い評判に悩む。友に裏切られる。会話が減って心が通わなくなる。約束が破れる。間違った情報を信じて失敗する。調子に乗せられて損をする。異性とのつきあいが乱れ、もめごとで信用をなくす。協調性がなくなって独りよがりになる。身の回りが散らかる。決断できずにチャンスを逃す。縁談が七、八割まとまったところで一方的に破談になる、縁遠くなる。そうした形で現れやすくなります。\n人生の流れでは、十歳を過ぎると運が強まって安定してきます。三十一歳から三十五歳は運命が大きく展開する時期で、いったん上昇が始まると五十歳まで強い運が続きます。五十一歳から五十五歳に運が二つに分かれます。戌年の人には④数が凶として働き、とくに五月・十月生まれの人は凶意が強く出ます。体では、かぜ、胸、喘息、肝臓、腸、脱毛、肌荒れに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑤の人で④数が吉数の人の場合、積極的に④の数を取る（引っ越しの時、番地、部屋番号に④数を選ぶとか、④の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n順応性が出てくる。几帳面な質があらわれる。柔和な心。清潔さを好む。人に好かれやすい。世話好き。信用がある。良縁に恵まれる。良い取引先に恵まれる。良い友人をもっている。営業成績がよくなる。良いセールスが多数いる。調査能力がある。といった良い意味が出てきます。"}, "5-5": {"ba": "A", "text": "あなたは、何よりも自由を求める人です。人からの圧迫どころか、注意の一言さえ極端に嫌います。性格は剛毅で、物事を強引に押し進めるワンマンの要素を多分に持っています。⑤は中心の数、意志と統率と剛毅の数。生年も⑤、人名数も⑤、そしてその⑤が、同じく⑤の意味を持つA場、生命と意志の中心に座っています。つまりあなたは、中心の中の中心に立つ人です。気位が高く、自分を押し出そうとする気持ちがいつも働き、しかもそれを器用にこなす力を秘めています。多芸で器用、人の意見や考えを素早く自分のものにする勘の良さと、頭の回転の速さがあります。意志が強く、人を束ね、管理する力、勝負勘も抜群です。\nこの数には、物事も性格も運命も、二つに分けてしまうところがあります。良い面と悪い面が極端に分かれやすく、山勘で動いたり、「自分が」という自我が強く出たりしやすいので注意してください。あれもこれもと手を出す移り気なところ、細かいことに口うるさい人、言葉の端々に怒りを含む人もいます。\n⑤数が破壊されると、中心の力が暴れだします。器用さにまかせて何にでも首を突っこむ。横柄になり、争いを好むようになる。人の思惑や都合はおかまいなしに、自分の思いどおりにしようとする。一か八かの勝負や賭けごとにのめりこむ。好色になって異性のもめごとが絶えない。人に恐怖心を与える。気に入らないと物を壊す。悪い仲間につきまとわれて信用をなくす。宿命的な悪い習慣に苦しみ、絶望的になる。無謀なことをする。貧しさに苦しむ。持病に悩む。逆に、ぐずで何を考えているかわからない人になることもあります。\n人生の流れでは、二十一歳から三十歳は、揺れる人と上昇の気運が満ちる人に分かれます。三十一歳から三十五歳は運が大きく動いて上昇する時期です。人生の一大転機は四十六歳から五十歳で、五十一歳からは順調に続く人と下がる人に分かれます。七月・一月生まれの人には⑤数が凶をはらんで働きます。体では、がん、胃腸、下痢、中毒、化膿、婦人科の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数の人で⑤数が吉数の人の場合、積極的に⑤の数を取る（引っ越しの時、番地、部屋番号に⑤を選ぶとか、⑤の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n意志がさらに強くなる。支配力をもってくる。活力がある。剛毅な質が出る。進歩的な考えが強くなる。実力いがついてくる。投機感覚が抜群になる。器用になる。円満になる。管理能力統轄する能力がアップする。不動心。といった良い意味合いが出ます。"}, "5-6": {"ba": "B", "text": "あなたは、頭の切れる人です。政治的な感覚を身につけ、落ち着きがあって、こせこせしません。⑥は理想と権威、上に立つ力の数。その⑥が、同じく⑥の意味を持つB場、権威と理想、上に立つ力をあらわす場に入るので、あなたには大物としての器が備わっています。剛毅な中にもどこかロマンを宿し、目先にとらわれず大局を見つめ、将来への夢や理想を描くことができる人です。考えや行いが高尚で、物事を美しく整えようとし、信用や名声を重んじます。人の心を不思議と惹きつける魅力に富み、指導力と気品、迫力を備えています。\nただ、理想が先に立って器用貧乏になりやすいところがあります。ともすると自分の身を守る方へ動いたり、人の思惑を気にせず強引に押し進めたりします。いちばん気をつけたいのは、地位を鼻にかけて傲慢にふるまってしまうことです。\n⑥数が破壊されると、理想が見せかけに変わります。ワンマンになり、大きなことを言うわりに行動がともなわない。お金の面でずるくなる。考えがくるくる変わって、どれが本当かわからなくなる。人の意志を押さえつけようとする。人の地位を内心では妬みながら、表では取り入る。実現できないことを実現できると思いこんで無駄に動く。空威張りをする。父や目上の人と意見が合わず争う。けんか早くなる。賭けごとや車に夢中になる。欲が強くなる。お酒や色ごとで身を誤る。縁遠くなる、夫の浮気に悩む、といった形でも現れます。\n人生の流れでは、十九歳から三十歳ごろは、上昇に向かうための揺れと準備の時期なので、焦らず慎重に。運の強い人はここから上昇しますが、三十代半ばまでは吉凶が揺れやすい時期です。遅れた人は三十六歳ごろから上昇の運が来るので、チャンスをつかんでください。辰年の人には⑥数が凶として働き、二月・十一月生まれの人には吉凶が半々に出ます。体では、胸膜、のぼせ、脳の血管、腎臓、冷えに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑤の人で⑥数が吉数の人の場合、積極的に⑥の数を取る（引っ越しの時、番地、部屋番号に⑥数を選ぶとか、⑥の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n充実している。剛毅である。創造性がある。魅力がある。偉大。高尚。高級。躍動。円 熟。指導力がある。気品がある。多忙。調和する。迫力がある。回転が速い。といった意味合いが出てきます。"}, "5-7": {"ba": "C", "text": "あなたは、外はやわらかく内は強い人です。表では物腰がやわらかく調子もよく、人をそらさない如才なさがありますが、内側は芯が強く、理屈っぽく、計算高いところがあります。⑦は実りの数、お金と経済、そして神秘と信仰の数。その⑦が、同じく⑦の意味を持つC場、お金と実りをあらわす場に入るので、生年⑤の人にとって⑦は、金運を呼ぶ吉数になります。お金の感覚が発達し、現実を見抜く鋭い直観があって、金もうけがうまく、数字にとても明るい人がいます。何かのきっかけやチャンスに恵まれて一躍財をなしたり、急にお金が集まってきたりすることもあります。五月生まれの人にとって⑦は大吉の数です。生月によっては、逆に神秘的なことに興味を持つ人、信仰心が厚く、苦しんでいる人を見ると我がことのように面倒を見る人、物事の原点を探る哲学に心ひかれる人、食べ物にくわしい人もいます。\n⑦数が破壊されると、実りへの欲が心を曇らせます。頑固になって、自分勝手な理屈を並べる。黒を白と言いくるめる。贅沢になってお金づかいが荒くなり、目新しいものを無理をしてでも手に入れたくなる。誘惑に弱くなり、お酒や色ごとに溺れる。人のお金に手を出しやすくなる。けちになって口うるさくなり、わずかなお金で争う。逆に、友に貸したお金が返ってこない。異性のもめごとでお金を巻きあげられる。保証人になって損をする。食べ物に口うるさくなる。狂信的になる。そうした形で現れやすくなります。\n人生の流れでは、多くの人は十一歳から三十歳まで順調な好運期が続きます。運の強い人は二十一歳ごろから上昇のきざしが見え、少し遅れた人も二十六歳を過ぎると、身の回りがどことなく明るくなります。三十代半ばを過ぎると、運の弱い人にも上昇が始まります。二月・三月・十一月・十二月生まれの人には、⑦数が吉と凶の半々に働きます。体では、歯や口の病、胸、胃、打撲やけが、骨折、じんましん、肌荒れに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑤の人で⑦数が吉数の人の場合、積極的に⑦の数を取る（引っ越しの時、番地、部屋番号に⑦数を選ぶとか、⑦の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n円満な性格になる。直観力が冴える。理路整然としている。理論的に物事を見つめる。敬虔な心。独創的な考えを持ちます。 発展する。利益率アップ。よく金が入ってくる。金銭にゆとりができる。金運がついてくる。財務がしっかりする。といった意味が出てきます。"}, "5-8": {"ba": "D", "text": "あなたの心の根っこには、物事を改良したい、改革したいという思いがあります。⑧は改革と蓄え、家系と相続の数。その⑧が、同じく⑧の意味を持つD場、改革と転換、家と相続をあらわす場に入るので、あなたは「立て直す人」として生まれています。今までのものを安易に受け入れて使うことができず、行き詰まった物事の中から何かを見つけ出して、新しい道をつくっていく。混乱して先が見えないときに、それを改革して立ち直らせる知力と気力、鋭い直観を持っています。忍耐力が強く、一度決めたことはどんな苦難も乗り越えて貫く人です。蓄財の才もあり、裸一貫から財をなす人、もめごとを収めて名声を得る人、人が失敗したあとを引き受けて立て直す人もいます。ピンチヒッターとして役目を引き受けて成功する、職場を変えてから開運する、長く住んだ土地を離れてから幸運をつかむ、といった暗示もあります。部下や友がよく助けてくれて、アイデアが当たって予想以上の成果をあげることもあります。\n⑧数が破壊されると、立て直す力が崩す力に変わります。お金に口うるさくなり、欲が深くなる。家庭が乱れる。妻が病弱で苦労する。部下に裏切られる。親兄弟がいても力にならず、仲たがいする。家に縁がうすく、転々と住まいを移す。家のことで争う。悪い不動産業者にだまされる。事業に失敗する。改良や改革したことが無になる。苦労して貯めても、ある程度までいくと出費がかさむ、ということをくり返す。跡継ぎがいない、相続で争う。高いところから落ちてけがをする。そうした形で現れやすくなります。\n人生の流れでは、二十五歳から三十歳ごろは順調そうに見えて揺れやすい時期です。生月によっては、三十三歳ごろから急に身の回りが明るくなる好運期に入ります。五十歳を中心に、上がり続ける人と下がる人に分かれます。未年の人と七月生まれの人には⑧数が凶として働きますが、命数や波動に③がある人は、その凶がやわらぎます。体では、鼻炎や蓄膿症、骨折、盲腸、関節、胃腸、まひに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑤の人で⑧数が吉数の人の場合、積極的に⑧の数を取る（引っ越しの時、番地、部屋番号に⑧数を選ぶとか、⑧の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n家屋や不動産に縁があり、大きく利益を得る。相続後に大発展する。改革、改良したものが大当たりする。組織が充実してくる。組織変えが大成功する。商品を替えて当たる。家庭が円満になる。アイデアが当たる。設備拡張が大きくブラスする。とかの良い意味合いが働きます。"}, "5-9": {"ba": "E", "text": "あなたは、すばらしい頭脳を持ち、活力と情熱に満ちた人です。直観が鋭く、感情も豊かで、物の良し悪しを見抜く鑑識眼が自然に身についていて、美術や装飾のセンスにも恵まれています。⑨は夏の光の数、知性と名声、美と華やかさの数。その⑨が、同じく⑨の意味を持つE場、知性と名声、美と発見をあらわす場に入るので、あなたの周りには自然と光が集まります。人の目があなたに集まり、人気を呼び、好感を持たれやすい。管理する力も意志の強さも十分です。発見や発明、正しい予測、昇進や栄転、試験の合格といった喜びにも恵まれやすい組み合わせです。\nただ、注目を集めるうちにあなた自身もそれを意識するようになり、大きなこと、人目を引くこと、高級で高尚なことばかりに気持ちが向いて、きれいごとになりやすいところがあります。おしゃれで、むら気で移り気。地味なことや、人の陰になる目立たない仕事は避けがちです。趣味も一つでは満足できず、気の向くままに手を出します。いつも光の当たる場所にいたいという気持ちがあるので、人を見下したり、見せびらかしたりする態度が無意識に出てしまうことがあります。無意識のうちにワンマンな気質が顔を出し、強引になって警戒されることもあります。\n⑨数が破壊されると、光がまぶしすぎて足もとを見失います。華やかな暮らしに憧れ、浮わついた行動をとる。流行を追いかける。名声や名誉を求める気持ちが強くなる。物事に夢中になるあまり、前後の判断を見落とす。売名に走る。移り気が高じて、浮気のままに異性問題を次々起こす。隠していた不正が明るみに出て争いになり、信用をなくす。裁判ざたになる。発見や発明を盗まれる。保証人になって不利になる。火事ややけど。離婚の問題。そうした形で現れやすくなります。\n人生の流れでは、十代は順調で、十九歳から二十七歳は運が動きやすい時期です。早い人は三十一歳から上昇し、遅れた人も三十六歳ごろから運が満ちて上がっていきます。五十歳を中心に、順調な人と下がる人に分かれます。十二月生まれの人には⑨数が凶として働き、二月・六月・八月生まれの人には吉凶が半々に出ます。体では、心臓、頭痛、目、脳の血管、がん、乳がん、日射病、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑤の人で⑨までの数が吉数の人の場合、積極的にの⑨数を取る（引っ越しの時、番地、部屋番号に⑨を選ぶとか、⑨の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n発見 発明する。正しい予測をする。予知する。美しくなる。名声が出る。人気が集まる。昇進する。栄転する。発展する。試験に合格する。権利が入る。お祝いごと。裁判で勝つ。身辺が明るくなる。身辺に知的な人が多数集まる。といった意味合いが出ます"}, "6-1": {"ba": "E", "text": "あなたは、外から見ると冷静でおとなしい人に見えますが、内には情熱的な活動力を秘めています。煮えたか煮えないかわからないような中途半端は嫌いで、白か黒かをはっきりさせなければ気がすまない人です。①は水の数、独立と推理、潜在する力の数。その①が、知性と名声、判断と発見をあらわすE場に入るので、あなたの推理力は知恵の光に照らされて、抜きんでた力になります。生月によっては、相手を一目見ただけで人柄を見抜く直観を持つ人、物事の裏側を前もって知る力を持つ人もいます。冷静な判断力、頭の回転の速さ、隠れたものによく目が届く力、困難に負けない強い意志。社交性にもすぐれています。生年⑥の人にとって①は大吉の数です。\nただ、こうと判断すると容易に曲げず、いつまでもこだわる執念深さが隠れています。隠しごとは苦手で、名声にひかれやすいところもあります。普段は興味のないふりをしていても、チャンスが来ると猛烈な勢いで動きだす人、移り気の強い人、秘密を守れない人もいます。\n①数が破壊されると、深い水が濁って波立ちます。落ち着きがなくなり、軽はずみにふるまう。疑い深く、執念深くなる。性の不満から夜遊びをするようになる。何かのきっかけで眠っていた浮気心が目を覚まし、色ごとに溺れてもめごとを起こしたり、人目を忍ぶ関係で悩んだりする。融通のきかない頑固者になる。激しい感情からけんか早くなる。人の弱点を暴いて喜ぶ。不渡りをつかまされて事業が振るわなくなる。法の抜け穴をついて悪事を働く。運転では、信号無視や無免許、酒気帯びで事故を起こす暗示があります。\n人生の流れでは、七歳から十二歳ごろが運の弱い時期で、二十五歳から三十歳は揺れの時期です。三十代に開ける人と、四十代に入って上昇する人に大きく分かれます。五十五歳から六十歳は安定期ですが、思わぬ落とし穴があるので、力まかせに突き進まないように。二月・十一月生まれの人には①数が凶として働き、人間関係とお金の苦労がついてまわります。体では、腎臓、婦人科の病、心臓、脳の血管、目、心の病、がん、外科的な手術に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑥の人で①数が吉数の人の場合、積極的に①の数を取る（引っ越しの時、番地、部屋番号に①を選ぶとか、①の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n進歩的で活動家。冷静な判断力がある。頭の回転が速い。隠れた物事にもよく目が行き届く。潜在性をうまく活用する。独創性がある。困難に負けない強い意志力。向上する。多忙となる。大物の援助者が現われる。大きな取引が成立。機械設備完備。といった意味があります。"}, "6-2": {"ba": "F", "text": "あなたは、人を思いやるとても親切な人です。人の苦しみや悩みを自分のことのように心配し、何くれとなく面倒を見る、やさしい心根を持っています。②は大地の数、努力と忍耐、献身の数。その②が、隠れたもの、潜在する力をあらわすF場に入るので、あなたのやさしさと努力は、表に出るより、目立たないところで深く根を張っていきます。信仰心が厚く、宗教的な空気に心ひかれ、霊的なことには直観が鋭く働きます。創造力もすばらしく、自分独自のものを考え出し、物事を育てる才能もあります。節度ある応対ができ、ときに強さが顔を出しても、根のやさしさで人に好かれます。生年⑥の人にとって⑦は破壊数ですが、②は⑦と結んでその凶を良い方へ変える働きを持っているので、生月しだいでは大きく吉運と金運を開くこともできます。\nただ、運気が沈みがちなところがあり、大きな障害や苦難がつきまといやすく、悩むことも多いでしょう。それでも、それに耐えて自分の理想に向かってこつこつ築きあげる忍耐力は強く、一つの物事や研究にじっくり取り組むと、すばらしい成果をもたらします。暮らしは質素で浮ついたところがないため、外からは地味に見られて損をすることもあります。\n②数が破壊されると、大地の下で根が絡まります。古いことにとらわれて、いつまでも思い悩む。怠け癖が出てさぼる。消極的になって無精になる。身の回りの片づけを嫌って散らかる。素直さがなくなる。神経質になる。古い知人にだまされる。口うるさくなる。暮らしが苦しくなり、表情や動作が硬くなる。気持ちが沈む。痔や神経痛に悩む。母と早く生き別れ・死に別れる。妻と意見が合わない。職を転々とする。細かいことにとらわれて怒りを含んだ言葉が出て、敵をつくりやすくなる。そうした形で現れやすくなります。\n人生の流れでは、二十五歳ごろに吉凶が大きく分かれ、運の強い人は三十七歳から上昇します。五十五歳から六十歳が人生の大転換期で、この時期をどう考え、どう動くかで運命が大きく分かれます。晩年の安らぎもここにかかっています。三月・十二月生まれの人には②数が凶として働きます。体では、肌荒れ、不眠、胃腸、痔、冷え、神経痛、脳の血管、気持ちの沈み、外科的な手術に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑥の人で②数が吉数の人の場合、積極的に②の数を取る（引っ越しの時、番地、部屋番号に②数を選ぶとか、②の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n労働意欲が強い。柔順な中にも強さがある。造る喜びを知る。努力家である。細部に目行き届く。辛抱強い。誠実。献身的。技術カアップ。良い技術者に恵まれる。創造性がある。忍耐強い。親切。といった良いん面が出てきます。"}, "6-3": {"ba": "G", "text": "あなたは、話がうまく、社交性があり、調子の良い人です。それでいて、小さなことや細かいところにもよく気がつく、勘の鋭さを持っています。③は春の芽吹きの数、声と言葉、活動の数。その③が、努力と忍耐、家庭や妻、支えることをあらわすG場に入るので、あなたの言葉と活力は、身近な人を支え、人の面倒を見る形で生きてきます。明るくにぎやかなことが好きで、向上心も旺盛。動いていないと落ち着かないほど活発で、友の面倒もよく見る親切な人です。無駄口が少なく、要領よく話す話術も身につきます。言葉や音楽、文学にすばらしい才能を持つ人、古いことを研究して新しい発明や開発をする人もいます。冗談がうまく、笑いにまぎれてさりげなく相手の欠点を注意できる人、電話の応対がうまく、親切で明るい感じの人もいます。小さなことを大きく表現する癖を持つ人もいます。\n③数が破壊されると、言葉が軽くなり、家庭の土台を揺らします。ほら吹きになって大きなことばかり言う。口先だけで行動がともなわない。かっとなりやすく、小さなことにまで神経質になってくよくよしたり、怒ったりする。猪突猛進する。世間の評判を気にする。中傷に悩む。嘘をつく。詐欺にあう、または詐欺のようなことをする。古い友に裏切られる、仲たがいする。言葉がつかえる、突然声が出なくなって苦しむ。土地や不動産のもめごと。家庭が乱れ、妻と争う。仲人の口車に乗って結婚に失敗する。そうした形で現れやすくなります。\n人生の流れでは、十三歳から十八歳ごろに最初の上昇の気配が出ます。二十五歳から三十六歳は吉凶が大きく揺れ、上がる人、足踏みする人、不安定な人に分かれます。運の強い人は三十歳前後から上昇に転じ、四十歳前後から五十歳に向けてさらに上がっていきます。四十九歳から五十四歳が上昇と下降の分かれ目です。寅年の人と、四月・一月生まれの人には③数が凶として働きます。命数や波動に⑧があると、その凶はやわらぎます。体では、喘息、のど、神経痛、胃腸、肝臓、ヒステリー、のぼせに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑥の人で③数が吉数の人の場合、積極的にの③数を取る（引っ越しの時、番地、部屋番号に③数を選ぶとか、③の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n良い面では、新鮮な感覚。言語明晰。話し方が親切でうまい。努力家である。親切。敏捷。発見する。技術導入。技術がアップ。誠実な態度。電話応対が上手。活力が出る。といった意味が出てきます。"}, "6-4": {"ba": "H", "text": "あなたは、自然に身についた品の良さと社交性を持ち、誰とでもつきあっていける人です。話がうまく、活動的で如才なく、情も厚い。目上にはたてついても、部下はいたわる情を多分に持っています。④は人と人とをつなぐ数、交流と縁と信用の数。その④が、行動と発展、声と活力をあらわすH場に入るので、あなたの人づきあいの力は、活発な行動となって外へ広がっていきます。にぎやかで派手なことが好きで気前が良いので、友が自然に集まってきます。困っている友や悩みを抱えた知人がいれば、我がことのように親身になって世話をする、気のやさしい人です。親切心と勘の良さが、あなたの持ち味。お金の感覚は大ざっぱでどんぶり勘定ですが、それでいて全体をつかむ不思議な才能があります。良い取引先や権威ある人とのつながり、大きな取引の話にも恵まれやすい人です。\nただ、勝ち気でわがままなところもあって、ときに親切の押し売りになり、相手に「うるさいな、放っておいて」と思わせてしまうのは損なところです。整頓や清潔にこだわりすぎて口うるさくなる人、異性に好かれすぎて困る人もいます。\n④数が破壊されると、つながりがもつれます。親切があだになって返ってくる。整理整頓ができず、だらしなくなる。中傷や悪い評判に悩む。娘の結婚のことでもめごとが起きる。友に裏切られる。取引がだめになる。甘えが出て、いつも中心にいたがる。浮気心が強くなって異性を次々に追いかけ、異性とのつきあいでお金を巻きあげられる。とんでもない相手にひっかかって身を誤る。性の不安に悩む。縁遠くなる。旅先で病気や災難にあう。友に車を貸して事故が起きる。そうした形で現れやすくなります。\n人生の流れでは、十九歳から青年期の上昇の気運が起こります。上昇が遅れた人も四十三歳から少しずつ上がりはじめ、努力しだいで四十代半ばに急上昇する可能性もあります。五十五歳から六十歳は人生の峠で、晩年の運がここで形づくられる大切な時期です。五月生まれの人には④数が凶として働き、とくに寅年の人は凶意が強く出ます。体では、胸、食道やのど、脱毛に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑥の人で④数が吉数の人の場合、積極的に④の数を取る（引っ越しの時、番地、部屋番号に④数を選ぶとか、④の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n親切心がある。順応性がある。信用される。温順な人柄。融通がきく。評判がよい。大きな取引の話が出る。営業部員の質向上。良い取引先に恵まれる。権威ある人に紹介される。調査能力 がある。販売拡張。といった意味合いが出ます。"}, "6-5": {"ba": "J", "text": "あなたは、いつも自由と権威を求め、人からの圧迫や干渉、制約を極端に嫌う人です。気性は激しく、我も強い。冒険に憧れ、勝負の勘を多分に秘めています。⑤は中心の数、意志と統率、剛毅の数。その⑤が、人と人とのつながり、縁と情報をあらわすJ場に入るので、あなたの強い意志は、人間関係の中でぶつかり合ったり、引き寄せ合ったりしながら働きます。器用で何でもこなす才能があり、一か所にとどまれず、理想を求めて動いていく性分です。意志が強く、統率力と管理の力、行動力があり、進歩的で実力も備えています。表には強引さが出ますが、一皮むけば案外ロマンチストで、涙もろく、情にもろい思いやりのある一面を持っています。\nただ、器用さにまかせて手当たり次第に食いつく移り気なところがあり、物事を深く知るより、表面をなでるだけの知識になりやすいのが欠点です。向こう気の強さから、あえて反抗的にふるまったり、人の権威を傷つけたり、相手の心の中に土足で踏みこむような、傍若無人なふるまいをしたりする人もいます。夢や理想を追いながら途中で反対の方向に転換を余儀なくされたり、大風呂敷を広げて煙に巻いたりすることもあります。\n⑤数が破壊されると、強い意志が人との間で衝突を生みます。鼻っ柱が強く、向こう見ずに突き進む。強引さが高じて敵をつくる。反抗的になる。悪い意味でのワンマンになる。頑固でへそ曲がりになる。ぼんやりしてくる。本当の友が少なく孤独になる一方、悪い仲間は集まりやすい。好色になって異性を強引に口説き落とし、もめごとを起こす。しつこくつきまとう。賭けごとで身を誤る。うまくいきそうなことが逆転する。友に裏切られる、わなにはまる。かっとなると何をするかわからない危うさで、相手に恐怖心を与える。そうした形で現れやすくなります。\n人生の流れでは、十六歳から二十歳にかけて最初の上昇が始まります。三十六歳から四十歳は注意の時期で、四十一歳から本格的な上昇期に入ります。亥年の人、六月生まれの人、寅年の十月生まれの人には⑤数が凶として働きます。体では、胸、言葉の障害、中毒、化膿、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑥の人で⑤数が吉数の人の場合、積極的に⑤の数を取る（引っ越しの時、番地、部屋番号に⑤数を選ぶとか、⑤の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n意志が強くなる。剛毅な性格になる。権威が出る。充実してくる。管理能力がでる。進歩的になる。実力が出来てくる。器用になる。活力と行動が出てくる。不動心。意欲的になる。統轄力が出る。投機感覚が鋭くなる。混乱期にチ ャンス到来する。といった意味が出ます。"}, "6-6": {"ba": "A", "text": "あなたは、感覚が鋭く、機を見るに敏な人です。政治的な感覚をほどよく身につけ、大きな角度から物事を見る目を持っています。⑥は理想と権威、上に立つ力、大きく回る力の数。生年も⑥、人名数も⑥。その⑥が、生命と意志の中心、「わたし」そのものをあらわすA場に座るので、あなたは理想と大きな構えをそのまま生きる人になります。理想主義的で、ロマン豊かな心情を持ち、お金より名を大切にする。ときにはったりを見せるのも、その理想と競争心のなせるわざです。小さな問題にとらわれず、どっしりとして、少々のことでは驚かない太っ腹な人もいます。物事が混沌としたときやもめごとを収めるのが上手で、頃合いを見はからってうまく取り計らったり、強引に押し切ったりする駆け引きにたけた人もいます。良い先輩や上役に恵まれ、上の人に引き立てられ、理想が実現する喜びもあります。\nただ、権威と名声には弱いところがあります。秘密主義が強く、自分の考えを言わずに、のらりくらりと相手をじらして自分の思惑に持っていこうとする、手練手管にたけた人もいます。\n⑥数が破壊されると、大きな構えが空まわりします。大風呂敷を広げやすい。いかにも権威があるように見せようとする。夢や理想ばかり追いかけて現実にうとくなる。親分らしく見せようとして無理をする。勝負勘に頼って山を張る。どんぶり勘定になる。逆に、ぐずで陰気、無口になる人もいます。すぐれた才能があっても、お金の苦労や経済的な理由で、方向転換や断念を余儀なくされる。賭けごとや車に夢中になる。日々のうっぷんをスピードで晴らそうとする。浮気が知られて家庭がもめる。夫を事故で失う。そうした形で現れやすくなります。運転では、眠気覚ましやスピードの出しすぎで事故を招く暗示があります。\n人生の流れでは、十三歳から順調に移る気配があります。二十五歳から三十歳に急上昇する人もいて、少し遅れた人も三十一歳から上昇に向かいます。大幅に遅れた人も、四十三歳からは上昇期です。亥年の九月生まれ、申年の二月生まれの人には⑥数が凶として働きます。七月生まれの人は、お金が入ってもすぐ出ていきやすいので気をつけてください。体では、胸膜、脳の血管、皮膚、耳、冷え、がん、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑥の人で⑥数が吉数の人の場合、積極的に⑥の数を取る（引っ越しの時、番地、部屋番号に⑥数を選ぶとか、⑥の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。物事に対して回転が速くなる。迫力がでる。高尚な心が生まれる。多忙になる。大繁昌する。理想が実現する。良い先輩に恵まれる。良い上役に当たる。上位の人の引き立てがある。行動力が出る。指導力がでる。機械設備が完備する。となります。"}, "6-7": {"ba": "B", "text": "あなたは、直観が鋭く、理知的で、物事を理詰めで考えようとする人です。⑦は実りの数、お金と経済、そして神秘と論理の数。その⑦が、理想と権威、上に立つ力をあらわすB場に入っています。ただ、生年⑥の人にとって⑦はもともと破壊数なので、凶として働きやすい組み合わせです。この凶をやわらげ、良い方へ変える数は②。命数や波動に②がある人は、凶が吉に転じることもあります（寅年の人はこの働きが弱くなります）。すばらしく頭の切れる人もいて、物事の本質に向かって論理で探究する学究肌の人、数字にとても明るい人、経済に強い人、むずかしい哲学に興味を持つ人、神秘的なことに心ひかれる人もいます。\nただ、やわらかさに欠け、強気で鼻っ柱が強く、融通がきかず、表情が硬くなりがちです。陽気にふるまっているつもりでも、どこか陰があってぎこちなく、相手の癇にさわることを平気でずばずば言ってしまうきつさが、嫌な空気をつくりやすい。それがあなたにとって大きなマイナスです。とはいえ、内面は案外人が良く、親切な心根を持っています。素直にそれを表すのが照れくさいだけなのです。権威を求めながら、同時に権威に反発するという面を持つ人もいます。\n⑦数が破壊されると、理知が鋭い刃になります。直観だけで動く。理屈ばかり言う。皮肉を言う。表情が硬くなる。頑固で融通がきかなくなる。反抗的になる。要領ばかり良く、考えと行動がちぐはぐになる。お金にけちになる。逆にお金に縁がうすく、暮らしに困る。理由もなく人の行動をけなす。遊びに夢中になる。色ごとに溺れる。結婚の縁がうすくなる。争いが多い。言葉の障害や、舌足らずな話し方になる。父と縁がうすい、意見がぶつかる。神経質になって一途に思いこんで悩む。そうした形で現れやすくなります。\n人生の流れでは、二十八歳ごろまでは足踏みが続きやすく、本格的な上昇は二十九歳からです。遅れた人は四十三歳から上昇の機運が来るので、確実につかんでください。五十代は凶意の出やすい時期なので、十分に注意を。八月生まれの人と亥年の九月生まれの人は、とくに凶意が強く出ます。体では、胸膜、胸、口の病、婦人科の病、打撲に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑥の人は⑦数は破壊数です。②の数でカバーするようにしてください。"}, "6-8": {"ba": "C", "text": "あなたは、頭が切れるうえに、お金を生み出す特別な才能を持った人です。論理的に物事を考え、お金の感覚も旺盛で、アイデアマンとしての素質もあります。⑧は改革と蓄えの数、家と相続の数。その⑧が、お金と実りをあらわすC場に入るので、生年⑥の人にとって⑧は、吉数であるとともに金運の数になります。家庭は円満で、お金にも恵まれるので、動作がおおらかでこせつかず、温和で親切、思いやり深い人です。たとえ裸一貫からでも、努力してお金に困らない暮らしを築けるのが、この数の恵みです。社交性もほどよく持ち、つきあいは偏らず、親しく交わることができます。あなたが親切にすればするほど、相手は恩を感じて慕い集まり、いざというときには力を貸してくれます。行き詰まった物事を引き受けて好成績をあげる人、再出発して幸運の波に乗る人、改良や改革で良い結果を得る人もいます。たとえ行き詰まることがあっても、助けが現れ、あなたのアイデアの才が大きく働いてくるでしょう。\n⑧数が破壊されると、実りの蔵が傾きます。親戚や友とのあいだでお金のもめごとが起きて仲たがいする。お金に口うるさく、けちになる。うまくいっていたことが行き詰まる。職を変えて不運を招く。頑固になる。事業の失敗をくり返す。食べ物に口うるさくなる。家に縁がうすい、家のことで争う。改良や改革したことが不発に終わる。相続のもめごと、養子のことでの悩み。人のあとを引き受けて問題が起きる。火事にあう。高いところから落ちる。そうした形で現れやすくなります。運転では、坂道でブレーキがきかない、対向車とぶつかる、踏切や横断歩道で事故にあう、といった暗示があります。\n人生の流れでは、十三歳から運が整い、順調になっていきます。二十五歳になると、良い運の人は上昇の力が強まり、幸運の波に乗る人も出てきます。三十歳が運の強弱の分かれ目です。九月生まれの人には⑧数が凶として働きます。三月生まれの人にとっては、⑧が③の凶をやわらげる働きをします。体では、蓄膿症、腰、関節、盲腸、骨折に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑥数の人で⑧数が吉数の人の場合、積極的に⑧の数を取る（引っ越しの時、番地、部屋番号に⑧数を選ぶとか、⑧の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n金運を呼びやすくなります。金銭的にゆとりができてくる。大きく儲けができる。貯蓄観念が強くなる。不動産で利益。アィデアが当たる。流通変化で、在庫が大きな利益になる。設備投資が大きく寄与する。相続で大金が入る。転職で給料が大幅アップする。といったプラス面が考えられます。"}, "6-9": {"ba": "D", "text": "あなたは、すばらしい頭脳を持ち、アイデアマンとしての才能は抜群です。物事を計画的に押し進めようとする意識がいつも働いていて、努力家でもあり、学ぶ心も向上心も旺盛です。⑨は夏の光の数、知性と名声、美と発見の数。その⑨が、改革と転換、家系と相続をあらわすD場に入るので、あなたの知恵は、物事を改め、組み立て直す力として働きます。いつも違った角度から物事を見つめる、改革的な考え方を持ち、企画の面で大きな力を発揮します。運しだいでは、大きく開けていく人です。学問を愛する学究肌の人、美術に心ひかれる人、発明や発見に夢中になる人もいます。\nただ、派手で、豪華な雰囲気や高尚なことを好むので、つきあいも派手になりがちで、見栄っ張りなところもあります。口では修養だ、礼儀だと立ち居ふるまいにうるさく、節度と折り目正しさを持っていますが、杓子定規になって形式に流れやすいところもあります。熱中するあまり感情に流されやすいことと、移り気が出やすいことが、しいて言えば欠点です。\n⑨数が破壊されると、光が足もとを照らさなくなります。名声を求める気持ちが高じて、名を売ることに走る。教育に熱中しすぎて口うるさくなり、子どもの心を押さえつける。頭の良さをひけらかす。移り気が高じて流行を追い、自分らしさを失う。迷いごとや争いが多くなる。名誉や名声を保とうとして無理をする。感情が乱れ、かっとなりやすくなる。精神的なことに偏って、お金にうとくなる。浮気心から異性問題を起こす。華やかさに憧れて背伸びをする。火事の難。運転では信号無視や規則違反、対向車のライトに目をくらまされる、といった暗示もあります。\n人生の流れでは、十代は順調な人が多く、二十五歳から三十六歳は運命の転換が起きる時期で、三十歳前後が吉凶の分かれ目です。運の整った人はここから上昇し、遅れた人も三十七歳ごろから上がっていきます。四十三歳からは順調な運が続きます。申年の人と十月生まれの人には⑨数が凶として働きます。体では、目、やけど、心臓、がん、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑥の人で⑨数が吉数の人の場合、積極的に⑨の数を取る（引っ越しの時、番地、部屋番号に⑨数を選ぶとか、⑨の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n頭脳が明敏になる。改革的改良的な思考が芽生える。常に違った角度から、物事を見つめるようになる。発明・発見する。試験に合格する。検査に合格する。良いアィデアを思いつく。栄転する。認められる。名声が出る。研究発表をする。解明する。とかの意味合いが出ます。"}, "7-1": {"ba": "D", "text": "あなたは、独立独歩の人です。独創的な知恵と推理力を持ち、自我が強く、いつも主導権を握ろうと心を砕いています。①は水の数、独立と推理、潜在する力の数。その①が、改革と蓄え、家系と身内をあらわすD場に入るので、あなたの独立心は、自分の手で一から積みあげ、自分の陣地を固めていく形で現れます。見た目はおとなしく、表面はやわらかですが、内面は活動力が旺盛で、人を頼らず、何から何まで自分一人でやらなければ気がすまない。人を容易に信じない計算高さがあり、「人をあてにするより自分が動いたほうが確かだ」という考えが無意識に働きます。運命的にはやや不運なところもありますが、それによく耐えて、こつこつ築きあげていく忍耐強さがあります。冷静な判断、推理と分析の力、秘密を守る堅さ、数字の強さも、あなたの持ち味です。\n自分の殻に閉じこもって内心を見せない人、身内で固まりやすい人、策略にたけた人もいます。思惑がはずれると案外もろいところと、計算高く疑い深いところが、しいて言えば欠点です。\n①数が破壊されると、閉じた殻の中で水がよどみます。陰気になり、殻にこもって人を信用しない。秘密主義が強くなる。素直さがなくなる。執念深くなる。悪賢くなる。物忘れが多くなる。頑固になる。表は君子のような顔をしながら、裏で色ごとに溺れたり、悪事を働いたりする。お酒で失敗する。暮らしが落ちぶれる。人に言えない借金の返済に悩む。異性のもめごと、または異性運が遠のく。改良や改革したことが失敗に終わる。水の災難、水のもめごと。病弱になる。お金にだらしなくなる、宗教を盲信する、といった形でも現れます。\n人生の流れでは、十五歳から二十歳ごろは運の弱い時期です。二十歳ごろから運が変わりはじめ、上昇の気運が生まれます。五十歳から五十六歳は大きく飛躍する年代ですが、運の強弱が二つに分かれる時期でもあります。七月生まれの人には①数が凶として働き、お金や書類のミスなどの凶意が出やすくなります。体では、腎臓、婦人科の病、痔、冷え、気持ちの沈み、目、循環器に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑦の人で①数が吉数の人の場合、積極的に①の数を取る（引っ越しの時、番地、部屋番号に①数を選ぶとか、①の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n冷静な判断ができる。推理力が働く。社交的になる。潜在性をうまく活用する。独創的な考え方をするようになる。進歩的。秘密事は守る。復活する。分析力があがる。計数に強くなる。金回りが良くなる。金運がくる。利益アップ。増収増益。金儲けがうまくなる。死角 を利用する。とかの意味合いになります。"}, "7-2": {"ba": "E", "text": "あなたは、直観が鋭く、独創的な考えを持ち、細かいところまでよく目の届く緻密な頭脳の持ち主です。計画を立て、こつこつと一歩ずつ確かに進んでいく忍耐強さと努力も備えています。②は大地の数、努力と誠実、育てる力の数。その②が、知性と名声、人気をあらわすE場に入るので、生年⑦の人にとって②は、人気と名声と知性を強める吉数になります。外は派手に見えても内面は案外地味で、倹約家の面もあります。素直で親切で、人の面倒もよく見て、物事に感激しやすく、同情心も厚い。温和で正直、霊的な感受性を持ち、教育熱心で、母を大切にする人です。物事の出発ではもたもたして鈍く見えても、必ず日の当たる場所、日の当たる時があなたのもとにやってきます。移り気を出さず、心の求めるところに従って努力を続けてください。\nしいて欠点を言えば、移り気なところと、古いことにとらわれやすいところです。内面の頑固さが、古い物事や決まりきった考えへのこだわりとなって硬さが表に出ると、大きな視点を見失ってしまいます。\n②数が破壊されると、大地の恵みが細っていきます。感覚が古くさくなって時代に取り残される。感情的になる。働くのを嫌って遊び癖が出る。細かいことにとらわれて大局を見失う。頑固になって自分の考えを押し通す。部下や友のおだてに乗って失敗する。隠していた昔のことが知られて信用をなくす。ぐずぐずした態度になる。飽きっぽくなる。知人と争う。妻の浮気や見栄に悩む、夫の浮気や酒乱に悩む、離婚のもめごと、裁判ざた、土地をめぐる争い。親切があだになって返ってくる。そうした形で現れやすくなります。\n人生の流れでは、十五歳から二十一歳は揺れやすい時期で、運気の上昇は二十九歳ごろから始まります。四十歳ごろまで不調だった人も、四十三歳ごろに変化が訪れます。子年の人には②数が破壊数として働き、八月生まれの人、酉年の十二月生まれの人にも凶として働きます。体では、胃腸、目、皮膚、がん、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑦の人で②数が吉数の人の場合、積極的に②の数を取る（引っ越しの時、番地、部屋番号に②数を選ぶとか、②の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n創造性が生まれる。温和な性格になる。親切心が出る。正直である。忍耐強くなる。霊的な体質が出てくる。向上心が旺盛になる。教育熱心になる。緻密な眼が生まれる。母親を大切にするようになる。調和の心が芽生える。といった意味合いです。"}, "7-3": {"ba": "F", "text": "あなたは、推理力に富み、感覚の鋭い人です。いつも新しいことに目を開いていながら、内面にはどこか古風なところを包みこんでいます。③は春の芽吹きの数、声と言葉、活動の数。その③が、隠れたもの、背後のもの、潜在する力をあらわすF場に入るので、あなたの言葉と感覚は、表に勢いよく出るより、内に秘めた鋭さとして働きます。向上心が旺盛で、人より一歩抜きんでようとする意識が強く、社交的で活動力もあります。冷静な態度で、物事の筋道を諄々（じゅんじゅん）と説く人、相手の盲点を見抜く鋭い直観を持つ人、話術のうまい人もいます。頭の回転が速く、企画力があり、計算に強い人もいます。音楽や推理小説、空想の物語に興味を持つ人もいます。\nただ、物事に対して進みすぎたり、しゃべりすぎたりするきらいがあります。表立っては自分の意見を言わないのに、陰でぶつぶつ不平や批判をこぼす人。感情的になって、声を震わせながら神経質に言い立てる人。評判や世間体を気にする小心な人、言いわけのうまい人もいます。理屈っぽく、融通がきかないので、自我を強く出しすぎることがあります。\n③数が破壊されると、隠れた場所の言葉がとげを持ちます。陰気になって、言葉に角が立つ。嘘をつく。陰で不平不満を言う。疑い深くなる。口うるさくなる。妄想や空想にふけり、孤独のうさを晴らす。感情的でかっとなりやすく、けんか早くなる。争いを好む。寝言で大声を出す。強迫観念におびえる。大風呂敷を広げる。口先でごまかそうとする。性の不安に悩む、または色ごとやお酒で身を誤る。父と意見が対立して別居する。夫の浮気や酒乱に悩む。賭けごとで家庭に争いが起きる。水の災難、スキー場での骨折やねんざ。人の隠れた部分をずばりと突く、お金の感覚がうすくなる、または逆に執着が強くなる、といった形でも現れます。\n人生の流れでは、十五歳から二十一歳は凶意の出やすい時期で、二十二歳から二十八歳に運が変わりはじめます。運の整った人は、二十九歳を過ぎると上昇運がやってきます。五十代後半から六十代前半は、突然の変化が起きやすい時期です。午年の人と九月生まれの人には③数が凶として働きます。体では、喘息、冷え、神経痛、言葉の障害、脳の血管、心臓、目、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑦の人で③数が吉数の人の場合、積極的に③の数を取る（引っ越しの時、番地、部屋番号に③数を選ぶとか、③の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n言語明晰になる。話術がうまくなる。活力がでる。瞬発力がでる。感覚が鋭敏になる。音声がみずみずしくなる。感情をうまくかくす。冷静で論理的な態度になる。企画力がでる。計算に強くなる。といった意味が出ます。"}, "7-4": {"ba": "G", "text": "あなたは、直観が鋭く、論理的で、物事に熱中して深く凝る人です。そのぶん、物事の理解も早い。④は人と人とをつなぐ数、交流と調和、整理の数。その④が、努力と忍耐、家庭と奉仕をあらわすG場に入るので、あなたの調和の力は、人のために骨身を惜しまず動く、まめやかなやさしさとして現れます。根は親切で思いやりが厚く、実直。人との調和に気を配り、人のために親身になって動きまわって世話をするので、自然に人望が集まります。社交性があって、調子の良い人もいます。物事をまとめる力、調べる力、分析する力を持ち、身の回りがきちんとしていて、きれい好き。この性質が良い方に出ると、調査や分類に特別な才能を発揮したり、人間関係のもつれや気まずさをほどくのに際立った力を見せたりします。商才のある人もいます。\nただ、きれい好きが高じて神経質になったり、口うるさくなったりしがちです。熱中すると周りが見えなくなり、自分本位に動いてしまうこともあります。妙に理屈っぽい人、派手好きで軽率な人もいます。\n④数が破壊されると、きれいに整えていたものが乱れます。けちで頑固になる。粗野にふるまう。身の回りに無頓着になる。悪い仲間が集まってくる。怠け癖が出る。要領ばかり良くなって目先をごまかす。古いことにとらわれ、問題が起きると相手の古傷を持ち出す。土地や家屋のことで争う。出歩き癖がついて、家でじっとしていられなくなる。旅好きになって、旅先で災難や病気にあう。縁遠くなる、縁談がまとまりにくくなる。浮気心から異性問題を次々起こす。中傷に悩む。お金づかいが荒くなる、または逆にがめつくなる。そうした形で現れやすくなります。\n人生の流れでは、十五歳から二十一歳は注意の時期ですが、④数がある程度その凶をやわらげてくれます。運気の上昇は二十九歳ごろから。遅れた人も四十三歳から上がりはじめます。五十歳から五十六歳は上昇の運が固まる時期です。十月生まれの人には④数が凶として働きます。体では、かぜ、気管支、胸、胃腸、じんましん、脱毛、肌荒れに気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑦の人で④数が吉数の人の場合、積極的に④の数を取る（引っ越しの時、番地、部屋番号に④数を選ぶとか、④の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n几帳面できれい好きになる。企画性に富んでくる。社交的になる。分析力と調査能力を合わせ もつようになる。世話ごとを親身になってやるようになる。商才がに芽生える。温柔な人格になる。良いセールスに恵まれる。金運がつく。利益がアップする。商売が繁盛する。というような意味合いが出ます。"}, "7-5": {"ba": "H", "text": "あなたは、剛気な性格で、人に縛られることを極端に嫌う人です。感覚が鋭く、勝負勘と冒険心を多分に秘めていて、一度こうと思い切ると、誰が何と言おうと、前途に危険があろうと、強引に進んでいきます。そのため、成果には大きな差が出やすい人です。⑤は中心の数、意志と統率、剛毅の数。その⑤が、行動と発展、声と言葉をあらわすH場に入るので、あなたの強い意志は、勢いのある行動と言葉になって外へ出ていきます。竹を割ったようにさっぱりと思い切りの良い人、器用で何でもこなす多芸の人、説得力のある話術を持つ人、言葉の感覚が鋭い人、親分肌の人もいます。お金の面では割り切っていて、情に流されません。活動力と管理する力、商才もあります。\nただ、自分本位で束縛を嫌う反面、心の奥には甘えもひそんでいます。人に注意されるとかっとなる人、相手の思惑や事情を無視して強引に押し切る人、ご機嫌取りのうまい人もいます。\n⑤数が破壊されると、強い意志が荒々しさに変わります。慢心や油断が出る。大風呂敷を広げ、人の意見を聞かなくなる。強情で強引になる。神経質で口うるさくなる。けんか早くなる。かっとなると手当たり次第に物を壊したり、乱暴をはたらいたりする。嘘をつく。詐欺や脅しのようなことをする。反抗的になる。争いが増える。物事が行き詰まる。だまされる。お酒や色ごとで身を誤る。色ごとのもめごとがこじれて裁判ざたになる。隠していた悪事が明るみに出る。言葉の障害に悩む。運転中に追い越されて腹を立てたり、注意されて怒鳴ったりする。そうした形で現れやすくなります。\n人生の流れでは、十六歳から二十歳ごろに揺れが激しく、三十歳ごろまで足踏みする人もいます。本格的な上昇は二十九歳以降で、強い人は四十九歳ごろまで長く上がっていきます。二月・十一月生まれの人、酉年の人、子年の九月生まれの人には⑤数が凶として働きます。体では、神経痛、言葉の障害、脳の血管、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑦の人で⑤数が吉数の人の場合、積極的に⑤の数を取る（引っ越しの時、番地、部屋番号に⑤数を選ぶとか、⑤の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n意志力が強くなる。金銭的に割り切って、情に流されなくなる。活動力が出てくる。管理能力が出てくる。白由主義な言動になる。実力がついてくる。剛毅な性格。器用。多芸。商才にたけてくる。投機感覚が鋭くなる。すぐに実行するようになる。という意味合いになります。"}, "7-6": {"ba": "J", "text": "あなたは、剛健な気風を持ち、頭の回転が速く、向上心も旺盛な人です。小さなことや細かい問題でこせこせするのは嫌いで、じっとしているのも苦手。何かに取りついて動いていると気持ちが落ち着きます。⑥は理想と権威、大きく回る力の数。その⑥が、人と人とのつながり、取引や縁をあらわすJ場に入るので、あなたの大きな構えは、人を惹きつける魅力として人間関係の中で働きます。豪快で大きなこと、すっきりとした明快さ、物事が充実した状態を夢見ます。政治的な感覚を持つ人、物事の行き詰まりを処理する才能を持つ人、商売上手な人もいて、おおむね人を惹きつける魅力に富んでいます。計画性があり、きちんとしないと気がすまないところもあります。統率力があり、大きな取引先にも恵まれやすい人です。\nただ、ときに小さなことをばかにしたり軽く見たりして、自信過剰になりやすいところがあります。最後の詰めを油断して、締めくくりが甘くなることもあります。ロマンを内に秘めているので、現実にとらわれず暮らしを美しく描こうとして、空想に流れることもあります。気分屋のところもあります。\n⑥数が破壊されると、大きな構えが空まわりします。空想的になり、大風呂敷を広げる。権威ぶる、尊大にふるまう、親分風を吹かせて見栄を張る。物事が完成の一歩手前で堂々めぐりする。懸命に働いているのに事業がだんだん衰えていく。決断力が鈍る。大きなことばかり夢見て失敗する。上司と意見が合わなくなる。争いを好むようになる。お酒や賭けごとで失敗する。色ごとのもめごと。縁遠くなる。嘘をつく。車に夢中になって、休日には用もないのに家族や友を連れ出してドライブする、スピードに夢中になる。動くわりにお金が入ってこない。そうした形で現れやすくなります。\n人生の流れでは、十五歳から二十四歳は注意の時期です。早い人は二十五歳ごろから上昇に転じ、遅れた人は二十九歳から三十代にかけて上昇の気運が見えてきます。大きく遅れた人には、四十三歳からが最後の開運の時期です。五十代は不安定な時期です。三月・十二月生まれの人、子年の十月生まれの人には⑥数が凶として働きます。体では、胸、かぜ、のぼせ、心の病に気をつけてください。\n☆開運のために（インナーミラクル）\n生年数⑦の人で⑥数が吉数の人の場合、積極的に⑥の数を取る（引っ越しの時、番地、部屋番号に⑥数を選ぶとか、⑥の数を貼ったアクセサリーを身につける）と以下の長所が出てくる可能性があります。\n多忙で動き回る。迫力が出てくる。回転が速くなる。政治性を身につける。行動力がでる。 大きな取引先が来る。統率力が出てくる。円熟味が出る。円満な相になる。安定する。機械完備。良い指導者が現れる。名声があがる。とかの意味になります。"}, "7-7": {"ba
