const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const qEl = document.getElementById('q');
let range = 'all';

function hiraToKata(s){
  return s.replace(/[ぁ-ん]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
}
function norm(s){
  return hiraToKata(String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/\s+/g,'').replace(/　/g,''));
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function inRange(n){
  if(range === 'all') return true;
  const [a,b] = range.split('-');
  if(b === '') return n >= parseInt(a,10);
  return n >= parseInt(a,10) && n <= parseInt(b,10);
}
function render(){
  const raw = qEl.value.trim();
  const q = norm(raw);
  const isNum = /^\d+$/.test(q);
  const out = [];
  for(const [n,y,m,note] of DATA){
    if(!inRange(n)) continue;
    if(q){
      if(isNum){ if(n !== parseInt(q,10)) continue; }
      else if(!norm(y + m).includes(q)) continue;
    }
    let h = '<div class="entry"><div class="n">' + n + '</div><div class="body">';
    if(y) h += '<span class="y">' + esc(y) + '</span>';
    if(m) h += '<span class="m">' + esc(m) + '</span>';
    if(note) h += '<div class="note">注：' + esc(note) + '</div>';
    h += '</div></div>';
    out.push(h);
  }
  listEl.innerHTML = out.length ? out.join('') : '<div class="empty">見つかりませんでした。</div>';
  countEl.textContent = out.length + ' 件' + (out.length !== DATA.length ? '（全' + DATA.length + '件中）' : '');
}
qEl.addEventListener('input', render);
document.getElementById('clear').addEventListener('click', () => { qEl.value=''; render(); qEl.focus(); });
document.getElementById('ranges').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  range = b.dataset.r;
  for(const x of document.querySelectorAll('#ranges button')) x.classList.toggle('on', x === b);
  render();
});
render();
