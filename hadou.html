9", "5", ""], ["", "", "○", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "申⑨・子④ の周期は、十二支は申・子の水局軌道を形成し、破壊数は⑨・④金局となっているので、少年期の上昇運の気配があるが、波動の十二支との兼ね合いから判断すると、上昇運ではあっても力は弱いようだ。だから緩やかな上昇といえよう。だが次の年月の人は、C波動との兼ね合いで、上昇運ではあっても、その年は渋滞気味か、あるいは緩やかな下降となる暗示がある。男性の場合は八月申③数に生まれた人は、寅⑨数年は凶性が出やすい年であるから、前年の丑⑧×年から、次の卯①×年との三カ年は下降気味の渋滞横バイ型となる可能性がある。また女性の場合は、三月卯⑦数、十二月子⑦数に生まれた人は、亥⑥数年から運気が渋滞するので、渋滞横バイ型となる可能性があるので、この周期は上昇運のようにみえても、昇りそうに見えても、昇り切れない弱運期といえよう。また、男女共に、④×、⑨×となっている月に生まれた人は、その分だけ上昇力が低下するのでC波動⑧×年、①×年は慎重に対処すべきである。また特に、①×月、⑧×月に生まれた人は、それに該当する破壊年は、その分だけ凶作用が強く作用するから上昇力は鈍るので、下降気味となる暗示がある。他【p.71】の月生まれの人は、破壊年だけ要注意。"}, {"t": "pair", "a": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["▲", "", "", "", ""]], "b": [["▲", "", "", "", "▲"], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": "②戌年8月（③申月）"}, {"t": "pair", "a": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", "▲"], ["", "5", "7", "3", "○"], ["", "", "", "", ""]], "b": [["▲", "", "", "", "▲"], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "caption": "②戌年3月（⑦卯月）"}, {"t": "pair", "a": [["", "", "▲", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", "▲"], ["", "5", "7", "3", "○"], ["", "", "", "", ""]], "b": [["▲", "", "✕", "", "▲"], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", ""]], "caption": "②戌年12月（⑦子月）"}], "rep": true}, {"label": "未⑧×・丑⑤", "board": {"t": "pair", "a": [["", "", "", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "", "", ""]], "b": [["", "", "", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "未⑧×・丑⑤ の周期は、十二支が未・丑冲となるので、生年戌との兼ね合いで、×形象となる作用が潜象で働くから、生命エネルギーは辰の場にある、J①×の方に流入しやすい傾向があるのと、地数月生まれの人は、逆転作用が生じやすい暗示があるから、その潜象理を見落とさないように。"}, {"t": "text", "text": "この周期は、男性は破壊期となるので、下降運となるから要注意の周期といえよう。女性は横バイ型となる可能性あり。特に注意すべき人は、一月丑⑧生まれの人で、次は四月辰⑧生まれの人である。七月未②月生まれは、男女共凶性が出やすい暗示があるが、逆転吉化する暗示もあるから、それらの要因となる物事、言動は何かをよく吟味する必要がある。その反面、男性でこの周期で凶性が弱まるのが、③数月生まれの人で、破壊期といっても、緩やかな下降となる暗示があるから、環境いかんでは、横バイ気味となる場合もある。"}, {"t": "pair", "a": [["", "", "", "", "✕▲"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["▲", "", "", "", ""]], "b": [["▲", "", "", "✕", "▲"], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]], "caption": "②戌年1月（⑧丑月）"}, {"t": "pair", "a": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["▲", "", "", "", "▲"]], "b": [["▲", "", "", "", "▲"], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "caption": "②戌年4月（⑧辰月）"}, {"t": "pair", "a": [["", "", "", "", "✕▲"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["▲", "", "", "", ""]], "b": [["▲", "", "", "○", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "caption": "②戌年7月（②未月）"}, {"t": "pair", "a": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["▲", "", "", "", ""]], "b": [["▲", "", "", "", "▲"], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": "②戌年8月（③申月）"}], "rep": true}, {"label": "午⑦・寅⑥", "board": {"t": "pair", "a": [["", "", "○", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", ""], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["", "", "", "", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "午⑦・寅⑥ の周期は、十二支が火局して援護するから、上昇力の強い周期となる可能性がある。だから周期初めの戌⑧×は、十二支が三合火局するので、凶性は弱い。①×年だけを注意。"}], "rep": true}, {"label": "巳⑥・卯⑦", "board": {"t": "pai  "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", "▲"], ["", "5", "7", "3", "○"], ["", "", "", "", ""]], "b": [["▲", "", "✕", "", "▲"], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", ""]], "caption": "②戌年12月（⑦子月）"}], "rep": true}, {"label": "寅③・午①×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "寅③・午①× の周期は、十二支が生年戌と三合火局するので、①×は弱体化する暗【p.73】示がある。従って、女性は凶運期ではあるが、凶性が弱いので、渋滞気味となる可能性があるので、C波動の⑧×・①×の年を特に注意。男性は吉運ではあっても、上昇力は鈍いので、上方横バイ気味に推移する可能性がある。だから破壊年は慎重に。特に十一月亥⑥数月は、③数が年月対応で準破壊数となっているから、たとえ寅・午の火局があったとしても、吉化しづらい暗示があるから、渋滞気味の横バイ型となる可能性がある。また二月寅⑥数も、③数が対応破壊となっているので、③×の意味となるが、十二支が火局するので、凶性は緩和されるが、子⑦数の年には周期の午と子が冲となって、火局が解消されて凶性が出やすい環境となるので、油断しないように。C波動①×の年は卯年であるから、九月酉④数月は物事が反転しやすく、凶性を誘引しやすいので注意。説明が前後したが、丑⑧×の年は波動③数と木局吉化するので、凶性は緩和される暗示が強い。"}, {"t": "pair", "a": [["▲", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "", "", "▲"]], "b": [["▲", "✕", "", "", "▲"], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "caption": "②戌年11月（⑥亥月）"}, {"t": "pair", "a": [["", "", "", "", "✕▲"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "", "", "▲"]], "b": [["▲", "", "", "", "▲"], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["", "", "", "", "✕"]], "caption": "②戌年2月（⑥寅月）"}, {"t": "pair", "a": [["▲", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "", "", ""]], "b": [["✕▲", "", "", "", "▲"], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": "②戌年9月（④酉月）"}], "rep": true}, {"label": "丑②・未②", "board": {"t": "pair", "a": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]], "b": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "丑②・未② の周期は、生年A②が原点帰りした周期だから、原点の潜在に隠れていたものが、顕在界に誘発されやすい暗示がある。また十二支が冲となっているので、未月、丑月生まれの③数は、反転、逆転、変換しやすい暗示があるので、凶性が吉性に、吉性が凶性になりやすい環境である。ということを見誤らないように。――参考まで【p.74】に説明すれば、②数が変換すると、⑨数の作用がするので、A⑨の意味をなすので、これに関連する意味が顕現される可能性がある。"}, {"t": "pair", "a": [["", "", "", "", "✕▲"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["▲", "", "", "", ""]], "b": [["▲", "", "", "○", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "caption": "②戌年7月（②未月）"}, {"t": "pair", "a": [["", "", "", "", "✕▲"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["▲", "", "", "", ""]], "b": [["▲", "", "", "✕", "▲"], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]], "caption": "②戌年1月（⑧丑月）"}, {"t": "text", "text": "また②数はたんに②数だけの機能があるのではなく、環境によれば、10＋1＝11の理を潜在にもっているから、この理が絡み合って表出されることもある。この潜象理は11②年だけに作用するのではなく、他の戌②、未②、丑②年にも共通の潜象理として内包している理である。"}, {"t": "text", "text": "次に十二支が丑・未の冲となる時は、生命エネルギーが流れを変え、形象に従って、戌・11の場に吸引される傾向が強い暗示がある。"}], "rep": true}, {"label": "子①×・申③", "board": {"t": "pair", "a": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "子①×・申③ の周期は、男性は破壊期だから、運気は下降気味となる可能性がある。だからC波動の11⑧×、子①×は注意年となる。たとえ子・申の支が水局したとしても、力が弱いので、注意すべきである。だが、女性は吉数ではあっても、生月のA②が年月対応でJ①×、J②となるが、波動の支が水局要因をもち、G場申③となるので、弱運ではあっても、上昇気運となる暗示がある。またC波動⑧×年は、木局吉化の作用があるから、凶性は弱く緩和されるが、寅③は冲となるので、動揺が生じやすい暗示がある。"}], "rep": true}]}, {"id": 8, "num": "③", "numVal": 3, "branch": "寅", "title": "③数寅年の読み方", "headingRaw": "【p.75（本文なし）】【p.76（本文なし）】【p.77（本文なし）】【p.78】③数寅年の読み方", "page": 78, "cycleText": "生年数③……三年周期（補助周期六年）", "male": {"head": "男性の場合（寅年）破壊数は①×・⑨×", "jun": "3寅→4卯→5辰→6巳→7午→8未→9×申→1×酉→2戌→3亥……", "gyaku": "3寅→2丑→1×子→9×亥→8戌→7酉→6申→5未→4午→3巳……"}, "female": {"head": "女性の場合（寅年）破壊数は①×・⑨×", "jun": "3寅→2丑→1×子→9×亥→8戌→7酉→6申→5未→4午→3巳……", "gyaku": "3寅→4卯→5辰→6巳→7午→8未→9×申→1×酉→2戌→3亥……"}, "note": "（月の盤の▲は、生年の盤の破壊の場に重なる所）", "yearBoard": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "months": [{"label": "2月　⑨寅", "month": 2, "num": "⑨", "branch": "寅", "board": [["", "", "✕", "", "▲"], ["", "8", "4", "6", "✕"], ["▲", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", ""]]}, {"label": "3月　①卯", "month": 3, "num": "①", "branch": "卯", "board": [["", "", "", "", "▲"], ["", "9", "5", "7", ""], ["○▲", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]]}, {"label": "4月　②辰", "month": 4, "num": "②", "branch": "辰", "board": [["", "", "", "", "✕▲"], ["○", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]]}, {"label": "5月　③巳", "month": 5, "num": "③", "branch": "巳", "board": [["", "○", "", "", "▲"], ["", "2", "7", "9", ""], ["✕▲", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]]}, {"label": "6月　④午", "month": 6, "num": "④", "branch": "午", "board": [["✕", "", "○", "", "▲"], ["", "3", "8", "1", ""], ["▲", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]]}, {"label": "7月　⑤未", "month": 7, "num": "⑤", "branch": "未", "board": [["", "", "", "○", "▲"], ["", "4", "9", "2", ""], ["▲", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "✕", "", "", ""]]}, {"label": "8月　⑥申", "month": 8, "num": "⑥", "branch": "申", "board": [["", "", "", "", "▲"], ["", "5", "1", "3", "○"], ["▲", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]]}, {"label": "9月　⑦酉", "month": 9, "num": "⑦", "branch": "酉", "board": [["", "", "", "", "▲"], ["", "6", "2", "4", ""], ["✕▲", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["", "", "", "", ""]]}, {"label": "10月　⑧戌", "month": 10, "num": "⑧", "branch": "戌", "board": [["", "", "", "", "▲"], ["✕", "7", "3", "5", ""], ["▲", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]]}, {"label": "11月　⑨亥", "month": 11, "num": "⑨", "branch": "亥", "board": [["", "✕", "✕", "", "▲"], ["", "8", "4", "6", ""], ["▲", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", ""]]}, {"label": "12月　①子", "month": 12, "num": "①", "branch": "子", "board": [["", "", "✕", "", "▲"], ["", "9", "5", "7", ""], ["▲", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]]}, {"label": "1月　②丑", "month": 1, "num": "②", "branch": "丑", "board": [["", "", "", "✕", "✕▲"], ["", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]]}], "step1Head": "〔手順１〕座標となる生年月の対応数理と、十二支との関係を読む。", "step1": [{"t": "text", "text": "まず最初に考えなければならない点は、「寅」は早春の季質をもっているので、春の草木が伸びようとする生命力が大地の圧力を打ち破って、光の中に芽を出す、それと似通った潜勢力をもっているが、外気の環境は冷たい。この潜象理をよく表してい【p.79】るのが、A③における数意と、H場にあるH①×の数意である。また大地は暖気なく、冷気に包まれてある季質をよく表しているのが、大地を象徴するG場に、温熱を象徴する⑨数が破壊数となって、G⑨×となっている数意が、よくこの理を証しているようだ。"}, {"t": "text", "text": "また③数の潜象理の機能は、直接、③の原郷に回帰することができず、かならずF場にあるF⑧と吸合して、木局化すると共に、③＋⑧＝11数の理を潜在に保つことによって、D⑥と呼び合い、その後において①×と水局する軌道を辿る習性がある。だから、A③・F⑧が木局することによって、A場にはA⑧の数意が作用し、D場には②×となって、10＋1＝11の理を形象化するので、D⑥との呼び合いが形成される理が成り立つ、二相の理が内在していることが理解できる。"}, {"t": "text", "text": "この潜象理としての二相の働きをよく象徴しているのが、寅③に対して巳③である。だからA場は③・③と同数が、同極相反する理によって、⑧数に変換され、A⑧の変換によってJ②と呼び合う原理がよく示しているようだ。"}, {"t": "text", "text": "年月対応で注意すべき年月は、八月申⑥生まれで、申は初秋の季質だから、寅月の早春の季質とは逆となっているので、生年のA③が申年では⑨×と重なって、年月共に暖【p.80】気の枯渇の状態を暗示している。従って運命相にその季質が投影して、物事が逆転しやすい暗示がある。また年月対応ではD⑥・D⑨×があるので、考え、理想が空転しやすく、堂々巡りを余儀なくやらされる暗示があると共に、④数そのものも、B④・B⑦×。H①×・H④となって、準破壊数となるから、調和がとれづらい難点があることが分かる。また⑨寅、①卯に対して、⑨亥、①子の対応理は、春季生まれは陽性を、冬季生まれは陰性の気質が心理に作用する暗示があるので、破壊性の意味にも、この理が投影するから、この点も見落とさないように判断すべきである。"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["▲", "", "", "", "▲"]], "b": [["", "", "", "", "▲"], ["", "5", "1", "3", "○"], ["▲", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "caption": "③寅年8月（⑥申月）"}, {"t": "pair", "a": [["", "", "▲", "", "▲"], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "✕", "", "▲"], ["", "8", "4", "6", "✕"], ["▲", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", ""]], "caption": "③寅年2月（⑨寅月）"}], "step2Head": "〔手順２〕波動の流れを把握するためには、補助周期の波動で大掴みし、その上で主周期の波動と十二支、クロス期、冲作用をよく注意する必要がある。", "step2Intro": [], "cycles": [{"label": "寅③・寅③", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "寅③・寅③の周期は、無難な周期で安泰な時間帯といえよう。ただし辰⑤の年はA③がH①×と重なるので若干、弱体化する暗示がある。"}], "rep": true}, {"label": "卯④・丑②", "board": {"t": "pair", "a": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["○", "2", "4", "6", "✕"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "b": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "卯④・丑②の周期は、女性は吉運だが、十二支が晩冬の季があるので、横バイ気味の推移の暗示がある。男性は春の季質があっても、A③がJ場でJ③×となるので、一高一低の横バイの暗示がある。"}], "rep": true}, {"label": "辰⑤・子①×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]], "caption": ""}, "items" ", ""]], "caption": ""}, "items": [{"t": "text", "text": "寅⑥・寅⑨×の周期は、補助波動の申と冲作用となるから、運命転換期の時間帯といえるので、修正が生じやすい暗示がある。"}, {"t": "text", "text": "男性は主周期では、上昇気運は続いている。が、補助周期が⑨×となっているので、渋滞気味となる可能性がある。女性は⑨×期だから下降となるが、補助波動との兼ね合いから見ると、弱運下降期となる暗示となる。特に⑨数月生まれ、⑨数の破壊をもつ月生まれ、申⑥月生まれは、凶性が強く誘引される可能性がある。"}, {"t": "pair", "a": [["", "", "▲", "", "▲"], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "✕", "", "▲"], ["", "8", "4", "6", "✕"], ["▲", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", ""]], "caption": "③寅年2月（⑨寅月）"}, {"t": "pair", "a": [["▲", "", "▲", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "✕", "✕", "", "▲"], ["", "8", "4", "6", ""], ["▲", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", ""]], "caption": "③寅年11月（⑨亥月）"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["▲", "", "", "", "▲"]], "b": [["", "", "", "", "▲"], ["", "5", "1", "3", "○"], ["▲", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "caption": "③寅年8月（⑥申月）"}], "rep": true}, {"label": "卯⑦・丑⑧", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "b": [["", "", "", "✕", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "卯⑦・丑⑧の周期は、男女共吉運であるが、九月酉⑦数に生まれた人は、物事が反転しやすい。特に男性は慎重に。女性は七月未⑤生まれは反転しやすく、⑧×をもつ月生まれは、弱含みの動揺しやすい時間帯となる。"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕▲", "1", "3", "5", "▲"], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "", "", "▲"], ["", "6", "2", "4", ""], ["✕▲", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "caption": "③寅年9月（⑦酉月）"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["▲", "", "", "", ""]], "b": [["", "", "", "○", "▲"], ["", "4", "9", "2", ""], ["▲", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "✕", "", "", ""]], "caption": "③寅年7月（⑤未月）"}], "rep": true}, {"label": "辰⑧・子⑦", "board": {"t": "pair", "a": [["", "", "", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰⑧・子⑦の周期は、吉運ではあるが、C波動が酉⑨×、戌①×があるので、男性は補助波動酉①×期だから、下降気運が身辺に漂う暗示がある。女性は弱運渋滞となる可能性がある。両者共に要注意すべき時間帯といえよう。"}], "rep": true}, {"label": "巳⑨×・亥⑥", "board": {"t": "pair", "a": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "b": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "【p.84】巳⑨×・亥⑥の周期は、男性は下降運となり、女性は弱含み横バイ期といえる。また十二支は冲であるが、補助波動の十二支と相互に合局となるから、冲作用は無力化するので、勘違いしないように。"}], "rep": true}, {"label": "午①×・戌⑤", "board": {"t": "pair", "a": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "午①×・戌⑤の周期は、補助波動の十二支ともに火局するから、男性は凶性が吉化緩和される暗示がある。ただし、九月酉⑦生まれは緩和されづらいので、年月対応のH①×・H⑤×の凶作用を注意。"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕▲", "1", "3", "5", "▲"], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "", "", "▲"], ["", "6", "2", "4", ""], ["✕▲", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "caption": "③寅年9月（⑦酉月）"}], "rep": true}, {"label": "未②・酉④", "board": {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "b": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "未②・酉④の周期は、無難な周期であるが、C波動が午⑨×、未①×となるので、油断しないように。"}], "rep": true}, {"label": "申③・申③", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "申③・申③の周期は、生年寅と冲となると共に、補助波動の亥・巳の冲と合体して、形象を形成するから、運命転換が生じやすい周期となる。その意味では吉運でも波立つ暗示がある。また大クロス期の中心周期となっているから、慎重に。"}], "rep": true}, {"label": "酉④・未②", "board": {"t": "pair", "a": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "b": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "酉④・未②の周期は、これまた無難な周期で、吉運横バイ型となる暗示があるが、④数が破壊数または準破壊となる、年月対応の人は、低迷、渋滞気運となりやすい。女性は弱含み吉運となる可能性がある。"}], "rep": true}, {"label": "戌⑤・午①×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "b": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "戌⑤・午①×の周期は、火局する理はあっても、補助波動の支と冲となって消える。【p.85】この点もしっかり把握したうえで、波動数の強弱、吉凶を読むべきである。この理を踏まえて、周期初めの破壊年は、卯⑨×となって十字形象を形成するので、潜象理は酉の場であるC場に潜む凶性が誘引しやすい環境となる。この点も合せて判断すべきである。また次の①×は辰年であるから、男性戌とは冲作用が幾分作用するので、運気渋滞がみられやすいので、二年間は物事が渋滞気味となるだけでなく、物事の修正が生じやすい暗示がある。"}, {"t": "text", "text": "女性の場合は、①×の凶性が出やすい周期だから、幾分下降気味になる暗示があるから、周期の三年間のうち、二年間も破壊年が続くので、下降運となる。だから無理は禁物である。"}], "rep": true}, {"label": "亥⑥・巳⑨×", "board": {"t": "pair", "a": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "b": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "caption": ""}, "items": [{"t": "text", "text": "亥⑥・巳⑨×の周期は、十二支が冲となっているから、運気が一時渋滞気味となりやすい点と物事の行詰り、方向転換が、良いにしろ、悪いにしろ生じやすい暗示がある。男性は吉運横バイ型となるが、女性は凶性を帯びるので、下降気味に推移する可能性がある。次に注意すべきは、生年寅と波動の亥・巳とはX形象を形成するために、申の場に流入するから、原点のG⑨×を誘引しやすい暗示がある。特にC波動の申⑤の年を注意すべきである。"}], "rep": true}]}, {"id": 9, "num": "③", "numVal": 3, "branch": "巳", "title": "③数巳年の読み方", "headingRaw": "【p.86（本文なし）】【p.87】③数巳年の読み方", "page": 87, "cycleText": "生年数③……三年周期（補助周期六年）", "male": {"head": "男性の場合（巳年）破壊数は①×・④×", "jun": "3巳→4×午→5未→6申→7酉→8戌→9亥→1×子→2丑→3寅……", "gyaku": "3巳→2辰→1×卯→9寅→8丑→7子→6亥→5戌→4×酉→3申……"}, "female": {"head": "女性の場合（巳年）破壊数は①×・④×", "jun": "3巳→2辰→1×卯→9寅→8丑→7子→6亥→5戌→4×酉→3申……", "gyaku": "3巳→4×午→5未→6申→7酉→8戌→9亥→1×子→2丑→3寅……"}, "note": "（月の盤の▲は、生年の盤の破壊の場に重なる所）", "yearBoard": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "months": [{"label": "2月　⑨寅", "month": 2, "num": "⑨", "branch": "寅", "board": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["▲", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", "▲"]]}, {"label": "3月　①卯", "month": 3, "num": "①", "branch": "卯", "board": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○▲", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", "▲"]]}, {"label": "4月　②辰", "month": 4, "num": "②", "branch": "辰", "board": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", "▲"]]}, {"label": "5月　③巳", "month": 5, "num": "③", "branch": "巳", "board": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕▲", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", "▲"]]}, {"label": "6月　④午", "month": 6, "num": "④", "branch": "午", "board": [["✕", "", "○", "", ""], ["", "3", "8", "1", ""], ["▲", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", "▲"]]}, {"label": "7月　⑤未", "month": 7, "num": "⑤", "branch": "未", "board": [["", "", "", "○", ""], ["", "4", "9", "2", ""], ["▲", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "✕", "", "", "▲"]]}, {"label": "8月　⑥申", "month": 8, "num": "⑥", "branch": "申", "board": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["▲", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕▲"]]}, {"label": "9月　⑦酉", "month": 9, "num": "⑦", "branch": "酉", "board": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["✕▲", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["", "", "", "", "▲"]]}, {"label": "10月　⑧戌", "month": 10, "num": "⑧", "branch": "戌", "board": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["▲", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", "▲"]]}, {"label": "11月　⑨亥", "month": 11, "num": "⑨", "branch": "亥", "board": [["", "✕", "✕", "", ""], ["", "8", "4", "6", ""], ["▲", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", "▲"]]}, {"label": "12月　①子", "month": 12, "num": "①", "branch": "子", "board": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["▲", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", "▲"]]}, {"label": "1月　②丑", "month": 1, "num": "②", "branch": "丑", "board": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", "▲"]]}], "step1Head": "〔手順１〕座標となる生年月の対応数理と、十二支との関係を読む。", "step1": [{"t": "text", "text": "まず最初に考えなければならない点は、「巳」は初夏の季質をもっているので、活気と熱気が発動する命質が潜在に在って、陽性が強く作用しやすく、外向型性情を形成しやすい暗示がある。またH場に①×をもっているので、行動化の面で、早過ぎた【p.88】り、遅過ぎたりの、タイミングがずれやすい点もあり、あるいは熱しやすく冷めやすい点もあるので、感情面がアンバランスとなりやすい点もある。"}, {"t": "text", "text": "次にB場に④×があるので、思いと行動が調和しづらく、人間関係が不調和となりやすい暗示もあることを、自己の原点的欠点として自覚すべき点がみられる。だが、これらの破壊数は直接作用しないで、潜象理の軌道を通って、①×とか、④×を生じるので、原点の軌道を知る必要がある。"}, {"t": "text", "text": "生年巳③は、原初的行動、考えが発動するかといえば、A③・F⑧の木局作用を誘発する面と、天数系列のD⑥・G⑨と吸引した後において、D⑥・H①×とが水局作用を起こして吸引する。またB④×はどこに誘引されるかといえば、A③・F⑧が木局することによって、A③が自動的に変換して、A⑧の意味機能をもつことによって、B④×・B⑨とが金局吉化作用を起こすと同時に、H①×・H⑥の水局吉化作用を誘発する暗示がある。その意味では巳③年の人の運命の吉凶は、乗り替わり、変化時、変革時の自己の対応、言動に原点的功罪があるといえそうである。"}, {"t": "text", "text": "年月の対応から判断すると、三月卯①生まれは、生年のH①×が生月のA①となり、生年のA③が生月ではC③×となっているだけでなく、⑧数がH①×・H⑧。F⑧・【p.89】F⑥×と対応して準破壊数となっているので、変換しづらい。自己喪失型ないし、執着型となりやすい暗示が強い。"}, {"t": "pair", "a": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", "▲"], ["", "6", "8", "4", ""], ["", "", "▲", "✕", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○▲", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", "▲"]], "caption": "③巳年3月（①卯月）"}, {"t": "text", "text": "季質から判断すれば、三月は春、五月は夏の季だから、陽性が強く、燃え上がる感情が考えられるけれども、分かりやすく説明すると、A③・A①の関係は、生木の意味をもっていると共に、A③がC③×となって三・五変化を生じやすい暗示がある点から勘案すれば、陽性のアンバランスの性情となりやすい。"}, {"t": "pair", "a": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", "▲"], ["", "6", "8", "4", ""], ["", "", "▲", "✕", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○▲", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", "▲"]], "caption": "③巳年3月（①卯月）"}, {"t": "pair", "a": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕▲", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", "▲"]], "b": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕▲", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", "▲"]], "caption": "③巳年5月（③巳月）"}, {"t": "text", "text": "また一月丑②月生まれの場合は、夏と冬の相反した性情があるだけでなく、陽性、熱気を象徴する⑨数が、生月対応で準破壊数となっているから、行動面がアンバランスとなりやすい暗示がある。"}, {"t": "pair", "a": [["", "○", "", "", "▲"], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "b": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", "▲"]], "caption": "③巳年1月（②丑月）"}, {"t": "text", "text": "次に六月午④生まれの場合は、十二支が巳と午だから、真夏の季質が強いから、陽性多過のように考えられやすいの s": [{"t": "text", "text": "戌⑧・子⑦の周期は、上昇後の弱含み吉運気といえるので、C波動酉①×の年は、運気が渋滞気味となりやすい暗示がある。また、前の周期とクロス期を形成するので、吉運ではあっても、動揺変換しやすい可能性がある。"}], "rep": true}, {"label": "亥⑨・亥⑥", "board": {"t": "pair", "a": [["", "✕", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", ""]], "b": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "亥⑨・亥⑥の周期は、生年の巳と冲となるだけでなく、補助波動も申・寅となって冲となるだけでなく、形象を形成するから、青年期の運命転換期といえる。運気は吉運ではあるが、動揺しやすい時間帯だから、C波動の子④×年はブレが大きく表出されやすい暗示がある。"}], "rep": true}, {"label": "子①×・戌⑤", "board": {"t": "pair", "a": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]], "b": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "子①×・戌⑤の周期は、十二支が補助波動と相互に合局吉化するから、男性の①×【p.92】は弱いので、弱含み横バイ期といえそうだ。女性は吉運ではあるが、弱含み上昇の暗示がある。"}], "rep": true}, {"label": "丑②・酉④×", "board": {"t": "pair", "a": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]], "b": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "丑②・酉④×の周期は、補助波動の十二支、生年の巳と、三合金局を形成するから、吉運上昇期といえる。ただし女性は吉運の気配はあっても、④×の凶意の不安も出やすい時間帯である。①×年は渋滞気味となる暗示がある。"}], "rep": true}, {"label": "寅③・申③", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "寅③・申③の周期は、十二支冲となるだけでなく、補助波動はクロス期、主波動は大クロス期を形成するので、運命の大転換期となりやすい。しかも波動の寅・申の冲があるので、変換、修正も生  ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "✕", "✕"]], "b": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "caption": ""}, "items": [{"t": "text", "text": "【p.93】巳⑥・巳⑨の周期は、補助波動の亥と巳とが冲をなすから、吉運であっても運命転換が生じやすいので、④×年は要注意。"}], "rep": true}, {"label": "午⑦・辰⑧", "board": {"t": "pair", "a": [["", "", "○", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "午⑦・辰⑧の周期は、吉運上昇期である。ただし、十一月亥⑨数月生まれの人は、弱運低迷型となりやすい暗示がある。女性は三月卯①、十二月子①の人は運気低迷型となりやすい暗示がある。"}, {"t": "pair", "a": [["▲", "○", "▲", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "b": [["", "✕", "✕", "", ""], ["", "8", "4", "6", ""], ["▲", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", "▲"]], "caption": "③巳年11月（⑨亥月）"}, {"t": "pair", "a": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", "▲"], ["", "6", "8", "4", ""], ["", "", "▲", "✕", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○▲", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", "▲"]], "caption": "③巳年3月（①卯月）"}, {"t": "pair", "a": [["", "○", "▲", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "▲", "✕", ""]], "b": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["▲", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", "▲"]], "caption": "③巳年12月（①子月）"}], "rep": true}, {"label": "未⑧・卯⑦", "board": {"t": "pair", "a": [["", "", "", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "", "", ""]], "b": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "未⑧・卯⑦の周期は、十二支が木局しているから、吉運が続くけれども、男性は補助波動①×の影響を受けて、弱含み横バイ型となりやすい。だから男性①卯は木局吉化しいくらかカバー緩和されるけれども、①子月生まれは弱含み下降気配となりやすい。女性は寅⑨、亥⑨の人は⑦数が準破壊だから、弱含み下降気配となりやすい。ただし、亥月生まれは木局吉化するので、若干緩和される暗示がある。男女共①×年は凶性が出やすいので要注意。"}, {"t": "pair", "a": [["", "○", "▲", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "▲", "✕", ""]], "b": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["▲", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", "▲"]], "caption": "③巳年12月（①子月）"}, {"t": "pair", "a": [["", "○", "▲", "", "▲"], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "b": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["▲", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", "▲"]], "caption": "③巳年2月（⑨寅月）"}, {"t": "pair", "a": [["▲", "○", "▲", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "b": [["", "✕", "✕", "", ""], ["", "8", "4", "6", ""], ["▲", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", "▲"]], "caption": "③巳年11月（⑨亥月）"}], "rep": true}, {"label": "申⑨・寅⑥", "board": {"t": "pair", "a": [["", "", "✕", "", ""], ["", "8", "4", "6", "○"], ["", "7", "9", "2", ""], ["✕", "3", "5", "1", ""], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["", "", "", "", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "申⑨・寅⑥の周期は、十二支冲となるので、吉運ではあっても、反転、変換が生じやすい周期であるから、特に寅月・申月の人は慎重に行動すべきである。だから④×年は特に要注意すべき年である。"}, {"t": "pair", "a": [["", "○", "▲", "", "▲"], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "b": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["▲", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", "▲"]], "caption": "③巳年2月（⑨寅月）"}, {"t": "pair", "a": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1 秋の季質をもっているので、稔りの秋へと、収縮へと向かう一歩手前の意味が象徴する気質が内包されているので、外力と内力が不調和となりやすい暗示があるから、物事の変革期に、行動と思考が喰い違【p.96】いやすい点がある。"}, {"t": "text", "text": "この気質は何に原因しているかといえば、行動を象徴するH場に①×があるから、感違いが生じやすい点と、物事の変革、変換、波瀾期に、現実と理想とが喰い違い、環境把握のズレが生じやすい体質から、思いとは違った成り行きとなりやすい欠陥が生じやすいのも、D⑥×とH①×が潜在で作用するからである。だから、いかに破壊性を緩和させるか、吉化させるかが、運命の明暗を分ける端緒となりやすい。"}, {"t": "text", "text": "年月対応数理からみれば、申に対して二月寅は、十二支冲となるので、物事、考え、行動が反転しやすいだけでなく、生年A③は月との対応ではD⑥×・D③となり、生月A⑨は年との対応ではG⑥×・G⑨となる。従って、A③・A⑨の潜象理は、一貫性が乏しく、考え、行動が変換しやすい命質があることが分かる。またこの気質を誘発するように、年月対応でE⑦・E④×。H①×・H⑦となって、⑦数そのものが準破壊数となっているから、物事、考えが途中で折れやすい暗示がある点からみても、よく理解できると思う。また同じ⑨数であっても、亥⑨の場合は、十二支は冲ではないから、変換しづらい点があるが、途中挫折型の気質が作用しやすい気質がみられる。"}, {"t": "pair", "a": [["", "", "▲", "", "▲"], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["▲", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["▲", "", "", "", ""]], "caption": "③申年2月（⑨寅月）"}, {"t": "text", "text": "次に卯①月の場合は、A①は生年のH①×に該当し、C③×は生年のC⑤と対応す【p.97】るので、感情面の振幅の度合が不安定となりやすい点と、⑧数が準破壊となっているので、物事の乗り変わり時に判断を誤りやすい傾向がみられる。子①月の人もこれに類した気質がある。他の生月の人も、これに倣って、自己の気質を知ったうえで、生年波動を数読みすれば、プラスする点が多々あると思う。"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", "▲"], ["✕", "6", "8", "4", ""], ["", "", "▲", "", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○▲", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["▲", "", "✕", "", ""]], "caption": "③申年3月（①卯月）"}, {"t": "pair", "a": [["", "", "▲", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "▲", "", ""]], "b": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["▲", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["▲", "", "✕○", "", ""]], "caption": "③申年12月（①子月）"}], "step2Head": "〔手順２〕波動の流れを把握するためには、補助周期の波動で大掴みし、その上で主周期の波動の十二支、クロス期、冲作用をよく注意する必要がある。", "step2Intro": [], "cycles": [{"label": "申③・申③", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3",  "pair", "a": [["", "", "", "✕", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]], "b": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "丑⑧・卯⑦の周期は、男女共に吉運であるから、①×年だけを注意すればよい。ただし男性は⑧数、女性は⑦数が準破壊となる人は、弱運となるので、凶性は誘引しやすいから要注意である。"}], "rep": true}, {"label": "寅⑨・寅⑥×", "board": {"t": "pair", "a": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["", "", "", "", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "【p.99】寅⑨・寅⑥×の周期は、年の申と冲となるだけでなく、補助波動も冲で、十二支が形象となるから、少年期から青年期に向かっての、変換期となる時間帯である。だから男女共波瀾含みとなりやすい。特に申年生まれの人は凶性を誘発しやすく、女性は下降運となり、男性は弱含み低迷型となりやすい。"}], "rep": true}, {"label": "卯①×・丑⑤", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "卯①×・丑⑤の周期は、補助波動と主波動の十二支が、合局軌道にあるけれども、波動数⑥×・①×である男性は緩和の度合が弱いので、下降運となる。これに反して女性は吉運上昇型となる。だから巳⑥×年は凶性が緩和されるので、弱含みとなる。男性は未⑧の年から木局吉化して、凶運の中から、吉運の要因が芽生える暗示がある。"}], "rep": true}, {"label": "辰②・子④", "board": {"t": "pair", "a": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]], "b": [["✕", "", "✕", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "○", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰②・子④の周期は、主波動・補助波動ともに水局吉化するので、本格的な、青年期の上昇運となる。また大クロス期に入っているので、環境の変化と共に、吉運の気配が感じられてくる暗示がある。ただし、男性は②数、女性は④数が準破壊となっているか、生月で破壊数となっている場合は、上昇力は鈍く、弱含み横バイ型となりやすい暗示がある。①×年は男女共、上昇力が鈍る可能性があるので見誤らないように。"}], "rep" ×年を注意。また⑥数月、⑥×を生月にもつ人は、下降運となりやすい暗示がある。"}, {"t": "pair", "a": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["○", "2", "4", "6", "✕"], ["", "7", "9", "5", ""], ["", "", "", "", "▲"]], "b": [["▲", "○", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", "▲"], ["", "9", "2", "7", ""], ["", "", "", "✕", "✕"]], "caption": "④卯年5月（⑥巳月）"}], "rep": true}, {"label": "亥③×・未⑤", "board": {"t": "pair", "a": [["", "✕", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "○", ""]], "b": [["", "", "", "○", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "亥③×・未⑤の周期は、男性は③×期ではあるが、十二支木局すると共に、補助波動が⑧数となっているだけでなく、木局しているから、この③×は弱体化するだけでなく、緩和吉化される可能性がある。女性は上昇運となる。"}], "rep": true}, {"label": "子④・午④", "board": {"t": "pair", "a": [["✕", "", "✕", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "○", "", ""]], "b": [["✕", "", "○", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "子④・午④の周期は、男性は弱含み横バイ型、女性は吉運上昇型となる。だが十二支が冲となるので、反転、転換が生じやすい暗示がある。⑥×年は要注意。"}], "rep": true}, {"label": "丑⑤・巳③×", "board": {"t": "pair", "a": [["", "", "", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "", "", ""]], "b": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "caption": ""}, "items": [{"t": "text", "text": "丑⑤・巳③×の周期は、十二支が金局軌道にあるだけでなく、補助波動は⑨・⑧となって小クロス期を形成しているので、女性の巳③×は緩和吉化される暗示がある。【p.127】男性は弱含み上昇期である。"}], "rep": true}, {"label": "寅⑥×・辰②", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3" , "", "", "", ""]], "b": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "寅③×・戌⑤の周期は、十二支は火局するので、また、補助波動⑧・⑨×とが呼び合って、男性は緩和吉化される可能性があるから、C波動寅⑨×年も、凶性が緩和さ【p.135】れる可能性がある。だが巳③×年は、緩和の度合が弱いから、凶性を誘発しやすいので要注意。特に二月、三月、十一月、十二月生まれは凶性を誘発しやすい暗示があるので要注意。女性は吉運ではあるが、弱含み吉運の暗示がある。ただし、五月生まれは渋滞気味となる暗示がある。"}, {"t": "pair", "a": [["✕", "", "○", "", "▲"], ["", "3", "8", "1", ""], ["▲", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "b": [["▲", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "▲", "", ""]], "caption": "④午年2月（③寅月）"}, {"t": "pair", "a": [["✕▲", "", "○", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", "▲"], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "b": [["✕▲", "", "", "", ""], ["", "3", "8", "1", ""], ["○", "2", "4", "6", "✕"], ["", "7", "9", "5", ""], ["", "", "▲", "", ""]], "caption": "④午年3月（④卯月）"}, {"t": "pair", "a": [["✕▲", "", "○", "", ""], ["", "3", "8", "1", ""], ["▲", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "b": [["▲", "✕", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "▲", "○", ""]], "caption": "④午年11月（③亥月）"}, {"t": "pair", "a": [["✕▲", "", "○▲", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "b": [["✕▲", "", "✕", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "○▲", "", ""]], "caption": "④午年12月（④子月）"}, {"t": "pair", "a": [["✕", "", "○", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", "▲"]], "b": [["▲", "○", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "▲", "✕", "✕"]], "caption": "④午年5月（⑥巳月）"}], "rep": true}, {"label": "卯④・酉④", "board": {"t": "pair", "a": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["○", "2", "4", "6", "✕"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "b": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "卯④・酉④の周期は、生年④数の原点帰りの周期であるから、男女共吉運であっても、生月との対応で、反転、変換が生じやすい。不安要因を含んだ周期である。それを暗示するように、補助波動はクロス期、主波動は大クロス期となっているから、運命転換期となる意味を秘めた周期といえる。特に男性は酉⑦年が冲となるので、物事、運気の反転が生じやすい暗示がある。"}], "rep": true}, {"label": "辰⑤・申③×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰⑤・申③×の周期は、十二支は水局軌道にあるので、生年午の陽性は沈静化しやすい暗示がある。この潜象理を暗示するように、補助波動は冬型の亥⑨×・丑⑧となっているから、男性は表面、吉運にみえても、弱含みとみるべきで、五月生まれの人は、渋滞低迷型となる可能性がある。女性は③×期ではあるが水局と、補助波動⑧と木局吉化するので、凶性は緩和されるから、弱含み低迷型となる可能性がある。だから男女共に、⑨×年は要注意。"}, {"t": "pair", "a": [["✕", "", "○", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", "▲"]], "b": [["▲", "○", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "▲", "✕", "✕"]], "caption": "④午年5月（⑥巳月）"}], "rep": true}, {"label": "巳⑥・未②", "board": {"t": "pair", "a": [["", "○", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "✕", "✕"]], "b": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "【p.136】巳⑥・未②の周期は、男女共に上昇運である。だが補助波動亥⑨×・丑⑧との対応では、十二支が相互に冲となっているから、運気が動揺しやすい暗示を、上昇の中に内包しているので、③×年は要注意。特に男性は六月生まれ、女性は二月・十一月生まれは、凶性が誘発しやすい年である。"}, {"t": "pair", "a": [["✕", "", "○", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", "▲"], ["", "7", "9", "5", ""], ["", "", "✕▲", "", ""]], "b": [["▲", "", "○  "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]]}], "step1Head": "〔手順１〕座標となる生年月の対応数理と、十二支との関係を読む。", "step1": [{"t": "text", "text": "まず最初に考えなければならない点は、「丑」は冬の晩冬の季質を強く内包しているので、収縮し切った基層に、春を迎えるための陽性の春質を自生する潜在性がある。別言すれば、陰極まって陽を生ずという理が、自生す【p.149】る暗示をもっている季質といえよう。だから陽性の火気を欲することにより、丑の場にある、変革を象徴するD⑧が、春の季を迎える気質に変換してくると、春と同質の③数に質転換されてくる。この潜象理によって、中心のA場にあるA⑤は火気を象徴する⑨数の理を基層に自生さすことになる。だから、A⑤が⑥数に変換した場合は、自動的にD場にD⑨が自生するから、今まで冬眠していた命質が、火気の潜勢力となって発動する機能が内在しているようだ。その意味では、丑⑤は火気を欲し、変換し、活力と性能を同時に発動するが、そのキッカケを作るのが、夏の季質をもつ未である。だから、未と丑が冲作用によって、変質することを暗示している。"}, {"t": "text", "text": "この冲作用によって変質しやすい気質をよく暗示しているのが、七月②未で、生年A⑤は生月のD⑤×となり、生月のA②は生年のG②×となって、年月が互換して破壊数となっていることは、古い殻を破って、新生の命質に乗り変わる気質が醸成されることを暗示しているのである。だから、さきに説明したように、A⑤が変生すればA⑥となり、A②が変生すればA⑨となる理は、ここに秘蔵されているといえる。"}, {"t": "pair", "a": [["", "", "", "✕", "▲"], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["▲", "○", "", "", ""]], "b": [["", "", "", "○", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "caption": "⑤丑年7月（②未月）"}, {"t": "text", "text": "これに対して、春の辰⑧の場合は、陽性はあるけれども、辰に水気があるので、変換が一度ではできづらい暗示がある。また秋の戌⑤の場合は、秋の気質があるので、A⑤そのものが収縮する陰性を帯びている反面、戌は火気【p.150】を含んでいるので、膨張しようとする力とが衝突するので、内向型の気質と、反発型の気質が内在し、潜勢力が調和した時点で、⑤・⑤の並列理が⑨数の火気を誘引する理と、変換した⑥数に変質する理の、二面性を内包しているといえる。"}], "step2Head": "〔手順２〕波動の流れを把握するためには、補助周期の波動で大掴みし、その上で主周期の波動の十二支、クロス期、冲作用をよく注意する必要がある。", "step2Intro": [], "cycles": [{"label": "丑⑤・丑⑤", "board": {"t": "pair", "a": [["", "", "", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "", "", ""]], "b": [["", "", "", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "丑⑤・丑⑤の周期は、春から夏へ向かう生月生まれは無難な中にも、吉運の潜勢力が感じられるが、七月生まれは丑と未で冲作用となり、反転・変換しやすい潜在力は内在しているけれども、自力性が弱い時期なので、グズツキが生じやすい時期がある。秋月生まれは土生金の理から、無難であるが、十月生まれは晩秋の季質があり、陰性が強まりつつあるので、内向型の気質となりやすく、⑤・⑤の並列が⑤＋⑤＝⑩の理と 3", ""], ["", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "未⑧・未②×の周期は、十二支が生年丑と冲となる時間帯で、運気変換期といえよう。特に一月丑⑧数の人は、逆転し、吉性化する暗示があるうえに、補助波動も戌・辰冲となって、完全なX型交流を形成しているので、反転して③数の意味となりやすい。③数はいうまでもなく、木局軌道にある卯の場にあるH③の意味を内在化することになる。だから戌②×年は、凶性が緩和吉化する人と、弱体化する人に二分しやすい暗示がある。女性は凶性が誘発する人と、緩和される人と二分されやすいので、下降気味に波立ちやすい暗示といえよう。特に②×年は要注意。亥③数年は木局緩和されますから、再び吉化の兆が誘発されてくる年となる暗示がある。"}, {"t": "pair", "a": [["", "", "", "✕", "▲"], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["▲", "○", "", "", ""]], "b": [["", "", "", "✕", "▲"], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]], "caption": "⑤丑年1月（⑧丑月）"}], "rep": true}, {"label": "午⑦・申③", "board": {"t": "pair", "a": [["", "", "○", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "午⑦・申③の周期は、男性は補助波動戌②×であっても、主波動が午⑦で火局吉化するので、本格的上昇期入りしたことを象徴している。特に寅⑦数年からの上昇力は強力化される暗示がある。女性は弱運上昇横バイ型の暗示がある。"}], "rep": true}, {"label": "巳⑥・酉④", "board": {"t": "pair", "a": [["", "○", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "✕", "✕"]], "b": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "巳⑥・酉④の周期は、補助波動・主波動とも巳・酉金局軌道を形成するので、男女共、吉運上昇ではあるが、女性の方が若干運気は弱い。また未②×年は凶性は緩和吉化されるので、グズツク程度で、上昇の中の下降または横バイ型の年といえるだろう。"}], "rep": true}, {"label": "辰⑤・戌⑤", "board": {"t": "pair", "a": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰⑤ 列は⑨数に吸引するから陽性を欲する反面、⑤＋⑤＝⑩の理も働くところから、陽性と陰性が和合して、混沌となって行動が鈍る暗示もある。この理をよく暗示しているのが、年のB⑥×であり、月のJ④×で、気の交流における不調和を暗示していることは、人間関係、考え、行動面にこの潜象理が表出されやすい暗示とみなさなければならない。"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", "▲"]], "caption": "⑤辰年10月（⑤戌月）"}], "step2Head": "〔手順２〕波動の流れを把握するためには、補助周期の波動で大掴みし、その上で主周期の波動の十二支、クロス期、冲作用をよく注意する必要がある。", "step2Intro": [], "cycles": [{"label": "辰⑤・辰⑤", "board": {"t": "pair", "a": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰⑤・辰⑤の周期は、無難な周期ではあるが、冬期に生まれた人は弱運となりやすく、特に生月で⑤×となる十一月、一月生まれの人は、渋滞気味で、低迷型となりやすい暗示がある。男女共に巳⑥×は陽性が強いので、凶性は緩和される暗示があるが、生月によって多少の差は生じる。"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "", "", "▲"]], "b": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕▲"]], "caption": "⑤辰年11月（⑥亥月）"}, {"t": "pair", "a": [["", "", "", "", "▲"], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["▲", "", "", "", ""]], "b": [["", "", "", "✕", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", "▲"]], "caption": "⑤辰年1月（⑧丑月）"}], "rep": true}, {"label": "卯④・巳⑥×", "board": {"t": "pair", "a": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["○", "2", "4", "6", "✕"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "b": [["", "○", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "✕", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "卯④・巳⑥×の周期は、男性は吉運ではあるが、生年A⑤が波動④によって、B⑥×・B⑤と対応する理によって、不安定要因を孕んでいるので、吉運ではあっても、低迷横バイ型となりやすい暗示がある。この理をよく象徴しているのが、C波動の十【p.159】二支で、秋から冬え向かっているので、陰性化の傾向が強く作用し、卯④の春の季質を圧迫していることがよく象徴している。"}, {"t": "text", "text": "女性は⑥×の凶性を帯びた時間帯ではあるが、十二支の辰における水質と、水質に対して、巳の火質によって、凶性が緩和される暗示がある。だから、たとえC波動が秋から冬型が回座しても、水・木・火の対応理から、凶性は強く誘発されないので、弱運低迷型となりやすい暗示がある。だから、生月にもよるけれども、冲となる戌②年、亥③年は運気の動揺のブレが生じやすい年だから要注意。"}], "rep": true}, {"label": "寅③・午⑦", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "○", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "寅③・午⑦の周期は、主波動の十二支は火局軌道にあり、補助波動は卯・巳で、春から夏の季質となっているだけでなく、男性はH③、女性はC⑦が回座しているので、少年期から青年期え向けての、上昇運となる暗示がある。その意味では男女共に吉運上昇といえる。だから、たとえ周初めのC波動寅⑥×であっても、凶性は緩和される暗示がある。ただし、申月生まれの人は、寅・申が冲となるので要注意。また午月生まれも要注意年となる。女性は生月に⑦×がある人は、吉運が弱体化して、低迷型となる暗示もあるが、火局作用が強いので、緩やかな上昇運に変換される可能性もある。"}, {"t": "pair", "a": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["▲", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["▲", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", "▲"]], "caption": "⑤辰年8月（③申月）"}, {"t": "pair", "a": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "▲", "", ""]], "b": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", "▲"]], "caption": "⑤辰年6月（①午月）"}], "rep": true}, {"label": "丑②・未⑧", "board": {"t": "pair", "a": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]], "b": [["", "", "", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "丑②・未⑧の周期は、吉運ではあるが、変化しやすい。不安定な運気が内包されて【p.160】いる。男性は丑の冬型だから、吉運といっても、横バイ型の弱い吉運といえる。ただし、一月丑月生まれは、吉運変じて、凶性を帯びた渋滞低迷型となりやすい暗示がある。女性は吉運であるが、七月未生まれの人は、動揺が生じやすく、不安定となりやすく、一月丑生まれの人は、吉化の度合が強化される暗示がある。"}, {"t": "pair", "a": [["", "", "", "", "▲"], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["▲", "", "", "", ""]], "b": [["", "", "", "✕", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", "▲"]], "caption": "⑤辰年1月（⑧丑月）"}, {"t": "pair", "a": [["", "", "", "", "▲"], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["▲", "", "", "", ""]], "b": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", "▲"]], "caption": "⑤辰年7月（②未月）"}, {"t": "text", "text": "男性はC波動亥⑥×は要注意。女性は木局要因があるから、凶性は緩和される暗示がある。たとえ補助波動に巳⑥×がある周期であっても、巳⑥×の時はA場が⑦数となるので、運命に凶性を与える率は弱い。"}], "rep": true}, {"label": "子①・申⑨", "board": {"t": "pair", "a": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]], "b": [["", "", "✕", "", ""], ["", "8", "4", "6", "○"], ["", "7", "9", "2", ""], ["✕", "3", "5", "1", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "子①・申⑨の周期は、十二支が三合水局するので、吉運ではあっても、男性は冬の季質があるから、たとえ補助波動に寅・午の火気の陽性があっても、水局の陰性が強いから、水火合一とはなりづらく、むしろ水火不調の暗示が強いので、不安定な運気をともなう傾向がある。女性は吉運で、緩やかな上昇は続く暗示がある。"}], "rep": true}, {"label": "亥⑨・酉①", "board": {"t": "pair", "a": [["", "✕", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "亥⑨・酉①の周期は、男女共吉運ではあるが、男性の方が弱い。だから申⑥×年は要注意。女性は①・⑥水局吉化するので、⑥×年は凶性は緩和吉化される暗示がある。ただし八月生まれは弱運不安定となり、三月生まれは物事が反転しやすい暗示がある。"}, {"t": "pair", "a": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["▲", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["▲", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", "▲"]], "caption": "⑤辰年8月（③申月）"}, {"t": "pair", "a": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", "▲"], ["", "8", "1", "6", "✕"], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "", "", "▲"]], "caption": "⑤辰年3月（⑦卯月）"}], "rep": true}, {"label": "戌⑧・戌②", "board": {"t": "pair", "a": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "戌⑧・戌②の周期は、生年辰と冲をなすだけでなく、補助波動も丑・未と冲をなし【p.161】ているので、運気が反転しやすい暗示があるので、吉運は男女共に続いているが、不安定要因が内包される。特に辰月生まれ、戌月生まれの人は、反転の暗示、動揺が強く表出されやすい暗示がある。"}, {"t": "pair", "a": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["▲", "", "", "", "▲"]], "b": [["", "", "", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", "▲"]], "caption": "⑤辰年4月（⑧辰月）"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", "▲"]], "caption": "⑤辰年10月（⑤戌月）"}], "rep": true}, {"label": "酉⑦・亥③", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["✕", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "b": [["", "✕", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "○", ""]], "caption": ""}, "items": [{"t": "text", "text": "酉⑦・亥③の周期は、男性は吉運が安定度を強めるが、女性は冬の季質があるので、弱運横バイ型で、生年A⑤と主波動③が、五・三の変化を生じやすい暗示があるから、年月対応、または年月に③×をもつ人は、弱運渋滞型となりやすい暗示がある。特に女性の場合は、巳⑥×年は要注意。男性は緩和吉化される暗示がある。だが、年月対応で⑦数が準破壊数となるか、生月で⑦×となっている人は、弱運渋滞型の周期となりやすい暗示があるので注意。"}], "rep": true}, {"label": "申⑥×・子④", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["✕", "", "✕", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "○", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "申⑥×・子④の周期は、十二支は水局軌道にあるので、生年辰と関連して、三合水局するので、男性の⑥×は緩和吉化される暗示がある。ただし、生月に⑥×がある場合は、吉化の度合が弱いので、弱含み低迷型となりやすい暗示がある。"}, {"t": "text", "text": "女性は吉運ではあるが、年のB⑥×の上に、波動で生年A⑤が、B⑤となって対応するから、九月生まれ、生月で⑤×がある人は、弱運化しやすいので、横バイ型となりやすい暗示がある。"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["○", "4", "9", "2", ""], ["▲", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "", "", ""]], "b": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", "▲"]], "caption": "⑤辰年9月（④酉月）"}], "rep": true}, {"label": "未⑤・丑⑤", "board": {"t": "pair", "a": [["", "", "", "○", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "✕", "", "", ""]], "b": [["", "", "", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "【p.162】未⑤・丑⑤の周期は、十二支が未・丑と冲となっているだけでなく、大クロス期の中心に位する周期となっているので、運気が変転しやすい因子を作りやすい時期であるから、吉凶に関わらず慎重に対処すべき時間帯といえる。特に男性は丑月生まれ、女性は未月生まれの人は、運気反転が起きやすいので、吉が凶に、凶が吉となりやすい暗示が強いので、男性は周期初めの丑⑤の年、次の⑥×年を注意し、油断しないように。またこの⑥×年は寅年だから、九月酉生まれの人は、凶性が出やすいので要注意。また⑥数月生まれの人も、動揺が生じやすい年といえよう。"}, {"t": "pair", "a": [["", "", "", "", "▲"], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["▲", "", "", "", ""]], "b": [["", "", "", "✕", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", "▲"]], "caption": "⑤辰年1月（⑧丑月 : "pair", "a": [["", "", "", "", "▲"], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", "▲"]], "b": [["▲", "", "", "", ""], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["", "", "", "", "✕"]], "caption": "⑤戌年2月（⑥寅月）"}, {"t": "text", "text": "これに対して、同数である十一月亥⑥数月は初冬の季質であるだけでなく、戌に内包される火気と連動しないで、F場のF①・F②の原点の意味を表すので、凍土の潜在化と化す意味があるので、陰性が強まり、内向型の気質となりやすい暗示がある。"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", "▲"]], "b": [["▲", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "caption": "⑤戌年11月（⑥亥月）"}, {"t": "text", "text": "六月午の人は、十二支が火局軌道にあると共に、午そのものは夏の季質が強いので、内向型から外向型に変換しやすい気質となる暗示がある。だが中心のA場はA⑤・A②となって土局するので、冷静な面を内部に秘めて、調和のとれた気質の暗示がみられる。数理からみても、J④×・J⑨が合局金局して吉化する要因をもち、E⑨・E⑤となって陽性が強く、よく調和していると共に、基礎的な意味をもつG場では、G②・G⑦が火局するだけでなく、F①・F⑥×を水局吉化する要因を秘めているので、【p.174】よく調和がとれた気質を内包しているのが読める。"}, {"t": "pair", "a": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "▲", "", ""]], "b": [["▲", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": "⑤戌年6月（①午月）"}, {"t": "text", "text": "四月辰⑧数生まれの場合は、春と秋の季質が内包され、冲しているので、物事の反転が生じやすく、物事の乗り変わり、運気の変わり目に、調和を破りやすい気質を内包している暗示がある。同数の一月生まれは、陰性が強いので、内向型の気質が強まる。"}, {"t": "pair", "a": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["▲", "", "", "", "▲"]], "b": [["▲", "", "", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "caption": "⑤戌年4月（⑧辰月）"}, {"t": "pair", "a": [["", "", "", "", "▲"], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["▲", "", "", "", ""]], "b": [["▲", "", "", "✕", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]], "caption": "⑤戌年1月（⑧丑月）"}], "step2Head": "〔手順２〕波動の流れを把握するためには、補助周期の波動で大掴みし、その上で主周期の波動の十二支、クロス期、冲作用をよく注意する必要がある。", "step2Intro": [], "cycles": [{"label": "戌⑤・戌⑤", "board": {"t": "pair", "a": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "戌⑤・戌⑤の周期は、無難な周期ではあるが、C波動の十二支が戌から丑えと、冬型を示しているので、弱運低迷型となりやすい。ただし、周終わりの寅年は火局軌道を形成するので、陽性が働き、活気が出る暗示がある。だが、幼年期で特に運気が低迷しやすいのが、冬の生まれで、特に生まれ月で⑤×をもつ人は、運気渋滞気味となりやすい暗示がある。"}], "rep": true}, {"label": "酉④×・亥⑥", "board": {"t": "pair", "a": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "b": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "酉④×・亥⑥の周期は、男性は④×期で、しかも酉の秋季があるので、運気は下降気味に低迷しやすい暗示がある。女性は吉運ではあっても、冬の季質があり、生年のA⑤が波動数⑥との絡みでJ④×・J⑤【p.175】となるので、上昇するには力不足だから、弱含み吉運型の周期といえる。特に男性の場合は、酉④数月、戌⑤数月生まれの人は凶性が強く誘発される。女性の場合は亥⑥数生まれの人は、弱含み低迷型となりやすく、子⑦数月生まれも、これに準じて低迷型となりやすい暗示がある。C波動の午④×年は凶運年ではあるが、④×がF場にあることは、A⑨であるから、凶性が緩和されやすい暗示となる。"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["✕", "4", "9", "2", ""], ["▲", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "b": [["✕▲", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": "⑤戌年9月（④酉月）"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "b": [["▲", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "caption": "⑤戌年10月（⑤戌月）"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", "▲"]], "b": [["▲", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "caption": "⑤戌年11月（⑥亥月）"}, {"t": "pair", "a": [["", "", "▲", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", "▲"], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "b": [["▲", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", ""]], "caption": "⑤戌年12月（⑦子月）"}], "rep": true}, {"label": "申③・子⑦", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "申③・子⑦の周期は、十二支が水局軌道にあるので、陰性が強くなるから、たとえ波動数は吉数で、吉運の運気があったとしても、潜勢力は水局軌道の辰の場にある、J④×を誘引しやすくなるから、弱運低迷型となる可能性がある。男性は③×をもっている人、女性は⑦×をもっている人は、吉運低迷型であっても、運気の実勢は下降気運を内に孕むので、パッとしない、渋滞気味の横バイ型になりやすい暗示がある。この運気の実勢をよく暗示しているのが、補助波動の酉④×・亥⑥で、この数によっても主波動の③・⑦が破壊性を帯びることからみても、よく理解できると思う。"}], "rep": true}, {"label": "未②・丑⑧", "board": {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "b": [["", "", "", "✕", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "未②・丑⑧の周期は、十二支冲となっているので、今まで低迷型でグズツイタ運気が、ようやく活気を取り戻す環境となったことを暗示している。この潜象理をよく証しているのが、補助波動の酉・亥と、主波動の未・丑とが歪曲して呼び合う酉・丑。【p.176】亥・未となって、いる潜象理がよく暗示しているといえよう。だから、男性はC波動の丑②をもって冲となり、運気反転し、卯④×年の凶性は木局の気質によって緩和され、そこが運気の乗り変えの節目となり、上昇気運が胎生する暗示がある。"}, {"t": "text", "text": "女性は開運の時期がズレ込み、周終わりの巳年をもって、上昇気運が胎生する暗示がある。だから、卯④×年は凶性の暗示をうけやすい可能性がある。"}], "rep": true}, {"label": "午①・寅⑨", "board": {"t": "pair", "a": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "午①・寅⑨の周期は、十二支が生年戌と呼び合って、三合火局するので、青年期の吉運上昇型の周期といえる。だが、補助波動の十二支である申・子の水局軌道と交わるので、歪曲して冲される面もあるから、動揺が生じやすく、吉運の中に凶性を誘発する暗示もある。だから、男性は①×をもっている人、女性は⑨×をもっている人は、陰性から急に陽性が強まる関係上、不調和しやすく、上昇力が弱められる暗示もある。ここで注意すべきは、主波動がクロス期を形成しているので、反転しやすい要因もあるということを見落とさないように。"}], "rep": true}, {"label": "巳⑨・卯①", "board": {"t": "pair", "a": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "巳⑨・卯①の周期は、男女共に吉運ではあるが、男性は巳⑨だからA場にはA①の作用があるので、前の周期の影響が続く暗示があるが、A⑤・A①と土局するので、吉運上昇力が渋滞気味になる暗示【p.177】がある。その意味では、吉運低迷型といえよう。"}, {"t": "text", "text": "女性は卯①だから、A場にはA③が作用するので、五・三の変化を誘発し、陰陽不調和となって、低迷型となりやすい暗示がある。だから、C波動の子④×は凶性の作用を誘引しやすい。男性はむしろ、周初めの③亥年が冲となるので、運気に不安定な動揺が生じやすく、凶性を自ら誘引した場合は、次の子④×年にその凶性を受けやすい暗示がある。またA④×・A⑨は金局するので、凶性は緩和されるので、弱含みに変化する人、強含みに変換される差が、生月によって振り分けられる暗示がある。"}], "rep": true}, {"label": "辰⑧×・辰②", "board": {"t": "pair", "a": [["", "", "", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "b": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰⑧×・辰②の周期は、生年戌と冲となる周期なので、運気変革の意味が強く、また補助波動も未・丑の冲となっているので、X型形象となっているから地数系列の②・⑤・⑧の月に生まれた人は、運気が反転しやすく、動揺が強く生じやすい暗示がある。"}, {"t": "text", "text": "男性は辰⑧の波動だから、A⑨の理が作用するから、凶性も吉化する可能性を秘めている。女性は辰②の波動だから、A③の理が作用し、五・三の変化を誘引するので、吉運の人でも動揺が生じやすい暗示がある。その意味では、男女共に吉運動揺型の周期といえよう。"}], "rep": true}, {"label": "卯⑦・巳③", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "b": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "caption": ""}, "items": [{"t": "text", "text": "卯⑦・巳③の周期は、補助波動の十二支、波動数が合局するので、運気が強化され、吉運上昇型となる暗示がある。だが男性は吉運が強化されても、女性は巳③の波動だ【p.178】から、A④の理が潜在で作用するので、吉運にみえて、内部は不安要因が生じやすい暗示がある。だが酉④×年は凶性が緩和される暗示もあるので、生月によって、吉凶の度合に変化が生じる。これに反して、男性は酉④×は卯と冲するので、動揺が生じやすく、凶性を誘発しやすい。"}], "rep": true}, {"label": "寅⑥・午④×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["✕", "", "○", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "寅⑥・午④×の周期は、補助波動、主波動とも、生年戌と三合火局するので、女性の④×も吉化緩和されやすい暗示がある。だから男性の運気は吉運上昇力は強いが、年との対応では、J④×・J⑤の凶性を誘発する暗示もあるから、吉運上昇でも油断しないように。男女共に④×年は要注意が肝要で、④×の要因を作らなければ、無難な吉運に変換される可能性もある。"}], "rep": true}, {"label": "丑⑤・未⑧", "board": {"t": "pair", "a": [["", "", "", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "", "", ""]], "b": [["", "", "", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "丑⑤・未⑧の周期は、生年⑤数が原点帰りしていると共に、大クロス期の柱を形成するので、変換の前の静かさを示現しやすい時期といえよう。男性は晩冬の季質を受けているだけでなく、C波動の十二支は未の晩夏から、秋、冬え向かっているので、前周期の上昇から横バイ型となって、昇りきれない暗示がある。女性は晩夏の陽性があるので、低迷から上昇気配となる暗示がある。男性は未⑤数年から弱体化が初まり、女性は未年を境として、上昇気配が身近に起こる暗示がある。"}], "rep": true}]}, {"id": 20, "num": "⑥", "numVal": 6, "branch": "寅", "title": "⑥数寅年の読み方", "headingRaw": "【p.179（本文なし）】【p.180（本文なし）】【p.181（本文なし）】【p.182】⑥数寅年の読み方", "page": 182, "cycleText": "生年数⑥……六年周期（補助周期三年）", "male": {"head": "男性の場合（寅年）破壊数は③×・⑦×", "jun": "6寅→7×卯→8辰→9巳→1午→2未→3×申→4酉→5戌→6亥……", "gyaku": "6寅→5丑→4子→3×亥→2戌→1酉→9申→8未→7×午→6巳……"}, "female": {"head": "女性の場合（寅年）破壊数は③×・⑦×", "jun": "6寅→5丑→4子→3×亥→2戌→1酉→9申→8未→7×午→6巳……", "gyaku": "6寅→7×卯→8辰→9巳→1午→ あることはC⑧の潜象理をよく反映しているといえる。"}, {"t": "text", "text": "年月対応からみると、春二月生まれは、外部は秋の季質だが、内奥には春を迎えた、伸びようとする活力が、陽性となってあるのだが、反発力があったとしても力不足で、収縮型の圧力に押されて、内包型の陰性を帯びる暗示がある。"}, {"t": "pair", "a": [["", "", "▲", "", "▲"], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["▲", "", "", "", "▲"]], "caption": "⑥申年2月（⑨寅月）"}, {"t": "text", "text": "この潜象理を数から読めば、伸びようとする春の気質である。寅の場は、D⑨×・【p.200】D③となって、熱気の消滅を暗示し、変換できづらい環境を示している。また、申の場をみると、G③・G⑥×となって、⑥数が象徴する自己の権威性、理想が、初めの活力（③数）が⑥×の凶性によって、活力が鈍る意味をよく象徴しているといえよう。"}, {"t": "text", "text": "晩夏の季質をもつ未⑤数月は、夏季の熱気を象徴する⑨は健全であっても、年月対応で読めば、E①・E⑨となって、熱気の陰りが暗示されると共に、変革を意味するD場では、D⑨×・D⑧×となっているのだが、生月のA⑤は自己の実力を過信すると、自我観から、自己中心的であろうとする心が、外部環境の変化によって、中途挫折させざるをえない暗示が、B⑦×・B⑥によって、よく写し出されているようだ。たとえ、中途挫折しないまでも、空転して、性能が無力化する暗示もある。"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["▲", "", "", "", "✕"]], "b": [["", "", "", "○", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["▲", "✕", "", "", "▲"]], "caption": "⑥申年7月（⑤未月）"}, {"t": "text", "text": "冬季の十二月子①数月は、A⑥・A①と水局して、完全に陰性化して、陰の極を示している反面、A⑥がF⑥×となって、F②・F⑥の内在した潜象理は、養子数としての、⑪数の理を胎生し、新しい内力に変質する理を、よく象徴しているようだ。"}, {"t": "pair", "a": [["", "", "▲", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "▲", "", "✕"]], "b": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["▲", "", "✕○", "", "▲"]], "caption": "⑥申年12月（①子月）"}], "step2Head": "〔手順２〕波動の流れを把握するためには、主周期の波動で掴み、十二支、クロス期、冲作用をよく注意すると共に、補佐的に補助周期を参考にする。", "step2Intro": [], "cycles": [{"label": "申⑥・申⑥", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "【p.201】申⑥・申⑥の周期は、無難な周期とみえるけれども、C波動の十二支は秋から冬へと向かっているので、陰性が強まる暗示があるから、男女共に、弱含み低迷、横バイ型となる暗示がある。だから、⑨数月生まれの人、または⑨×を生月にもつ人は、凶性を誘発するので、渋滞横バイ型の暗示となる。だから⑦×年・⑨×年は特に要注意である。油断すると凶運年になる暗示がある。"}, {"t": "pair", "a": [["", "", "▲", "", "▲"], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["▲", "", "", "", "▲"]], "caption": "⑥申年2月（⑨寅月）"}, {"t": "pair", "a": [["▲", "", "▲", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "✕", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["▲", "", "", "○", "▲"]], "caption": "⑥申年11月（⑨亥月）"}], "rep": true}, {"label": "酉⑦×・未⑤", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["✕", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "b": [["", "", "", "○", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "酉⑦×・未⑤の周期は、男性は⑦×期であるから、弱含み下降となりやすい周期である。だが②数月生まれは、凶性を緩和吉化するので、弱含み吉運に変換される暗示もある。だが酉⑦数月、生月に⑦×をもつ人は、凶性を誘引するので、要注意の周期といえる。"}, {"t": "pair", "a": [["", "", "", "", "▲"], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "○", "", "", "▲"]], "caption": "⑥申年1月（②丑月）"}, {"t": "pair", "a": [["", "", "", "", "▲"], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕▲"]], "b": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["▲", "", "", "", "▲"]], "caption": "⑥申年4月（②辰月）"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["▲", "4", "6", "8", "▲"], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["✕", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["▲", "", "", "", "▲"]], "caption": "⑥申年9月（⑦酉月）"}, {"t": "text", "text": "女性は吉運期で、少女期の弱含み上昇といえよう。ただし、⑤×を生月にもつか、年月対応で準破壊数となる人は、弱含み横バイ型となる暗示がある。だから⑦×年は要注意。"}], "rep": true}, {"label": "戌⑧・午④", "board": {"t": "pair", "a": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["✕", "", "○", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "戌⑧・午④の周期は、十二支が火局軌道を形成しているので、活力が出ると共に、運気も上昇となるが、C波動の十二支が秋から冬へ向かっているので、陰陽のバランスがとれて、吉運上昇型となる暗示がある。ただし、男性は生月に⑧×、女性は④×が【p.202】あると、凶性を誘引しやすいが、合局性によって緩和されるから、弱含み横バイ型で、やや上向きかげんで推移する暗示もある。その意味では、少年・少女期の吉運上昇型の周期といえよう。"}], "rep": true}, {"label": "亥⑨×・巳③", "board": {"t": "pair", "a": [["", "✕", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", ""]], "b": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "caption": ""}, "items": [{"t": "text", "text": "亥⑨×・巳③の周期は、十二支の亥は冬型であり、かつ⑨×となる男性は、青年期に迎える下降運といえる。だがC波動の十二支が春から夏となっているので、陰陽の調和がとれているので、弱含み下降気味となる暗示がある。だが、生月に⑨×がある人は、凶性が強まるので、下降期となる。"}, {"t": "text", "text": "女性は吉運上昇型の周期であるが、D⑨×・D⑥となるので、上昇力は多少鈍る暗示がある。また男性は⑨×期だから、特に⑦×と⑨×年を注意する必要がある。女性は⑦×年は反発数となるので、緩和吉化されるが、⑨×年は多少、凶性の影響を受ける暗示があるから、注意すべきである。"}], "rep": true}, {"label": "子①・辰②", "board": {"t": "pair", "a": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]], "b": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "子①・辰②の周期は、十二支が三合水局するので、吉運にみえて、男性は低迷横バイ型となりやすい暗示がある。しかもC波動の十二支も秋から冬へ向かっているので、陰性化が強く、収縮傾向にあるので、物事が渋滞しやすい暗示がある。特に①数が凶性を帯びる人は、弱運下降気味に推移しやすい。だから子⑦×年は要注意。これに反【p.203】して、女性は吉運上昇型となる暗示がある。従って、⑦×年は火局吉化するので、凶性は無力化される。"}], "rep": true}, {"label": "丑②・卯①", "board": {"t": "pair", "a": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "丑②・卯①の周期は、男性は弱含み横バイ型で、やや上向く傾向がある。女性は弱含み吉運型の暗示がある。この周期はクロス期だから、環境の変化、物事の反転が生じやすい暗示もある。"}], "rep": true}, {"label": "寅③・寅⑨×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "寅③・寅⑨×の周期は、生年の申と冲となる周期だから、吉凶に関わらず、環境の変化、思考の変転、物事の行詰りが生じやすい時間帯といえる。"}, {"t": "text", "text": "男性は吉運ではあるが、動揺が生じやすく、不安定であるから、⑦×年、⑨×年は要注意。女性は凶性を誘発しやすい下降運となるので、破壊年は特に要注意。"}], "rep": true}, {"label": "卯④・丑⑧", "board": {"t": "pair", "a": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["○", "2", "4", "6", "✕"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "b": [["", "", "", "✕", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "卯④・丑⑧の周期は、男女共に吉運ではあるが、男性は春の季質を受け、生年の秋の季質と反発するから、運気的には活力は出てくるが、前周期の生年申と寅との冲によって、潜勢力が大きく反転しているのを受けた周期なので、動揺が生じやすい暗示がある。この潜象理を投影しているのが、卯④によって、生年⑥数がC場において、C⑥×となり、生年のC⑧と対応している点から判断しても、弱含み横バイ型に変換する暗示がある。だが五月③巳に生まれた人は、④数に凶性を帯びているので、下降気【p.204】味の低迷型となりやすい可能性がある。"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["▲", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕▲"]], "b": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["▲", "", "", "✕", "▲"]], "caption": "⑥申年5月（③巳月）"}, {"t": "text", "text": "女性は吉運であるが、地数月に生まれた人で、⑧×となっている人、また、九月⑦酉に生まれた人は、⑧数が準破壊となるので、弱運低迷型となりやすい可能性がある。だが、一般的に女性の場合は、晩冬の季質を受けているので、吉運だといっても弱運である。男女共に⑦×年を注意。特に男性の五月③巳生まれの人は、凶性を誘引しやすい暗示があるので要注意。"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["▲", "4", "6", "8", "▲"], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["✕", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["▲", "", "", "", "▲"]], "caption": "⑥申年9月（⑦酉月）"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["▲", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕▲"]], "b": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["▲", "", "", "✕", "▲"]], "caption": "⑥申年5月（③巳月）"}], "rep": true}, {"label": "辰⑤・子⑦×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰⑤・子⑦×の周期は、十二支が三合水局しているので、女性の子⑦×は緩和吉化される暗示がある。だから、周期初めの申⑨×年も水局するので、緩和吉化される暗示がある。だが、破壊数は消滅するというのではないから、凶性を誘引するような要因を作らないよう心掛ける必要がある。また②数月生まれは緩和吉化される度合が弱いので、吉運上昇気配が低迷の中から湧出する時期でもある。"}, {"t": "pair", "a": [["", "", "", "", "▲"], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "○", "", "", "▲"]], "caption": "⑥申年1月（②丑月）"}, {"t": "pair", "a": [["", "", "", "", "▲"], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕▲"]], "b": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕" ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "卯①・未②の周期は、十二支が木局化するので吉運といえるが、男性は波動①数によってF⑥×となるから、上昇運につながらず、低迷型となる可能性がある。だが、女性は晩夏の季質を帯びるので、陽性化が強まり、上昇運となる暗示がある。だから、丑⑤×年は未・丑が冲となって、反転吉化する暗示がある。また卯⑦×年は②・⑦火局吉化される暗示がある。だが、男性は凶性を誘発しやすいので要注意。"}], "rep": true}, {"label": "辰②・午①", "board": {"t": "pair", "a": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]], "b": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰②・午①の周期は、前の周期の波動数がクロスして捩れ現象を呈する暗示がある周期だから、男性もようやく吉運上昇型になる時期といえよう。だが十二支が辰なので、辰には水局となる陰性を含んでいるから、上昇型といっても、弱含みといえよう。女性は夏の季質が強いので、吉運上昇型ではあるが、波動①数によって、水局吉化と、陰陽分離を意味する気質が作用するから、吉運の中に凶性を誘引する暗示がある。【p.211】C波動の戌⑤×年は、凶性は、男女共に緩和される暗示がある。"}], "rep": true}, {"label": "巳③・巳⑨", "board": {"t": "pair", "a": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "b": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "caption": ""}, "items": [{"t": "text", "text": "巳③・巳⑨の周期は、十二支が生年亥と冲となるので、運気が大きく変換される暗示があるから、今まで吉運期であっても、低迷型を呈していた運気も、冲によって刺激が入り、ようやく動的な活力が運気の上に投影されてくる暗示がある。その意味では男女ともに吉運ではあるが、男性は基礎固めが完了して、上昇準備がととのう暗示が強く、女性は環境変化を含んだ上昇型の暗示がある。⑦×年は要注意。"}], "rep": true}, {"label": "午④・辰⑧", "board": {"t": "pair", "a": [["✕", "", "○", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "午④・辰⑧の周期は、男女共に吉運上昇型の時間帯である。特に男性の上昇力の方が、女性より強く作用する暗示がある。だが生月で④×となる男性は、吉運ではあるが、低迷型の意味を含んでいるので、弱含み上昇型といえよう。また女性で⑧×を生月にもつ人は、吉運ではあっても、動揺を秘めた運気だから、反転しやすい暗示もある。男女共に、未⑤×年は凶性が緩和される暗示があるが、酉⑦×年は凶性を誘発しやすい暗示があるので要注意。"}], "rep": true}, {"label": "未⑤×・卯⑦×", "board": {"t": "pair", "a": [["", "", "", "○", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "✕", "", "", ""]], "b": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "未⑤×・卯⑦×の周期は、男女共に破壊期であるが、十二支が三合木局しているので、凶変じて吉に成る暗示が強い時間帯といえよう。"}, {"t": "text", "text": "特に注意して考えなければならないのは、波動数が⑤×・⑦×となっているので、【p.212】原点のJ⑤×・B⑦×を誘発する因子を、吉運変化の中で胎生しやすいので、空洞化が生じやすいという暗示もあるので注意すべきである。別言すれば、この吉凶の乖離作用はどこに潜んでいるかといえば、生年のA⑥が、男性はA⑥・A⑤となって、B⑥・B⑦×との対応理が内在すると共に、未⑤×ということは、未の場であるG場にG⑤となる理によって、A場は⑧数が機能する。この二つの理が同時に作用するところに、吉凶の乖離作用が生じる原因がある。"}, {"t": "text", "text": "女性は年と波動との対応で、J⑤×・J⑥。B⑦×・B⑧。H④・H⑦。A⑥・A⑨となる理によって、数の象徴する意味が、運命上に具現されるから、そこに空洞化による吉凶の乖離が生じる暗示がある。だから辰⑤×年は、原点にあるJ⑤×を誘引する暗示があるから要注意年となる。"}], "rep": true}, {"label": "申⑥・寅⑥", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "", "", ""], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["", "", "", "", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "申⑥・寅⑥の周期は、十二支が冲となり、波動⑥数は原点帰りしているので、X形象を形成するから、原点のJ⑤×を誘引する暗示があるが、運気は吉運の気配が作用するので、吉運横バイ型となる暗示があり、その吉運の中で、動揺が生じやすい暗示がある。その意味では、午⑦×年は、女性は吉化する暗示があるが、男性は凶性を誘引しやすく、動揺しやすい暗示がある。"}], "rep": true}]}, {"id": 24, "num": "⑦", "numVal": 7, "branch": "子", "title": "⑦数子年の読み方", "headingRaw": "【p.213（本文なし）】【p.214（本文なし）】【p.215（本文なし）】【p.216】⑦数子年の読み方", "page": 216, "cycleText": "生年数⑦……七年周期（補助周期なし）", "male": {"head": "男性の場合（子年）破壊数は②×・⑨×", "jun": "7子→8丑→9×寅→1卯→2×辰→3巳→4午→5未→6申→7酉……", "gyaku": "7子→6亥→5戌→4酉→3申→2×未→1午→9×巳→8辰→7卯……"}, "female": {"head": "女性の場合（子年）破壊数は②×・⑨×", "jun": "7子→6亥→5戌→4酉→3申→2×未→1午→9×巳→8辰→7卯……", "gyaku": "7子→8丑→9×寅→1卯→2×辰→3巳→4午→5未→6申→7酉……"}, "note": "（月の盤の▲は、生年の盤の破壊の場に重なる所）", "yearBoard": [["", "", "✕", "", ""], ["", "6", "2", "4", ""],
