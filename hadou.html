<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波動論 数理盤</title>
<style>
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#10171f);
  --paper:light-dark(#f4f6f9,#17212c);
  --ink:light-dark(#1b2430,#e6ebf1);
  --muted:light-dark(#5b6675,#9aa7b6);
  --ai:light-dark(#1d3557,#9fc0e6);
  --ai-soft:light-dark(#e6edf6,#1f3047);
  --line:light-dark(#c9d3df,#2d3b4c);
  --shu:light-dark(#c0392b,#ef7a6b);
  --shu-soft:light-dark(#fbecea,#3a2320);
  --mark:light-dark(#ffe9a8,#5a4a12);
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.95 "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;overflow-x:clip}
.band{padding:clamp(20px,3.5vw,44px) max(4vw,14px)}
.wrap{max-width:1100px;margin:0 auto}
header h1{font-size:clamp(26px,4vw,40px);line-height:1.15;margin:0;font-weight:700;color:var(--ai)}
header p{margin:.4em 0 0;color:var(--muted);font-size:15px}
h2.sec{font-size:21px;color:var(--ai);margin:1.6em 0 .5em;border-bottom:2px solid var(--ai-soft);padding-bottom:.2em}
h3.sub{font-size:18px;color:var(--ai);margin:1.3em 0 .4em}
.picklabel{font-size:14px;color:var(--muted);margin:18px 0 6px}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.pk{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;cursor:pointer;color:var(--ink);font:inherit;font-size:18px;min-height:44px}
.pk small{display:block;font-size:12px;color:var(--muted)}
.pk[aria-pressed=true]{border-color:var(--ai);background:var(--ai-soft);box-shadow:0 0 0 1px var(--ai) inset;color:var(--ai);font-weight:700}
.pk:focus-visible,summary:focus-visible,.fstep:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.sexp{display:flex;gap:8px}
.chapterhead{background:var(--paper);border-radius:16px;padding:18px 20px;margin-top:22px}
.chapterhead h2{margin:0;font-size:24px;color:var(--ai)}
.chapterhead .pg{color:var(--muted);font-size:14px}
.cyc{font-size:16px;margin-top:.3em}
.destroy{color:var(--shu);font-weight:700}
.flowbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.flowbox .fl{font-size:14px;color:var(--muted)}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0}
.fstep{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:2px 9px;cursor:pointer;font:inherit;font-size:16px;color:var(--ink)}
.fstep:hover{border-color:var(--ai)}
.fstep.x{color:var(--shu)}
.farr{color:var(--muted);font-size:13px}
details.other{margin:8px 0}
details.other summary{cursor:pointer;color:var(--muted);font-size:15px}
.board{display:grid;grid-template-columns:.62fr 1fr 1fr 1fr .62fr;grid-template-rows:.62fr 1fr 1fr 1fr .62fr;aspect-ratio:1;gap:0;border:1.5px solid var(--ai);background:var(--bg)}
.board span{display:flex;align-items:center;justify-content:center;border:.5px solid var(--line);font-size:clamp(13px,2.2vw,19px);line-height:1.1}
.board span.mk{color:var(--ai);font-weight:700}
.board span.bad{color:var(--shu);font-weight:700}
.board span.tri{background:var(--shu-soft);color:var(--shu);font-weight:700}
.board span.ctr{font-weight:700;color:var(--ai);background:var(--ai-soft)}
.board.small span{font-size:clamp(10px,1.6vw,14px)}
.yearwrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;margin:12px 0}
.yearwrap .board{width:min(340px,86vw)}
.months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:12px 0}
@media(max-width:760px){.months{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mbox{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);cursor:pointer;text-align:left;font:inherit;color:var(--ink);width:100%}
.mbox .mlab{font-size:15px;margin-bottom:6px;color:var(--ai)}
.mbox[aria-pressed=true]{border-color:var(--shu);box-shadow:0 0 0 1.5px var(--shu) inset;background:var(--shu-soft)}
.mbox[aria-pressed=true] .mlab{color:var(--shu);font-weight:700}
.pair{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
.pair .pb{flex:0 1 250px}
.pair .pb .board{width:100%}
.pair .cap{font-size:14px;color:var(--muted);text-align:center;margin-top:4px}
.pair.hl .pb .board{border-color:var(--shu);box-shadow:0 0 0 1.5px var(--shu)}
.txt{margin:.7em 0;text-align:justify}
.txt mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px;font-weight:700}
details.cyc{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--bg)}
details.cyc summary{cursor:pointer;padding:10px 16px;font-size:18px;color:var(--ai);font-weight:700;list-style:none}
details.cyc summary::-webkit-details-marker{display:none}
details.cyc summary::before{content:"▸ ";color:var(--shu)}
details.cyc[open ] summary::before{content:"▾ "}
details.cyc .cin{padding:0 16px 12px}
.cycbtn{display:block;width:100%;text-align:left}
.bikou{background:var(--paper);border-radius:12px;padding:12px 16px;font-size:14.5px;color:var(--muted);margin:14px 0}
.note{font-size:14.5px;color:var(--muted)}
.empty{color:var(--muted);margin:26px 0}
footer{color:var(--muted);font-size:13px;margin-top:40px}
</style>
</head>
<body>
<div class="band"><div class="wrap">
<header>
<h1>波動論 数理盤</h1>
<p>『数霊波動論奥義（上）』を、生年の章ごとに読んでいくための学習アプリです。生年と性別を選ぶと、その章の数理盤と原文が開きます。</p>
</header>

<div class="picklabel">生年数</div>
<div class="picker" id="numPick"></div>
<div class="picklabel">生年の十二支</div>
<div class="picker" id="brPick"></div>
<div class="picklabel">性別</div>
<div class="sexp" id="sexPick">
  <button class="pk" data-sex="male" aria-pressed="true">男性</button>
  <button class="pk" data-sex="female" aria-pressed="false">女性</button>
</div>

<div id="chapter"></div>

<footer>原文は校正版『数霊波動論奥義（上）』の表記そのままです。数理盤の▲は「月の盤の▲は、生年の盤の破壊の場に重なる所」という本書の約束事によります。</footer>
</div></div>

<script>
const DATA = [{"id": 0, "num": "①", "numVal": 1, "branch": "子", "title": "①数子年の読み方", "headingRaw": "【p.10】①数子年の読み方", "page": 10, "cycleText": "生年数①……五年周期（補助周期十年）", "male": {"head": "男性の場合（子年）破壊数は⑤×・⑥×", "jun": "1子→2丑→3寅→4卯→5×辰→6×巳→7午→8未→9申→1酉……", "gyaku": "1子→9亥→8戌→7酉→6×申→5×未→4午→3巳→2辰→1卯……"}, "female": {"head": "女性の場合（子年）破壊数は⑤×・⑥×", "jun": "1子→9亥→8戌→7酉→6×申→5×未→4午→3巳→2辰→1卯……", "gyaku": "1子→2丑→3寅→4卯→5×辰→6×巳→7午→8未→9申→1酉……"}, "note": "（月の盤の▲は、生年の盤の破壊の場に重なる所）", "yearBoard": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]], "months": [{"label": "2月　③寅", "month": 2, "num": "③", "branch": "寅", "board": [["", "", "▲", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "▲", "", ""]]}, {"label": "3月　④卯", "month": 3, "num": "④", "branch": "卯", "board": [["✕", "", "▲", "", ""], ["", "3", "8", "1", ""], ["○", "2", "4", "6", "✕"], ["", "7", "9", "5", ""], ["", "", "▲", "", ""]]}, {"label": "4月　⑤辰", "month": 4, "num": "⑤", "branch": "辰", "board": [["", "", "▲", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "▲", "", ""]]}, {"label": "5月　⑥巳", "month": 5, "num": "⑥", "branch": "巳", "board": [["", "○", "▲", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "▲", "✕", "✕"]]}, {"label": "6月　⑦午", "month": 6, "num": "⑦", "branch": "午", "board": [["", "", "○▲", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "✕▲", "", ""]]}, {"label": "7月　⑧未", "month": 7, "num": "⑧", "branch": "未", "board": [["", "", "▲", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "▲", "", ""]]}, {"label": "8月　⑨申", "month": 8, "num": "⑨", "branch": "申", "board": [["", "", "✕▲", "", ""], ["", "8", "4", "6", "○"], ["", "7", "9", "2", ""], ["✕", "3", "5", "1", ""], ["", "", "▲", "", ""]]}, {"label": "9月　①酉", "month": 9, "num": "①", "branch": "酉", "board": [["", "", "▲", "", ""], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕▲", "", ""]]}, {"label": "10月　②戌", "month": 10, "num": "②", "branch": "戌", "board": [["", "", "▲", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "▲", "", ""]]}, {"label": "11月　③亥", "month": 11, "num": "③", "branch": "亥", "board": [["", "✕", "▲", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "▲", "○", ""]]}, {"label": "12月　④子", "month": 12, "num": "④", "branch": "子", "board": [["✕", "", "✕▲", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "○▲", "", ""]]}, {"label": "1月　⑤丑", "month": 1, "num": "⑤", "branch": "丑", "board": [["", "", "▲", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "▲", "", ""]]}], "step1Head": "〔手順１〕座標となる生年月の対応数理と、十二支との関係を読む。", "step1": [{"t": "text", "text": "まず最初に考えなければならない点は、「子」は冬の季質と、水の性をもっている点であり、①数にもこの質と性を、基本として内包していることを、しっかり把握する必要がある。だから、水の質とすれば、高い所から低い所へ流れる質と、熱せられ【p.11】ると蒸気となって上昇する質を、①数が潜象理としてもっている点である。また、冬の季質がある点からみれば、冷たい。寒い。凍る。氷の意味を連想するように、①数子の意味にも、これに類した潜象理が、基層に内在していることを、――また、夜の意味を潜象理として内包している点から類推すれば、不安。覗く。隠れる。見えない。淋しい。孤独。隠す。考える。物静かな。創意という意味も内包していることを、理解する必要がある。また違った意味では包み込む、善悪を飲み込む包合性の意味を、陰きわまって陽を生むという、物事の始めという意味をも内包しているといえる。だから、無から有を生む創造、独創という意味もあることを忘れてはならない。"}, {"t": "text", "text": "以上の基本的意味をふまえたうえで、生年の数理と、生月の数理と十二支を対応させて、①数の意味が陰性を帯びているか、陽性を帯びているか、破壊性を帯びている数質であるかを、最初に把握すべきである。"}, {"t": "text", "text": "例をあげて説明すれば、二月寅と十一月亥は、同じA③でH①×であるが、寅月は初春の季質があり、亥月は初冬の季質があるので、H①×となっても、寅月は陽性の意味を、亥月は陰性の意味をもつので、A①・A③の同数であっても、命質に大きな差がある。だからF⑥×・F⑧。H⑧・H①×の意味においても、H場の行動、⑧数【p.12】の変革・乗り替わり時における心理に、陽性と陰性の振り分けが無意識に作動する理が分かる。だからこの季質をふまえて数質を吟味すれば、波動数の意味を読む場合でも、年月対応数理に照合すれば、隠れた命質を読み取ることが可能である。"}, {"t": "pair", "a": [["", "", "✕", "", "▲"], ["", "9", "5", "7", ""], ["▲", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", " ": "例をあげて説明すれば、二月寅と十一月亥は、A③は破壊数であると共に、生月で生年①を破壊しているので、命質の季質は弱い。特に亥月は冬の季質があるから、陰性を帯びやすく、内向型となりやすい暗示がある。また二月寅では、年月対応でH場【p.20】にH⑧・H①×。F場にF⑥×・F⑧があり、C場にC③×・C⑤が対応しているので、物事の乗り替わり、切り替え時に凶性となりやすく、言葉が調和を破りやすい暗示となりやすい。"}, {"t": "pair", "a": [["", "", "", "", "▲"], ["", "9", "5", "7", ""], ["○▲", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", "▲"], ["○", "6", "8", "4", ""], ["", "", "▲", "", ""]], "caption": "①卯年2月（③寅月）"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["", "9", "5", "7", ""], ["○▲", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "✕", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", "▲"], ["", "6", "8", "4", ""], ["", "", "▲", "○", ""]], "caption": "①卯年11月（③亥月）"}, {"t": "text", "text": "これに反して、三月〜六月までは陽性が強い暗示があるが、五月生まれは吉凶が変転しやすい。九月生まれは年月冲となるので、物事、考え、行動が反転しやすい気質を帯びる傾向がある。また冬季生まれは、陰性を帯びやすい気質がある。"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕▲"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["○", "2", "4", "6", "✕▲"], ["", "7", "9", "5", ""], ["", "", "▲", "", ""]], "caption": "①卯年3月（④卯月）"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕▲"], ["", "4", "6", "2", ""], ["", "", "✕▲", "", ""]], "b": [["", "", "○", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕▲"], ["", "1", "3", "8", ""], ["", "", "✕▲", "", ""]], "caption": "①卯年6月（⑦午月）"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", "▲"]], "b": [["", "○", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", "▲"], ["", "9", "2", "7", ""], ["", "", "▲", "✕", "✕"]], "caption": "①卯年5月（⑥巳月）"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○▲", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕▲", "", ""]], "", "", "▲", "", ""]], "caption": "①卯年2月（③寅月）"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["", "9", "5", "7", ""], ["○▲", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "✕", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", "▲"], ["", "6", "8", "4", ""], ["", "", "▲", "○", ""]], "caption": "①卯年11月（③亥月）"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○▲", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕▲", "", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○▲"], ["", "4", "6", "2", ""], ["", "", "✕▲", "", ""]], "caption": "①卯年9月（①酉月）"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["▲", "", "✕", "", ""]], "b": [["", "", "", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", ""], ["✕", "✕", "▲", "", ""]], "caption": "①卯年7月（⑧未月）"}, {"t": "pair", "a": [["▲", "", "", "", "▲"], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", "▲"], ["", "5", "7", "3", "○"], ["", "", "▲", "", ""]], "caption": "①卯年10月（②戌月）"}], "rep": true}, {"label": "巳③×・丑⑧", "board": {"t": "pair", "a": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "b": [["", "", "", "✕", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "巳③×・丑⑧ の周期は、巳③×は破壊期であると共に、生年①が破壊される時期なので、凶性が出やすい。特に家族関係に生じやすい暗示の周期であるといえる。だがその反面、丑⑧とは③・⑧木局となり、十二支は巳・丑の金局作用を呼ぶ気質があるので、少年・少女期の変化期となりやすい周期といえよう。特に波動③×の人は凶運が出やすく、寅③×の年が凶相が強く作用する暗示があり、木局・金局作用は、この周期で吉化にはあまり力とならない。"}], "rep": true}, {"label": "午④・子⑦", "board": {"t": "pair", "a": [["✕", "", "○", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "b": [["", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "午④・子⑦ の周期は、支そのものが冲となり、卯・午・子の十字形象を形成しやすいので、命運の流れは西のC場に流入しやすい暗示がある。そこには生年の原点にC③×があるので、間接的にその凶性を受けやすい暗示がある。特に波動⑦子の人は、【p.22】⑦午年には冲作用で、命数が反転しやすい。またC波動①酉の年は命運に反転が生じやすい暗示があるが、①卯年生まれの人にとっては、波動数は吉数なので吉運になりやすい。ただし、波動⑦子の人は吉運ではあっても、吉性は弱運である。"}], "rep": true}, {"label": "未⑤・亥⑥×", "board": {"t": "pair", "a": [["", "", "", "○", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "✕", "", "", ""]], "b": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "未⑤・亥⑥× の周期は、十二支が三合木局するので、破壊数は吉化する暗示がある。だが、C波動の十二支が秋から冬にかけての支だから、吉化されたとしても、力は弱いようだ。特に亥⑥×は木局するけれども、冬の季質なので合局しても弱運である。だが⑤未の場合は生年のF⑥×が水局吉化し、夏の季質があるので、吉運は強化される暗示がある。ただし、C波動の③×・⑥×の年は吉性は低下する。"}], "rep": true}, {"label": "申⑥×・戌⑤", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "申⑥×・戌⑤ の周期は、支が秋の季質なので、生年①と水局・土局するとしても吉化にはつながらないで、運気が横バイ的で渋滞気味になりやすい暗示がある。たとえC波動の十二支が春から夏の陽性であったとしても、その陽性に結びつかないで、底固めとなる運気といえよう。"}], "rep": true}, {"label": "酉⑦・酉④", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["✕", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "b": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "酉⑦・酉④ の周期は、生年①卯とは冲となるので、今までの渋滞気味の運気が、冲作用によって、活気づけられる、上昇準備期間といえよう。だから波動数は吉数であっても、C波動の十二支が秋から冬の季質となるので、低運期から底上げしたところで、【p.23】上昇のための底固めといえよう。"}], "rep": true}, {"label": "戌⑧・申③×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "戌⑧・申③× の周期は、波動数は木局吉化するが、十二支が秋季の質をもっているので、吉化は弱い。たとえC波動の十二支が春の季質であっても、上昇に結びつかないので、小さなうねりは生じても、少し頭をもたげた程度の吉運は生じる。だが波動申③×の場合は破壊期だが、若干、凶性が緩和する暗示はある。特に巳③×年は要注意年である。"}], "rep": true}, {"label": "亥⑨・未②", "board": {"t": "pair", "a": [["", "✕", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", ""]], "b": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "亥⑨・未② の周期はいよいよ上昇波の到来である。だから、たとえ申⑥×がC波動で回座したとしても、上潮の中の部分的な下潮だから、上昇の横バイ年となって、大きな凶性は無くなる。むしろ、上昇への助走力となる可能性がある。特に力が出るのは、波動②未の人である。亥⑨の波動は木局したとしても、冬の季質だから運気伸張には結びつかないが、⑨数期なので周期の前半は吉運ではありうるが、申⑥×年からは渋滞感が漂う暗示がある。"}], "rep": true}, {"label": "子①・午①", "board": {"t": "pair", "a": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]], "b": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "子①・午① の周期は波動そのものの十二支が冲となるだけでなく、生年卯との関わりで十字形象となって、空位となっている西のC場に流入する暗示があるので、原点にあるC③×の作用が、この周期から、C波動との吸引作用で、表出されやすい環境【p.24】となる暗示がある。特に波動①子の人は、以後注意しなければならない。周期内では、寅③×の年以降は凶相が表出されやすくなるので、注意を要す。"}], "rep": true}, {"label": "丑②・巳⑨", "board": {"t": "pair", "a": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]], "b": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "caption": ""}, "items": [{"t": "text", "text": "丑②・巳⑨ の周期は、十二支は金局するけれども、生年①卯の木性の気質を阻害するから、表面は吉運に感じられても、裏面は凶相が作用し、運気が二分されやすい暗示がある。だからC波動が巳⑥×の年は、要注意年となる。"}, {"t": "text", "text": "波動数②丑の人は生年①がJ⑨・J①と重なるので、表面的には吉運があっても、裏面では陰性が作用して、吉運であっても、不安定要因がみられるので、巳⑥×の年、未⑧の年は凶性が作動しやすい、運命環境といえよう。これに反して、波動が巳⑨の人は、吉運の作用は強いので、破壊年だけを注意すればよいだろう。"}], "rep": true}, {"label": "寅③×・辰⑧", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "寅③×・辰⑧ の周期は、波動数は③――⑧木局で、十二支も春季の季質が強いので、破壊性は吉化されるのだが、潜在に空洞化が生じ、生年①数が破壊性を帯びて、表裏に乖離作用が亥③×年から発動するのだが、その凶性を見落としがちである。というのは、表面は吉運を呈するからである。これに反して、辰⑧の波動期の人は、凶性は弱いが、酉①の年は要注意である。"}], "rep": true}]}, {"id": 2, "num": "①", "numVal": 1, "branch": "午", "title": "①数午（うま）年の読み方", "headingRaw": "【p.25（本文なし）】【p.26】①数午（うま）年の読み方", "page": 26, "cycleText": "生年数①……五年周期（補助周期十年）", "male": {"head": "男性の場合（午年）破壊数は⑥×", "jun": "1午→2未→3申→4酉→5戌→6×亥→7子→8丑→9寅→1卯……", "gyaku": "1午→9巳→8辰→7卯→6×寅→5丑→4子→3亥→2戌→1酉……"}, "female": {"head": "女性の場合（午年）破壊数は⑥×", "jun": "1午→9巳→8辰→7卯→6×寅→5丑→4子→3亥→2戌→1酉……", "gyaku": "1午→2未→3申→4酉→5戌→6×亥→7子→8丑→9寅→1卯……"}, "note": "（月の盤の▲は、生年の盤の破壊の場に重なる所）", "yearBoard": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "months": [{"label": "2月　③寅", "month": 2, "num": "③", "branch": "寅", "board": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "▲", "", ""]]}, {"label": "3月　④卯", "month": 3, "num": "④", "branch": "卯", "board": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["○", "2", "4", "6", "✕"], ["", "7", "9", "5", ""], ["", "", "▲", "", ""]]}, {"label": "4月　⑤辰", "month": 4, "num": "⑤", "branch": "辰", "board": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", text", "text": "夏の季質は光熱が象徴するように、万物は光によって輝き、そこに美を競うだけでなく、光によって物の存在が照らし出される。だから照らし出されることは、「知る」であり、「知」を象徴し、名声。人気。名誉。高尚。美的感覚。光輝の気質が醸成される。また草木が繁茂する象意からみれば、発展。栄転。高級。装飾という気質もまた生じる暗示が強い。だが陽変じて陰を生ずの喩（たとえ）のように、また熱射病となるように、凶性を自ら引き起こす暗示があることも、注意しなければならない。自省心を忘れた場合は、今までの成果を灰燼に帰すこともありうる暗示もある。"}, {"t": "text", "text": "以上の基本的意味をふまえたうえで、生年の数理と、生月の数理と十二支を対応させて、①数が内包する陽性度と陰性度、及び破壊数との兼ね合いを、波動を数読みする前に、よく把握しておく必要がある。それともう一つ知っておくべき点は、午年の①数だから、火性と水性が一体化してある特徴があるので、水火合一の理によって、良質の命理が機能する暗示がある点も、記憶しておくべきである。この理が顕著に形成されるのが、四月⑤数月、五月⑥数月生まれの人である。だがその反面、⑤数月生まれはF⑥×・B⑥×となるので、F場の⑥×・①とが水局化しづらい難点があり、⑥数【p.28】月生まれはA場は水局吉化するけれども、②数がF場・B場で破壊数と対応して、準破壊数となるので、堂々巡りしやすく、中心が定まりづらい難点がある。"}, {"t": "pair", "a": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", "▲"]], "b": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "▲", "", ""]], "caption": "①午年4月（⑤辰月）"}, {"t": "pair", "a": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", "▲"]], "b": [["", "○", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "▲", "✕", "✕"]], "caption": "①午年5月（⑥巳月）"}, {"t": "pair", "a": [["", "", "○", "", "▲"], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "▲", "", ""]], "caption": "①午年1月（⑤丑月）"}, {"t": "text", "text": "また三月生まれ④卯と、十二月④子生まれの場合は、⑨数が共に準破壊となっているけれども、三月は春の季質があるので、凶性は子月の人より軽い。年月数理の破壊性が緩和吉化する度合が強いのが、一月生まれであるが、A場が土局するので、明快さに欠け、重苦しさ、渋滞気味が身辺に作用しやすい暗示がある。"}, {"t": "pair", "a": [["▲", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", "▲"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["○", "2", "4", "6", "✕"], ["", "7", "9", "5", ""], ["", "", "▲", "", ""]], "caption": "①午年3月（④卯月）"}, {"t": "pair", "a": [["▲", "", "○▲", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["✕", "", "✕", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "○▲", "", ""]], "caption": "①午年12月（④子月）"}, {"t": "pair", "a": [["", "", "○", "", "▲"], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "▲", "", ""]], "caption": "①午年1月（⑤丑月）"}], "step2Head": "〔手順２〕波動の流れを把握するためには、波動数と十二支、クロス期を注視。", "step2Intro": [], "cycles": [{"label": "午①・午①", "board": {"t": "pair", "a": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "午①・午① の周期は、夏の水の季質があるので、調和がとれた時間帯だから、安泰期といえる。だが申③の年は、生年①数が破壊数となるので、質的には弱運となる。"}], "rep": true}, {"label": "未②・巳⑨", "board": {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "b": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "caption": ""}, "items": [{"t": "text", "text": "未②・巳⑨ の周期も夏の季質があるので、運気的には強く、安泰期といえる。だが女性の場合は、周期が巳⑨で、波動亥⑥×の年は、破壊年であると共に、十二支は巳――亥の冲となるだけでなく、生年①数が破壊性を帯びるから、要注意の凶運年となる。その他は破壊年ではあっても、弱運程度で推移できる暗示がある。"}], "rep": true}, {"label": "申③△・辰⑧", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "申③△・辰⑧ の周期は、女性は吉運ではある【p.29】が、男性の場合は、生年①が破壊数となる周期であるだけでなく、順逆波動の十二支が、申――辰の水局を形成するから、生年の子の場にある、F⑥×の方向に引っ張られ、破壊性を誘発しやすい時期といえる。その意味では、運気は低下するので、下降運といえる。だが、波動数が③――⑧木局を形成しているので、十二支との兼ね合いからみると、水生木、木生火の環流があるので、下降運といっても力は弱い、弱運といえる潜象理がみられる。だから、周期の終わりに巡る申⑥×年だけを特に注意。他は凶性は弱くとも、破壊年だから周期内では凶性の強い年となる暗示がある。"}], "rep": true}, {"label": "酉④・卯⑦", "board": {"t": "pair", "a": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "酉④・卯⑦ の周期は、周期そのものに十二支の冲作用が内在しているので、物事が反転しやすい運気といえる。また生年午からみますと、十字形象における、子の場にあるF⑥×の破壊性を誘発しやすい周期なので、男性は八月⑨申の人は、凶性を誘発しやすい暗示がある。これに反して女性は春の季質があるから、運気は上昇気味であるが、C波動の酉⑦・戌⑧の年は凶性を呼びやすく、弱運となる暗示がある。"}, {"t": "pair", "a": [["", "", "○▲", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["▲", "", "✕", "", ""]], "b": [["", "", "✕", "", ""], ["", "8", "4", "6", "○"], ["", "7", "9", "2", ""], ["✕", "3", "5", "1", ""], ["", "", "▲", "", ""]], "caption": "①午年8月（⑨申月）"}], "rep": true}, {"label": "戌⑤・寅⑥×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["", "", "", "", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "戌⑤・寅⑥× の周期の特徴は、生年午との兼ね合いで、十二支が火局することである。従ってF⑥×は吉化される暗示がある。戌⑤の人は生年のF⑥×と①数が重なって水局し、A場は①・⑤土局。また午の場にあるE⑤は、波動によってE⑤・E⑨と【p.30】なって、⑤数の機能が強められる。"}, {"t": "text", "text": "これに対して寅⑥×の人は、破壊期ではあっても、A場①と水局吉化するから、破壊性の中から吉化の要因が生じる暗示がある。だが、巳⑥×のC波動の年は、破壊数が二つ重なるので、①・⑥水局作用は崩れるから、この年は特に要注意年といえる。"}, {"t": "text", "text": "特にこの周期でいえることは、X型のクロス期に入っているので、運気は、吉凶が乱調子になりやすい暗示がある。"}], "rep": true}, {"label": "亥⑥×・丑⑤", "board": {"t": "pair", "a": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "b": [["", "", "", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "亥⑥×・丑⑤ の周期は、十二支が冬の季質をもっているので、①午の陽性が阻害されやすく、運気も渋滞気味となる暗示がある。C波動の十二支の未は夏の季質があるので吉化するけれども、次の申年の秋の季質となって、生年①数が準破壊となる男性は、凶性を誘引しやすい暗示がある。だからA場で①・⑥水局するといっても、吉化の度合は弱い。また女性の場合もA場で①・⑤土局し、F場で⑥×・①水局するけれども、土剋水の理から判断すると、運気は横バイ渋滞気味となりやすい。これを裏づけるように、C波動の十二支も秋から冬の季質となっている。"}], "rep": true}, {"label": "子⑦・子④", "board": {"t": "pair", "a": [["", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", ""]], "b": [["✕", "", "✕", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "○", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "子⑦・子④ の周期は、十二支が生年の午と冲となり、波動数⑦・④がそれぞれ、D④・D①。G⑦・G①となって、運気の変化を暗示しているので、いよいよ、本格的【p.31】上昇運の近いことを予告する時期に入ったことを暗示している。だからC波動の十二支も、冬から春の季質に向かっているので、力は弱くとも、徐々に上向く準備が調う潜象理がみられる。だから、寅⑥×のC波動の年だけ要注意で、以後、運気は上昇気味となる暗示がある。"}], "rep": true}, {"label": "丑⑧・亥③△", "board": {"t": "pair", "a": [["", "", "", "✕", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]], "b": [["", "✕", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "○", ""]], "caption": ""}, "items": [{"t": "text", "text": "丑⑧・亥③△ の周期は、男性は本格的な上昇運となるが、女性は波動③によって、生年①が破壊となるので、たとえ波動数⑧・③木局作用があったとしてもその力は弱いから、横バイの弱運の暗示となる。"}], "rep": true}, {"label": "寅⑨・戌②", "board": {"t": "pair", "a": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", ""]], "b": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "寅⑨・戌② の周期は、生年午と火局する周期となっているだけでなく、波動数そのものもJ・A・Bの交流の数理が形成されるので、上昇運はもう一段、強くなる可能性を暗示している。"}, {"t": "text", "text": "ここで慎重に対処しなければならないことは、夏の季質が強くなるので、調子に乗りやすく、行き過ぎとなりやすいので、力量以上の命運が顕現される傾向があるから好運を自ら破る行動をやりかねないので、十分に言動を注意すべきである。"}, {"t": "text", "text": "この周期におけるC波動の十二支は、秋から冬の季質となって、火局性を調和する暗示があるが、⑥×の年は注意する必要がある。ということは、破壊数の年であると【p.32】同時に、生年①数がB①・B⑦×となるから、男性は吉運の中の凶運年となる可能性がある。これに対して、女性は戌②の周期だから、J①×となって、生年①が辰の場で破壊されるので、男性よりもこの周期は吉運が弱い暗示があるので、亥⑥×の年は要注意の年といえよう。"}], "rep": true}, {"label": "卯①・酉①", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "卯①・酉① の周期は、十二支が冲となっているだけでなく、生年午とは十字形象となって、F⑥×の子の場に誘引されやすい、落とし穴、失敗を招く暗示が隠されている時期なので、好事魔多しの言葉が象徴している意味を、よく吟味すべきといえる。"}, {"t": "text", "text": "この理を裏打ちするように、C波動の十二支は春から夏へ向かって燃え上がる季質となっているので、上昇運は続いていても、油断は禁物である。特に男性は夏の季質を帯びる③巳から要注意の時間帯に入るので、未⑤は、表面は木局するけれども、生年①が原点にある、F⑥×と重合するが、周期波動で、F⑥×が強力化しているので、水局化は無力化する暗示があるから、凶性を誘引しやすい暗示がある。"}], "rep": true}, {"label": "辰②・申⑨", "board": {"t": "pair", "a": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "8", "4", "6", "○"], ["", "7", "9", "2", ""], ["✕", "3", "5", "1", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰②・申⑨ の周期はまだ大クロス期となっているので、前の周期で凶相を呼ぶ要因を作っていれば、凶運が作用し、吉相となる要因を作っておれば、吉運期となる暗示がある。その意味では、上昇継続となるか、下降運を招くかは、前周期の行動にある。"}], "rep": true}]}, {"id": 3, "num": "①", "numVal": 1, "branch": "酉", "title": "①数酉（とり）年の読み方", "headingRaw": "【p.33（本文なし）】【p.34】①数酉（とり）年の読み方", "page": 34, "cycleText": "生年数①……五年周期（補助周期十年）", "male": {"head": "男性の場合（酉年）破壊数は⑥×・⑧×", "jun": "1酉→2戌→3亥→4子→5丑→6×寅→7卯→8×辰→9巳→1午……", "gyaku": "1酉→9申→8×未→7午→6×巳→5辰→4卯→3寅→2丑→1子……"}, "female": {"head": "女性の場合（酉年）破壊数は⑥×・⑧×", "jun": "1酉→9申→8×未→7午→6×巳→5辰→4卯→3寅→2丑→1子……", "gyaku": "1酉→2戌→3亥→4子→5丑→6×寅→7卯→8×辰→9巳→1午……"}, "note": "（月の盤の▲ 9", "5", "7", ""], ["✕", "8", "1", "3", "○▲"], ["", "4", "6", "2", ""], ["", "", "✕▲", "", ""]], "b": [["", "", "○", "", ""], ["", "6", "2", "4", ""], ["▲", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "✕▲", "", ""]], "caption": "①酉年6月（⑦午月）"}, {"t": "text", "text": "秋九月生まれの場合は、生月が同数となって、行動を意味するH場がH⑧×・H⑧×となるから、行動が規制されやすい暗示がある。また年月対応数理がすべて同数並列となるので、物事が二分されやすい気質があるから、環境によっては、陽性と陰性が分離しやすく、陰性が強まる暗示がある。従って波動数が⑧×の周期には、凶性が他の月生まれの人より強く作用する。たとえ、順逆で⑧×・③△（△印は生年①が破壊される周期）が木局数理となっていても、破壊性が強いので、木局吉化とはならない。【p.36】また他に吉化要因があったとしても、吉化の度合は微弱である。"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕▲", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕▲", "", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕▲", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕▲", "", ""]], "caption": "①酉年9月（①酉月）"}, {"t": "text", "text": "次に注意すべき生月は、酉月と辰月で、共に⑥×となって、生年の⑥×と二重に破壊数があるから、①・⑥×水局の度合は微弱なので、波動⑥×の周期は、潜在の凶性が誘発されやすい暗示がある。"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕▲", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕▲", "", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕▲", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕▲", "", ""]], "caption": "①酉年9月（①酉月）"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", "▲"]], "b": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["▲", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "▲", "", ""]], "caption": "①酉年4月（⑤辰月）"}, {"t": "text", "text": "次に注意すべき月は、二月・十一月の③数月で、①×となるので、①数波動期は、他の生月より弱体化する可能性がある。また十月生まれも①×となるから、①数波動期は弱体化されるので、見落とさないように。"}, {"t": "pair", "a": [["", "", "", "", "▲"], ["", "9", "5", "7", ""], ["✕▲", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕▲", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "▲", "", ""]], "caption": "①酉年2月（③寅月）"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["", "9", "5", "7", ""], ["✕▲", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "✕", "", "", ""], ["", "2", "7", "9", ""], ["✕▲", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "▲", "○", ""]], "caption": "①酉年11月（③亥月）"}, {"t": "pair", "a": [["▲", "", "", "", "▲"], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "▲", "", ""]], "caption": "①酉年10月（②戌月）"}], "step2Head": "〔手順２〕波動の流れを把握するためには、波動数と十二支、クロス期を注視。", "step2Intro": [], "cycles": [{"label": "酉①・酉①", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "酉①・酉① の周期は秋の季質があるので、生月の作用が強く作用するから、①×の生月生まれは、弱運期といえる。また七月⑧数月生まれは、生年のH⑧×の影響を受けるので、やはり弱運期である。他の生月は吉運ではあっても、C波動の十二支が秋から冬へ向かっているので、吉運横バイ型といえる。"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["▲", "", "✕", "", ""]], "b": [["", "", "", "○", ""], ["", "7", "3", "5", ""], ["▲", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "▲", "", ""]], "caption": "①酉年7月（⑧未月）"}], "rep": true}, {"label": "戌②・申⑨", "board": {"t": "pair", "a": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "8", "4", "6", "○"], ["", "7", "9", "2", ""], ["✕", "3", "5", "1", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "戌②・申⑨ の周期は吉運で、多少上向きの傾向がみられる。だが、C波動⑥×、⑧×の年は、⑥×・⑧×の生月の生まれは吉運が阻害されるので、凶性を帯びやすい。"}], "rep": true}, {"label": "亥③△・未⑧×", "board": {"t": "pair", "a": [["", "✕", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "○", ""]], "b": [["", "", "", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "【p.37】亥③△・未⑧× の周期は、それぞれ木局の季質はあっても、生年が酉の季質なので木局性は阻害される。しかも、③△では生年①がH場で破壊数となるだけでなく、⑧×の時期だから、運気は下降する傾向がみられる。C波動の十二支からみても、秋の季質は申年から徐々に強まり、冬の亥に向かうので、収縮型の季質がある。だから亥⑥×年は凶作用が強まる暗示がある。"}], "rep": true}, {"label": "子④・午⑦", "board": {"t": "pair", "a": [["✕", "", "✕", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "○", "", ""]], "b": [["", "", "○", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "子④・午⑦ の周期は、男性は子の冬型となっているので、たとえ生年で変化を象徴するD④に該当するといっても力は弱いから、前周期で下降した運気が下げ止り、底練り型の、吉運ではあっても、弱い時期といえる。だから⑧×年は凶性が誘発されやすい暗示がある。"}, {"t": "text", "text": "これに対して女性の午⑦は、夏季の陽性が強いので、活力が出るから、幾分上向きの上昇気運が作用する暗示がある。だが、③数月生まれは対応数理で凶相となるから、運気の底練り型となる可能性がある。ところで、この周期で注視しなければならない点は、周期にみられる十二支の冲作用で、生年酉との関係で、十字形象となって、支が無い卯の場にあるH⑧×の作用に誘引されやすい暗示があるから、C波動の丑⑧×の年は、吉凶の分岐点となる可能性がある。"}, {"t": "pair", "a": [["", "", "", "", "▲"], ["", "9", "5", "7", ""], ["✕▲", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕▲", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "▲", "", ""]], "caption": "①酉年2月（③寅月）"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["", "9", "5", "7", ""], ["✕▲", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "✕", "", "", ""], ["", "2", "7", "9", ""], ["✕▲", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "▲", "○", ""]], "caption": "①酉年11月（③亥月）"}], "rep": true}, {"label": "丑⑤・巳⑥×", "board": {"t": "pair", "a": [["", "", "", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "", "", ""]], "b": [["", "○", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "✕", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "【p.38】丑⑤・巳⑥× の周期は、十二支が三合金局する周期だから、巳⑥×は生年①酉との関係で、①・⑥水局吉化される可能性の強い周期となるから、⑥×年だけを注意すれば、無難に推移できるだけでなく、運気上昇につながる因子が、この周期の中に生じる時期となる可能性がある。また⑤数も①数と土局化し、F場の潜在にあるF⑥×と水局するから、これまた吉化要因を孕む周期といえる。だがこの周期は、次の周期とX型の小クロス期を形成する周期であるから、行動型の時期ではなく、基礎固め期といえるので、行動を積極的に起こすと、失速を自ら求める暗示もみられるので、慎重に行動し、力を蓄える時期でもある。"}], "rep": true}, {"label": "寅⑥×・辰⑤", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "寅⑥×・辰⑤ の周期は、前の波動数と逆転しているので、波動数は合局要因があったとしても、十二支が合局しないので、合局性は弱いから、運気は弱含み横バイ型となりやすい暗示がある。またC波動の十二支も冬季型を示しているので、行動にはつながり辛い。だが底練期ではあっても、上昇気運が胎生する要因はある時期なので、C波動の破壊年だけは要注意年である。"}], "rep": true}, {"label": "卯⑦・卯④", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "b": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["○", "2", "4", "6", "✕"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "卯⑦・卯④ の周期は、生年酉と冲作用となる周期なので、運命転換期といえる。だから、X型のクロス期で凶性を孕んだ場合は、上昇力が阻害され、吉性を孕んだ場合【p.39】は、上昇力に結びつく可能性を秘めた周期といえる。だから、C波動の破壊年は慎重に対処しなければならない。"}], "rep": true}, {"label": "辰⑧×・寅③△", "board": {"t": "pair", "a": [["", "", "", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰⑧×・寅③△ の周期は、波動数は木局しやすい気質があるので、破壊性を誘発しやすい時期ではあるが、活力は強まる暗示がある。だから破局性の中に、上昇気運が生じやすい時期ともいえる。別言すれば底離れしやすい波瀾含みの周期といえる。"}], "rep": true}, {"label": "巳⑨・丑②", "board": {"t": "pair", "a": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "b": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "巳⑨・丑② の周期は、いよいよ本格上昇となる時期であることを象徴している。"}, {"t": "text", "text": "十二支は生年酉と、巳・丑によって三合金局となるので、運気の基盤が固められているので、生月いかんでは強力な上昇運となる可能性がある。運気の弱い人でも、身辺になんとなく明るさが見えてくる時期といえよう。だから上昇気運を自ら破らないためには、C波動の破壊年を注意して、むしろその破局性の中から、プラス要因を汲み取るべく努力すべきである。"}], "rep": true}, {"label": "午①・子①", "board": {"t": "pair", "a": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "午①・子① の周期は、波動数の原点帰りの時期だから、吉運の中にも、原点に潜んでいる⑧×・⑥×の破壊性が、ちょっとしたきっ掛けで誘引または誘発しやすい暗示があるので、油断と気の緩みが生じやすいだけでなく、物事が反転しやすい暗示が潜象にあるから、この点も見落とさないように。特にこの周期は、十二支が十字形象を形【p.40】成しやすい時期なので、生年にあるH⑧×の潜在性が、物事の乗り変わり時点で誘発しやすいので、この点も注意して、上昇運を自ら破らないようにすべきである。"}, {"t": "text", "text": "またこの周期において、原点にある⑥×が吉化される暗示があることも、見逃さないように。だが吉化される要因はあっても、動揺しやすい暗示もあることを、見落とさないようにすべきである。この潜象理をよく象徴しているのが、前周期にある十二支の巳・丑と、次の周期にある十二支の未・亥とは、X形底流となって、冲作用を形成しているだけでなく、波動数もまた、X型の大クロス期を形成する、運命柱となる周期が、よくこの理を証しているようだ。"}], "rep": true}, {"label": "未②・亥⑨", "board": {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "b": [["", "✕", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", ""]], "caption": ""}, "items": [{"t": "text", "text": "未②・亥⑨ の周期は、上昇運の運気が二分されやすい時期ではあるが、まだ上昇の気運はあるが、次の周期からは、渋滞気味となりやすい暗示があるので、吉凶の分かれ目を生じやすい周期だから、特に破壊年は注意しなければならない。特に⑧数月生まれの人は、波動数によって⑧数が破壊されるので、⑧×の破壊性を強める暗示があるから、凶性を誘発しやすいので注意すべきである。だから破壊数に該当する年は慎重に行動しないと、上昇運を破る可能性がある。"}, {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["▲", "", "✕", "", ""]], "b": [["", "", "", "○", ""], ["", "7", "3", "5", ""], ["▲", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "▲", "", ""]], "caption": "①酉年7月（⑧未月）"}], "rep": true}, {"label": "申③△・戌⑧×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "申③△・戌⑧× の周期は上昇から下降に入る周期だから、油断は禁物である。"}], "rep": true}]}, {"id": 4, "num": "②", "numVal": 2, "branch": "丑", "title": "②数丑（うし）年の読み方", "headingRaw": "【p.41（本文なし）】【p.42（本文なし）】【p.43（本文なし）】【p.44】②数丑（うし）年の読み方", "page": 44, "cycleText": "生年数②……六年周期（補助周期二年）", "male": {"head": "男性の場合（丑年）破壊数は⑧×", "jun": "2丑→1子→9亥→8×戌→7酉→6申→5未→4午→3巳→2辰……", "gyaku": "2丑→3寅→4卯→5辰→6巳→7午→8×未→9申→1酉→2戌……"}, "female": {"head": "女性の場合（丑年）破壊数は⑧×", "jun": "2丑→3寅→4卯→5辰→6巳→7午→8×未→9申→1酉→2戌……", "gyaku": "2丑→1子→9亥→8×戌→7酉→6申→5未→4午→3巳→2辰……"}, "note": "（月の盤の▲は、生年の盤の破壊の場に重なる所）", "yearBoard": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]], "months": [{"label": "2月　⑥寅", "month": 2, "num": "⑥", "branch": "寅", "board": [["", "", "", "", "▲"], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["", "", "", "", "✕"]]}, {"label": "3月　⑦卯", "month": 3, "num": "⑦", "branch": "卯", "board": [["", "", "", "", "▲"], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "", "", ""]]}, {"label": "4月　⑧辰", "month": 4, "num": "⑧", "branch": "辰", "board": [["", "", "", "", "▲"], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]]}, {"label": "5月　⑨巳", "month": 5, "num": "⑨", "branch": "巳", "board": [["", "○", "✕", "", "▲"], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]]}, {"label": "6月　①午", "month": 6, "num": "①", "branch": "午", "board": [["", "", "○", "", "▲"], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]]}, {"label": "7月　②未", "month": 7, "num": "②", "branch": "未", "board": [["", "", "", "○", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]]}, {"label": "8月　③申", "month": 8, "num": "③", "branch": "申", "board": [["", "", "", "", "▲"], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]]}, {"label": "9月　④酉", "month": 9, "num": "④", "branch": "酉", "board": [["✕", "", "", "", "▲"], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]]}, {"label": "10月　⑤戌", "month": 10, "num": "⑤", "branch": "戌", "board": [["", "", "", "", "▲"], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]]}, {"label": "11月　⑥亥", "month": 11, "num": "⑥", "branch": "亥", "board": [["", "✕", "", "", "▲"], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]]}, {"label": "12月　⑦子", "month": 12, "num": "⑦", "branch": "子", "board": [["", "", "✕", "", "▲"], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", ""]]}, {"label": "1月　⑧丑", "month": 1, "num": "⑧", "branch": "丑", "board": [["", "", "", "✕", "▲"], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]]}], "step1Head": "〔手順１〕座標となる生年月の対応数理と、十二支との関係を読む。", "step1": [{"t": "text", "text": "まず最初に考えなければならない点は、「丑」は晩冬の季質と共に、春を迎える季質があり、その季質を受けた②数はたんなる２数の意味だけでなく、新しい生命を生む母胎の機能を秘めた。10＋1＝11、1＋1＝②の潜象理を内包した理があることを、【p.45】よく理解すべきである。別言すれば、大地の意味を秘めて、外なるものと、内なるものを合せ持ち、じっと春を待つ努力と、物事の吉凶を飲み込み、新しく再生するために、忍耐強く、柔順で、質素な心情を持つ潜象理がある。"}, {"t": "text", "text": "また大地は、新しい生命を育むために、苦難に耐えて、春の季を待ち、無から有を生み出す創造性と、育む愛情を常に持ちつづける、献身的な気質をもっているので、母・妻の意味をもつ数である。その意味では、常に物事の変化に対応する、細心の心根はあっても、物事に執着する囚われがあるので、変化、変革、転換に関して、②数の原点であるG場にG⑧×があるので、自己の環境を変えづらい気質もある。"}, {"t": "text", "text": "以上の基本的意味をふまえたうえで、生年の数理と、生月の数理と十二支を対応させて、②数が陽性を帯びているか、陰性を帯びているか、破壊性を帯びている数質であるか、冲となって質転換が起こりうる数理となっているか、その潜象理を、波動を数読みする前に、よく把握する必要がある。"}, {"t": "text", "text": "例をあげて説明すれば、未②数月生まれの人は、A場がA②・A②の並列となって、質転換が起こりやすい命質であると共に、未月であるから、火性の気質があり、火生土の理によって、内力が強化しやすい暗示がある。これに対して、一月丑生まれは、生【p.46】月によって生年②数が、D場で破壊数となるだけでなく、生年のG⑧×が生月のA場に回座しているので、D・A・Gの柱がすべて破壊性を帯びるから、生活、職能の環境によって、凶性となるか、吉性化するか、その命運に大きな差が生じる暗示がみられる。四月⑧辰の場合は、同じような数理でも、その変質度は弱い暗示がある。"}, {"t": "pair", "a": [["", "", "", "✕", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "○", "", "", ""]], "b": [["", "", "", "○", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "caption": "②丑年7月（②未月）"}, {"t": "pair", "a": [["", "", "", "✕", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "○", "", "", ""]], "b": [["", "", "", "✕", "▲"], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]], "caption": "②丑年1月（⑧丑月）"}, {"t": "pair", "a": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "○", "", "", "▲"]], "b": [["", "", "", "", "▲"], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "caption": "②丑年4月（⑧辰月）"}, {"t": "text", "text": "また、十一月⑥亥の場合は、生年のG⑧×は、年月対応でG⑧×・G③となって、木局吉化し、凶性を緩和する暗示がある。"}, {"t": "pair", "a": [["▲", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", "▲"]], "b": [["", "✕", "", "", "▲"], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "caption": "②丑年11月（⑥亥月）"}], "step2Head": "〔手順２〕波動の流れを把握するためには、波動数と十二支、クロス期、冲作用をよく注視する必要がある。", "step2Intro": [], "cycles": [{"label": "丑②・丑②", "board": {"t": "pair", "a": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]], "b": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "丑②・丑② の周期は晩冬の季質だから、外力の援助によって吉化するので、C波動の十二支が春から夏へ向かうのか、冬から秋の陰性化によって大きな差が生じるので、生月との対応数理によって、吉凶の度合が規制される傾向がある。だから、生月にもよるが、春から夏にかけての生まれの場合は安泰の命質期である。ただし、②数が破壊性を帯びている場合は、不安定な暗示がある。だが②・⑦火局した場合は吉化する。"}], "rep": true}, {"label": "子①・寅③", "board": {"t": "pair", "a": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "子①・寅③ の周期は、安泰な運気ではあるが、子①の方が質とすれば弱運で、春の【p.47】季質を帯びた寅③の方が子①の方より好運。"}], "rep": true}, {"label": "亥⑨・卯④", "board": {"t": "pair", "a": [["", "✕", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", ""]], "b": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["○", "2", "4", "6", "✕"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "亥⑨・卯④ の周期は、少年期の上昇期で好運の時期である。だから、C波動の十二支も晩冬から春・夏型となっているので、年毎に活力が出る吉運期といえる。だが、破壊数に該当する⑧×辰の年は、上昇の中の下げ波動の凶性が生じやすい暗示があるだけでなく、この破壊年の凶性が強く作用した場合は、次の戌⑧×・辰⑤の波瀾、不安定期まで尾を引く暗示があるので、油断は禁物といえる。②・⑤・⑧の地数月生まれの人は、その周期が吉運といっても、破壊年は要注意といえる。"}], "rep": true}, {"label": "戌⑧×・辰⑤", "board": {"t": "pair", "a": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "戌⑧×・辰⑤ の周期は、前の周期で上昇した運気がダメ押し的に、下降ないしは、波瀾含みとなって渋滞気味となる時期である。それを暗示するように、波動の十二支も冲となって、C波動②未の年は物事が変動しやすく、渋滞気味になりやすいので、特に七月未②生まれの人は凶性となりやすい暗示がある。だが、これに反して③数月生まれの人は、凶性が緩和され、その中に吉化の因子が表出する暗示がみられる。またこの周期は、男性は凶作用が強く、女性は吉化されやすく、多少ぐずついたとしても、吉運を呼びやすい、小吉運といえよう。ただし、⑤×をもつ月に生まれた女性の場合は、波瀾、渋滞気味となりやすい。"}, {"t": "pair", "a": [["", "", "", "✕", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "○", "", "", ""]], "b": [["", "", "", "○", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "caption": "②丑年7月（②未月）"}, {"t": "pair", "a": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "○", "", "", ""]], "b": [["", "", "", "", "▲"], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": "②丑年8月（③申月）"}], "rep": true}, {"label": "酉⑦・巳⑥", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["✕", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "b": [["", "○", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "✕", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "【p.48】酉⑦・巳⑥ の周期は、男女共に上昇運の時期である。だから周期初めのC波動⑧×の年は、十二支も三合金局しているので、凶変じて吉化しやすい暗示がある。だからC波動の十二支も、年毎に陽性を帯びているので、年月によって多少の差はあったとしても、上昇気運であることには変わりない。たとえ、次の周期と小クロス期を形成しても、大きな変転は考えられないので、次の周期も、同じ上昇運の中で展開される可能性がある。"}], "rep": true}, {"label": "申⑥・午⑦", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "○", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "申⑥・午⑦ の周期も前の周期の上昇運を受けて好運に推移する可能性がある。ただし、C波動の戌⑧×の年は破壊年であると同時に、生年②数が破壊されるので渋滞が生じやすい暗示がある。"}], "rep": true}, {"label": "未⑤・未⑧×", "board": {"t": "pair", "a": [["", "", "", "○", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "✕", "", "", ""]], "b": [["", "", "", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "未⑤・未⑧× の周期は、生年の丑と冲作用となるので、吉凶が大きく二分されやすい時間帯である。しかもC波動②丑とは、波動の未と冲をなすので、男女の運気に変動が生じ、男性は吉性化しやすく、女性は凶性が強く生じやすい暗示がある。別言すれば、前周期を受けて、男性は上昇の中での横バイ、女性は下降の暗示があるといえよう。"}], "rep": true}, {"label": "午④・申⑨", "board": {"t": "pair", "a": [["✕", "", "○", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "b": [["", "", "✕", "", ""], ["", "8", "4", "6", "○"], ["", "7", "9", "2", ""], ["✕", "3", "5", "1", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "午④・申⑨ の周期は、波動数が金局するので、男女共に安泰期である。"}], "rep": true}, {"label": "巳③・酉①", "board": {"t": "pair", "a": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "巳③・酉① の周期は、十二支が金局するので、前周期の延長線上の運気である。だ【p.49】が九月④酉生まれは、金局するけれども、③と①が破壊性を帯びているので、吉凶半々の不安要因がみられる。"}, {"t": "pair", "a": [["▲", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]], "b": [["✕", "", "", "", "▲"], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": "②丑年9月（④酉月）"}], "rep": true}, {"label": "辰②・戌②", "board": {"t": "pair", "a": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]], "b": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰②・戌② の周期は、波動数②が原点帰りした時間帯なので、十二支との兼ね合いでX形象の無い十二支の未の場にある、G⑧×が表出されやすい暗示がある反面、原点に内在する吉性も ", "○", "✕▲"]]}, {"label": "12月　⑦子", "month": 12, "num": "⑦", "branch": "子", "board": [["", "", "✕", "", "▲"], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", "▲"]]}, {"label": "1月　⑧丑", "month": 1, "num": "⑧", "branch": "丑", "board": [["", "", "", "✕", "▲"], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", "▲"]]}], "step1Head": "〔手順１〕座標となる生年月の対応数理と、十二支との関係を読む。", "step1": [{"t": "text", "text": "まず最初に考えなければならない点は、「辰」は晩春の季質をもつと共に、水局性を潜在に秘めているということを、よく念頭に入れておくべきである。したがって、②数【p.52】は表面的には地数ではあるが、辰の春の季質と水の潜象理から判断すれば②数は大地としての②数の意味と、水性としての１＋１＝②の意味を秘めていると考えなければならない。だからA②はJ場と関わりながら、またF場のF⑦と火局する理があるので、生育する性能と、流水の意味を含めた、二面性の意味がある。"}, {"t": "text", "text": "次に生月対応からこれらの意味を探ると、三月は卯⑦、十二月は子⑦で共にA②と火局する理があるので、吉性は強化される意味があるが、子月の場合は冬の季質が緩和され吉化する暗示がある反面、E場でE②×となっているから、吉凶二面作用が働く意味を内包しているだけでなく、年月対応ではE⑥・E②×の関係から、②×作用が⑩と①に分裂する理となって、A場の火局作用の質低下を誘う因子となる面もある。"}, {"t": "pair", "a": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", "▲"], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]], "b": [["", "", "", "", "▲"], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "", "", "▲"]], "caption": "②辰年3月（⑦卯月）"}, {"t": "pair", "a": [["", "", "▲", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", "▲"], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]], "b": [["", "", "✕", "", "▲"], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", "▲"]], "caption": "②辰年12月（⑦子月）"}, {"t": "text", "text": "次に注意すべき年月対応数理では地数月で、特に生年のG⑧×がA⑧となっている、四月辰⑧、一月丑⑧で、辰月より丑月の方が、活力としては弱体化しやすい暗示がみられる。また生年のB③×が生月となっている八月申は、十二支が辰・申の水局軌道にあるだけでなく、秋の季質の金性作用から、金生水となる潜象理によって、凶性が緩和される暗示がある。"}, {"t": "pair", "a": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["▲", "", "", "", "▲"]], "b": [["", "", "", "", "▲"], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", "▲"]], "caption": "②辰年4月（⑧辰月）"}, {"t": "pair", "a": [["", "", "", "", "✕▲"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["▲", "", "", "", ""]], "b": [["", "", "", "✕", "▲"], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", "▲"]], "caption": "②辰年1月（⑧丑月）"}, {"t": "pair", "a": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["▲", "", "", "", ""]], "b": [["", "", "", "", "▲"], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", "▲"]], "caption": "②辰年8月（③申月）"}], "step2Head": "〔手順２〕波動の流れを把握するためには、波動と十二支、クロス期、冲作用を【p.53】よく注意する必要がある。", "step2Intro": [], "cycles": [{"label": "辰②・辰②", "board": {"t": "pair", "a": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]], "b": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰②・辰②はC波動の数と十二支が夏と秋の季質があるので、安泰期といえる。ただし③巳年は破壊数の年だから、吉運が弱体化する暗示がある。他の年は吉運である。"}], "rep": true}, {"label": "卯①・巳③×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "caption": ""}, "items": [{"t": "text", "text": "卯①・巳③×の周期は、春と夏の季質であるが、男性は吉運のようにみえても、A②がB③×と重なるため、質的には運は若干低下するので、横バイ吉運期といえよう。それを暗示するように、C波動の十二支も、秋・冬・春の季質となっているので、寅③×年だけ要注意年といえるが、周期末の卯④の年より、少年期の上昇吉運が始まる可能性がある。女性は破壊数ではあっても、夏の季質があるので、破壊性は緩和されやすい暗示があるから、弱運低迷期といえよう。"}], "rep": true}, {"label": "寅⑨・午④", "board": {"t": "pair", "a": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", ""]], "b": [["✕", "", "○", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "寅⑨・午④の周期は両者とも上昇運である。だから吉運期といえる。この周期で特に注意すべき年は、未⑧×の年で、破壊数であると共に、自己のA②が破壊数となる年だから、上昇の中の下降運となる暗示がある。他の年は吉運である。ただし、八月生まれ③数の人は、上昇気運はあっても弱く、低迷化しやすい暗示がみられる。"}, {"t": "pair", "a": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["▲", "", "", "", ""]], "b": [["", "", "", "", "▲"], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", "▲"]], "caption": "②辰年8月（③申月）"}], "rep": true}, {"label": "丑⑧×・未⑤", "board": {"t": "pair", "a": [["", "", "", "✕", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]], "b": [["", "", "", "○", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "丑⑧×・未⑤の周期は、十二支が冲となるので、運命的には波立って、不安定な動揺期といえよう。だが男性は破壊数の時期だから運気下降となる暗示がある。"}], "rep": true}, {"label": "子⑦・申⑥", "board": {"t": "pair", "a": [["", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", ""]], "b": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "【p.54】子⑦・申⑥の周期は、生年の辰と三合水局を形成する時期で、しかも男性はA②と火局し、女性はF場で火局し、水火合一の気質となるので、運気が再度上昇となる暗示がある。だが周期初めの辰⑧×年は、破壊年ではあっても、三合水局するので、凶性は吉化緩和される暗示がある。だから前周期の破壊性が、上昇運の中に割り込んだ形、またはずれ込んだ形といえよう。"}], "rep": true}, {"label": "亥⑥・酉⑦", "board": {"t": "pair", "a": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "b": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["✕", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "亥⑥・酉⑦の周期は、前周期と小クロスとなる時間帯ではあるが、波動数に凶性がみられないので、多少の低迷はあっても、上昇運である。だから破壊年の丑⑧×の年も、女性はA②・A⑦と火局吉化するだけでなく、十二支も金局化するので、凶性は弱体化する暗示がある。他の年は吉運。"}], "rep": true}, {"label": "戌⑤・戌⑧×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "戌⑤・戌⑧×の周期は、生年辰と冲となる周期であるから、運命転換期といえよう。特に注意すべき年は巳③×の年で、男性は凶性が出やすい年である。だが、生月いかんでは、過去の上昇運の周期でも昇りきれなく、低迷していた弱運の人でも、冲作用によって、上昇気運が、この周期の後半頃から起こる可能性がある。だが、女性の場合は破壊期となるので、凶性が作用するので、下降運となるが、周期後半頃になると、凶性が弱体化して、運気低迷型の中で、多少凶性は緩和される暗示がある。"}], "rep": true}, {"label": "酉④・亥⑨", "board": {"t": "pair", "a": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "b": [["", "✕", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", ""]], "caption": ""}, "items": [{"t": "text", "text": "【p.55】酉④・亥⑨の周期は、男性は運気上昇となるが、女性は吉化上昇運ではあっても、力は男性の運より弱い。それを暗示するように、C波動の十二支も、晩秋から冬、春の季質となっているので、吉運ではあっても緩やかな上昇運となる可能性がある。だから、周期初めの戌⑧×の年は、前周期の凶性を引摺った年ではあるが、次の亥⑨の年から凶性が急速に無力化して、上昇気運に転換する暗示がある。また波動数も④・⑨金局化するので、底固い運気といえよう。"}], "rep": true}, {"label": "申③×・子①", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "申③×・子①の周期は、男性は③×期であるから、前周期で上った運気が渋滞気味になったり、下降気味になる暗示がある。特に③数月生まれが凶性が強く、⑨数月生まれはこれについで凶性が作用しやすい暗示がみられる。だが他の月生まれの人は、波動数の十二支が申・子と水局しているので、凶性は緩和される暗示があり、それを援助しているように、C波動の十二支が辰～酉となっているので、B③×の意味を強める行動、これに類した要因を作らなければ、弱含み横バイ期に変換される可能性がある。"}, {"t": "pair", "a": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["▲", "", "", "", ""]], "b": [["", "", "", "", "▲"], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", "▲"]], "caption": "②辰年8月（③申月）"}, {"t": "pair", "a": [["", "", "▲", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", "▲"]], "b": [["", "○", "✕", "", "▲"], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", "▲"]], "caption": "②辰年5月（⑨巳月）"}, {"t": "text", "text": "これに対して、女性は①数が破壊される月に生まれた人は、弱含みの凶性横バイ型となるが、その他は無難な周期といえよう。だからC波動の⑧×年は一時凶性が強まる。男性もこの⑧×年は要注意の年で、周期内では凶性が強く作用する暗示の強い年であ【p.56】るが、生年のG⑧×の要因と、波動のB③×の要因を引き出すような原因を、周期初めに作っている場合は、凶性は強く作用する暗示があるだけでなく、注意しないと、大クロス期となっているので、凶性の影響を長く引っ張る傾向がある。というのは、次の周期は波動数が②数の原点帰りするだけでなく、十二支が未・丑の冲となるから、生年の辰との兼ね合いで、X型になるから、無い十二支戌の場の③×作用を誘発するおそれがあるからである。"}], "rep": true}, {"label": "未②・丑②", "board": {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "b": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "未②・丑②の周期は、大クロス期の中核となる周期であるだけでなく、生年②数が原点帰りする周期であるから、原点にある、今迄眠っていた凶性を引き出しやすい環境にあるので、慎重に対処し、運気を平状に戻し、安定化させなければ、この周期以降の運気が弱体化される恐れがある。特に注意しなければならないのは、⑧数月生まれと、②×となる月生まれの人であるが、丑月の場合は、環境は悪化するけれども、十二支の冲作用によって、一時期ぐずつくても、吉化される暗示がある。"}, {"t": "pair", "a": [["", "", "", "", "✕▲"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["▲", "", "", "", ""]], "b": [["", "", "", "✕", "▲"], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", "▲"]], "caption": "②辰年1月（⑧丑月）"}, {"t": "pair", "a": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["▲", "", "", "", "▲"]], "b": [["", "", "", "", "▲"], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", "▲"]], "caption": "②辰年4月（⑧辰月）"}, {"t": "text", "text": "この周期は破壊期ではないので、無理しなければ、無難な横バイ型の運気である。C波動の亥③×年は、男性は周期の未と木局するので吉化されるので、凶性は弱い。女性は男性よりも凶性は強い。だから用心しないと、この破壊年に凶の原因を作れば、【p.57】周期内は運気が弱体化し、悪化した場合は次の周期の③×まで引っ張る原因となりやすい傾向があるので、慎重にしなければならない時間帯である。"}, {"t": "text", "text": "また②×の月生まれではあるが、十二月生まれの場合は⑦数だから、②×の凶性は弱く、吉化する暗示があるが、周期内では、C波動⑥の年は注意しなければ、生年月のE⑥とE②×の対応破壊を誘発する恐れがあるだけでなく、生月⑦がB場でB⑦×となって、生年のB③×と対応破壊を誘発するので、慎重に対処しなければならない年である。だから、吉凶の振幅が激しく出やすい暗示の年といえよう。"}, {"t": "pair", "a": [["", "", "▲", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", "▲"], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]], "b": [["", "", "✕", "", "▲"], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", "▲"]], "caption": "②辰年12月（⑦子月）"}], "rep": true}, {"label": "午①・寅③×", "board": {"t": "pair", "a": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "午①・寅③×の周期は、男性は吉運に推移する可能性があるが、女性は凶運期だから運気下降となりやすい暗示がある。だが、十二支は午・寅の火局作用が内包され、しかも、C波動の十二支も春から夏の季質が多いので、凶性は吉化された暗示もみられる。だから、⑧×年と、周期後半に巡ってくる申③×の年は、申・寅の支冲によって、周期の火局が消化されるので、凶性を誘発しやすくなる年だから、特に女性は注意すべきである。"}], "rep": true}, {"label": "巳⑨・卯④", "board": {"t": "pair", "a": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "b": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["○", "2", "4", "6", "✕"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "巳⑨・卯④の周期は男女共吉運となる周期であるが、次の周期は辰⑧×・辰⑤となって、男性は生年のG⑧×が投影、表出されやすいので要注意。女性は運気渋滞。"}], "rep": true}]}, {"id": 6, "num": "②", "numVal": 2, "branch": "未", "title": "②数未年の読み方", "headingRaw": "【p.59】②数未年の読み方", "page": 59, "cycleText": "生年数②……六年周期（補助周期二年）", "male": {"head": "男性の場合（未年）破壊数は⑤×・⑧×", "jun": "2未→1午→9巳→8×辰→7卯→6寅→5×丑→4子→3亥→2戌……", "gyaku": "2未→3申→4酉→5×戌→6亥→7子→8×丑→9寅→1卯→2辰……"}  "7", ""], ["", "8", "1", "6", "○"], ["▲", "", "", "", ""]]}, {"label": "11月　⑥亥", "month": 11, "num": "⑥", "branch": "亥", "board": [["", "✕", "", "", "▲"], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["▲", "", "", "○", "✕"]]}, {"label": "12月　⑦子", "month": 12, "num": "⑦", "branch": "子", "board": [["", "", "✕", "", "▲"], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "○", "", ""]]}, {"label": "1月　⑧丑", "month": 1, "num": "⑧", "branch": "丑", "board": [["", "", "", "✕", "▲"], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕▲", "○", "", "", ""]]}], "step1Head": "〔手順１〕座標となる生年月の対応数理と、十二支との関係を読む。", "step1": [{"t": "text", "text": "まず最初に考えなければならない点は、「未」は晩夏の季質をもっているので、火気が潜在にあるということを念頭にいれておくべきである。したがって、②数は火気の気質が徐々に弱まろうとする一歩手前の、気質を内包していると判断すべきである。【p.60】その意味では、②数は②数の意味でも、その逆転した⑨数の意味を表出しやすい暗示があるので、運命相の変転においても、命質いかんでは、逆転しやすい暗示がある。だから、破壊期、破壊数があるからダメだと、単純に判断しないで、冲作用を形成しているか、合局吉化する要因があるか、またC波動の十二支、年数においても、冲作用、合局作用が形成される時には、凶変じて吉化することがありうるので、読み違えしないように、細部にわたって、それらの要件を吟味する必要がある。その意味では、生年月の対応数理をしっかり把握する必要がある。"}, {"t": "text", "text": "生月から読むと、四月辰⑧は、年月対応から判断すると、生年のA②はF⑦と火局し、生月ではA⑧はE③と木局する潜象理があるので、環境いかんでは縦軸に吸合しやすく、凶性が弱体化することもありうるので、家庭環境、生活環境、身体の健康状態をよく吟味する必要がある。そのためには、この命質が誕生前に、母胎内で受胎した数理環境を、父・母の両方から、波動によって吟味しなければならない。"}, {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "✕", "", "", "▲"]], "b": [["", "", "", "", "▲"], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕▲", "", "", "", ""]], "caption": "②未年4月（⑧辰月）"}, {"t": "text", "text": "次に一月丑⑧の生まれの場合は、晩冬の季質ではあるが、夏の季質が生年にあるので、寒暖の気質が中和される理があると共に、未・丑とが冲作用となっているので、気質が反転しやすい潜象理がある。"}, {"t": "pair", "a": [["", "", "", "○", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "✕", "", "", ""]], "b": [["", "", "", "✕", "▲"], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕▲", "○", "", "", ""]], "caption": "②未年1月（⑧丑月）"}, {"t": "text", "text": "【p.61】七月生まれは未②で、生年未②とは同数並列となるだけでなく、夏の季質があるので、吉凶作用が二分されやすい暗示があるが、十月⑤数戌生まれは、反転しづらい理があるので、吉化の度合いは鈍いところがある。"}, {"t": "pair", "a": [["", "", "", "○", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "✕", "", "", ""]], "b": [["", "", "", "○", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "✕", "", "", ""]], "caption": "②未年7月（②未月）"}, {"t": "pair", "a": [["▲", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "b": [["", "", "", "", "▲"], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["▲", "", "", "", ""]], "caption": "②未年10月（⑤戌月）"}], "step2Head": "〔手順２〕波動の流れを把握するためには、波動と十二支、クロス期、冲作用をよく注意する必要がある。", "step2Intro": [], "cycles": [{"label": "未②・未②", "board": {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "b": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "未②・未②の周期は、生月において②×となっている命質は、弱含みの運気となり、卯⑦の三月生まれは吉運となる。ただし十二月生まれはE②×となっているので、吉化が鈍る暗示がある。だからC波動⑤×の年は凶性も作用するので、弱含みとなりやすい。特に⑤×の年を注意しなければならないのは、十月⑤戌の人である。また丑⑧の人は凶性が表出されやすい。また七月②未の人も、⑤×があるので、弱運・不安定の年となりやすい暗示がある。また周期の全体を見通せば、⑤×年を除けば無難な運気といえよう。"}, {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", "▲"], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "b": [["", "", "", "", "▲"], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "", "", ""]], "caption": "②未年3月（⑦卯月）"}, {"t": "pair", "a": [["", "", "▲", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", "▲"], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "b": [["", "", "✕", "", "▲"], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8" "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "巳⑨・酉④の周期は、少年期の上昇運である。だから男女共に吉運となる。だが、⑤×・⑧×の年は凶性が作用しやすいので、上昇運の中の小さな下降運とみることができるので、破壊年は渋滞気味となって、物事がぐずつきやすい暗示があるが、全体とすれば上昇運である。それを支えるように、十二支は巳・酉の金局、波動数は⑨・④金局となっている。だが、⑦卯月生まれの女性は、卯・酉の冲作用が潜在に誘発されやすい暗示があるので、上昇力が鈍る暗示がみられる。"}, {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", "▲"], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "b": [["", "", "", "", "▲"], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "", "", ""]], "caption": "②未年3月（⑦卯月）"}], "rep": true}, {"label": "辰⑧×・戌⑤×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "b": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰⑧×・戌⑤×の周期は、男女共に破壊期であるから運気は下降、渋滞気味となるので、行動は慎重にすべきである。たとえ周期に辰・戌の冲があったとしても、生年の未との兼ね合いで、形象の無い十二支で丑のD場の破局性を刺激して、誘発しやすい暗示がある。だから、D場に破壊数のある生月の人は、凶性が強まる暗示がある。特にC波動が辰⑤×となる年は、男性は凶性が強く、女性は辰・戌の支が冲作用となるので、午①生まれの人は凶性が緩和されやすい。男性は申③生まれの人は凶性が緩和さ【p.63】れやすい。また男性の十月戌月生まれ、女性の辰月生まれは、十二支が冲となるので、凶性が反転して、凶運の中に吉化の要因が見えてくる暗示もある。全体として読めば、渋滞気味に推移する運気といえよう。"}, {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "▲", "", ""]], "b": [["", "", "○", "", "▲"], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["▲", "", "✕", "", ""]], "caption": "②未年6月（①午月）"}, {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "✕", "", "", ""]], "b": [["", "", "", "", "▲"], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["▲", "", "", "", ""]], "caption": "②未年8月（③申月）"}, {"t": "pair", "a": [["▲", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "b": [["", "", "", "", "▲"], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["▲", "", "", "", ""]], "caption": "②未年10月（⑤戌月）"}, {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "✕", "", "", "▲"]], "b": [["", "", "", "", "▲"], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕▲", "", "", "", ""]], "caption": "②未年4月（⑧辰月）"}], "rep": true}, {"label": "卯⑦・亥⑥", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "b": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "卯⑦・亥⑥の周期は、青年期における本格的な上昇運が発動する時期である。波動の卯・亥と生年の未とは、三合木局するので、上昇力は強化される要因を内包しているから、周期初めの未⑧×年があったとしても、十二支は三合木局するから、破壊性は部分的にあったとしても、凶性をカバー吉化する潜勢力がある。従って男女共に吉運となる暗示がある。だが男性は生月で⑦数が破壊数となる人、女性は生月で⑥数が破壊数となる人は、上昇力が鈍る暗示がある。"}], "rep": true}, {"label": "寅⑥・子⑦", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "寅⑥・子⑦の周期は、前の周期とクロス期を形成するので、上昇力に多少波が出やすいが、命質が良いと、この周期も、もう一段上げの上昇運となる可能性がある。これは男女とも同じである。だが周期初めと半ばに、C波動で⑤×と⑧×の年があるので、多少上昇波が鈍り、波立つ可能性がある。特に八月申③に生まれた男性は、上昇力は弱く、昇り切れなく、横バイ渋滞気味に推移しやすい暗示がある。女性の場合は、六月午①生まれも渋滞気味となる可能性があるので、慎重に行動すべきである。"}, {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "✕", "", "", ""]], "b": [["", "", "", "", "▲"], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["▲", "", "", "", ""]], "caption": "②未年8月（③申月）"}, {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "▲", "", ""]], "b": [["", "", "○", "", "▲"], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["▲", "", "✕", "", ""]], "caption": "②未年6月（①午月）"}], "rep": true}, {"label": "丑⑤×・丑⑧×", "board": {"t": "pair", "a": [["", "", "", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "", "", ""]], "b": [["", "", "", "✕", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "【p.64】丑⑤×・丑⑧×の周期は、男女共破壊期であるが、波動の十二支丑と、生年の十二支未とが、冲作用となるから、物事、運気が逆転しやすい暗示の強い周期といえる。特に逆転が生じやすいのが、地数月生まれで、七月未②生まれである。またこれについで一月丑⑧生まれも逆転しやすいので、生活環境と数理環境の合局、支合その他、逆転作用を促す②数に対して⑦数・⑧数に対して③数が姓名数、C波動に形成されてあるかを吟味する必要がある。またC波動戌⑤×の年には、四月辰⑧も逆転しやすい環境になるから、表面だけにとらわれないで、逆転した場合は天数の意味が運命相に表出されてあるかどうかを、よく吟味すること。逆転しない場合は凶性の下降運となる。"}, {"t": "pair", "a": [["", "", "", "○", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "✕", "", "", ""]], "b": [["", "", "", "○", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "✕", "", "", ""]], "caption": "②未年7月（②未月）"}, {"t": "pair", "a": [["", "", "", "○", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "✕", "", "", ""]], "b": [["", "", "", "✕", "▲"], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕▲", "○", "", "", ""]], "caption": "②未年1月（⑧丑月）"}, {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "✕", "", "", "▲"]], "b": [["", "", "", "", "▲"], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕▲", "", "", "", ""]], "caption": "②未年4月（⑧辰月）"}], "rep": true}, {"label": "子④・寅⑨", "board": {"t": "pair", "a": [["✕", "", "✕", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "○", "", ""]], "b": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "子④・寅⑨の周期は、男女共に上昇運である。だが周期初めにC波動⑧×年があるので、次の年から上昇ということになる。さらに上昇運を確実にするのが、波動数の④・⑨金局である。だから前周期で逆転吉化した場合は上昇力が強く、凶運であった人は、その分だけ上昇力が鈍くなる可能性がある。"}], "rep": true}, {"label": "亥③・卯①", "board": {"t": "pair", "a": [["", "✕", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "○", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "亥③・卯①の周期は、いよいよ大クロス期に入る周期であるから、運気は上昇運が続いているが、力が幾分削がれる暗示がある。だから、C波動の⑤×・⑧×の年を注意すべきである。だが⑧×年は男性の場合は木局するので、凶性は緩和されやすいが、【p.65】女性の場合は⑧×作用は男性より強く作用する可能性がある。だが、波動の十二支が木局してるとしても、卯①であるから、卯の場であるH場に①数を置くと、A場はA③となって、H①が破壊されるので、木局吉化の力は弱いと判断しなければならない。だから、木局しているからといって、すぐ吉化すると考えることは誤りで、これらの潜象理をふまえて判断すべきである。だから、女性にとっては、C波動未⑤×は、①・⑤土局すると共に、⑤×が未の場であるG場に回座するから、H場にはH⑥となって、H場でH①×・H⑥の水局となるから、凶性は吉化される可能性が強い。"}], "rep": true}, {"label": "戌②・辰②", "board": {"t": "pair", "a": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "", "", ""]], "b": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "戌②・辰②の周期は、波動数は②・②となっているので、生年②数の原点帰りとなる周期となる。従って十二支は、X形象となって、無い十二支の場であるD場丑に生命エネルギーが流入するので、生年D場にあるD⑤×の作用が、誘発されやすい環境にあることが分かる。だからC波動辰⑤×は、波動の戌・辰の冲を強化するので、吉化されやすい暗示がある。だからといって、そく吉化するというのではないから、読み違えないように、運気とすれば、物事が渋滞気味となりやすい、可能性があると判断すべきである。"}], "rep": true}, {"label": "酉①・巳③", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [[ , "5", "7", "3", "○"], ["▲", "", "", "", ""]], "b": [["▲", "", "", "✕", "▲"], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "○", "", "", ""]], "caption": "②戌年1月（⑧丑月）"}, {"t": "text", "text": "次に生年のA②の作用は、A②はF⑦と火局吸引しやすい潜象理がある反面、A②とD⑤、A②とG⑧×の地数系列に引っ張られやすい習性をもっているので、年月との対応によって、また波動によって、どちらの理が作用するか、そこに分岐点となる気質を潜在にもっているので、この面も見落とさないようにすべきである。"}, {"t": "text", "text": "六月午①数に生まれた人は、生年月の十二支では、戌・午となって、火局の軌道の一部を形成しているので、火性の気質が強いように見えるけれども、火性の意味をもつ⑨数が、J①×・J⑨。H⑨・H⑧を年月対応で形成するから、しかも年月のA①は破壊数でもあるから、A②・A①の潜象にはH⑨・H⑧の理よりも、J①×・J⑨の対応の理が強く作用する暗示があると共に、金気を象徴する⑦数が、年月対応では、【p.69】⑦・F⑥×・G⑧×・G⑦となって、準破壊数となって、金気が弱体化する暗示があるので、火局すれば吉化するとのみ考えると、部分的な意味は読めても、全体の把握が出来づらい難点があるので、部分の解釈にとらわれないように。"}, {"t": "pair", "a": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "▲", "", ""]], "b": [["▲", "", "○", "", "▲"], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": "②戌年6月（①午月）"}], "step2Head": "〔手順２〕波動の流れを把握するためには、波動と十二支、クロス期、冲作用をよく注意する必要がある。", "step2Intro": [], "cycles": [{"label": "戌②・戌②", "board": {"t": "pair", "a": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "", "", ""]], "b": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "戌②・戌② の周期は、生月で②×となっている命質は、運気は弱運となる暗示が強い。また八月③申生まれは、②数は健全で吉数にみえても、年月対応から読めば、J①×・J②となる対応関係をなすから、吉運にみえても、弱運の暗示となる。特にC波動が亥③となる年は、潜在の凶相が表出されやすい年である。他の年月で特に凶相となりやすいのが、九月酉④生まれである。その他の年月は無難な運気といえよう。またこの周期で特に良運となるのが、寅⑥・卯⑦年である。だが五月巳⑨数生まれの人は、二年続けて凶相を帯びた弱運となる暗示が強い。"}, {"t": "pair", "a": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["▲", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["▲", "", "", "", ""]], "b": [["▲", "", "", "", "▲"], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": "②戌年8
