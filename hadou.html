"], ["", "", "", "○", ""]]}, {"label": "12月　④子", "month": 12, "num": "④", "branch": "子", "board": [["✕", "", "✕▲", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", "▲"], ["", "7", "9", "5", ""], ["", "", "○", "", ""]]}, {"label": "1月　⑤丑", "month": 1, "num": "⑤", "branch": "丑", "board": [["", "", "▲", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", "▲"], ["", "8", "1", "6", ""], ["", "○", "", "", ""]]}], "step1Head": "〔手順１〕座標となる生年月の対応数理と、十二支との関係を読む。", "step1": [{"t": "text", "text": "まず最初に考えなければならない点は、「子」は寒冷の冬の季質を内包しているので、陰性が強く、内向型となりやすい気質が強く作用するが、冬の寒冷を象徴するF場には、春の季質を内包している③数があり、A場にはA⑦の秋の季質を内包してい【p.217】る⑦数とが反発するので、陰陽の調和が不安定となりやすい傾向がある。"}, {"t": "text", "text": "また温熱の気を無意識に求める潜在性が作動しても、夏の温熱の季質を内包している⑨数が、C⑨×となっているだけでなく、⑨数の原点であるE場には、E②×があるが、質とすれば、②・⑦火局の理はあるのだが、一気には合局しづらい傾向がある。だからA場のA⑦の秋季の理が作用して、収縮、畏縮しやすい心情になりやすい暗示が作用するところがある。だが、生月によって変質が起こることもある。"}, {"t": "text", "text": "年月対応から、この基本の潜象理の在り方を生月に求めると、十一月初冬の亥③数月は、A場がA⑦・A③で反発しやすく、言動が動揺しやすく、感情面にムラが生じやすい暗示がある。たとえ、E②×・E⑦が合局し、火気を求めようとしても、冬の季質があるので、凍てついた土質としてのE②×なので、季質として、春から夏の季を迎えなければ、たとえ、E②×・E⑦とあっても、すぐ火局しづらい暗示がある。だから、言動が動揺するのは、外向的に変換しようとも、行動を象徴するH場にH①×。交流を象徴するJ場にJ②×となって、年月ともに②×となっているから、なかなか火局しづらい潜象理の在り方をよく暗示しているようだ。"}, {"t": "pair", "a": [["▲", "", "✕", "", ""], ["", "6", "2", "4", ""], ["▲", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", ""]], "b": [["", "✕", "▲", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", "▲"], ["", "6", "8", "4", ""], ["", "", "", "○", ""]], "caption": "⑦子年11月（③亥月）"}, {"t": "text", "text": "これに対して、春二月寅③数の場合は、寅は春の季質をもつと同時に、火局軌道に【p.218】あるので、潜勢力は必然的にE場のE⑦に作用するから、E②×の凍てついた土質の②×も、ようやく火局しやすい、温暖の気をもつが、行動化を象徴するH場がH⑤・H①×となって閉ざされているので、水温む様相となってはいても、まだ流水となりづらい潜象理を内包しているので、感情が不調和となりやすい暗示がある。"}, {"t": "pair", "a": [["", "", "✕", "", "▲"], ["", "6", "2", "4", ""], ["▲", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", ""]], "b": [["", "", "▲", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", "▲"], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": "⑦ の周期とクロス期を形成するので、物事が反転しやすい暗示もある。だから⑨×年は要注意。"}], "rep": true}, {"label": "酉④・酉①", "board": {"t": "pair", "a": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "酉④・酉①の周期は、生年の卯と冲をなすから、運気の転換をなす重要な周期で、【p.231】男女共に吉運である。特に男性の場合は、波動が酉④であるから、生年のC⑨×性が緩和吉化されるので、今まで吉運が来ても低迷型を余儀なくしていた人は、周初めの酉④数年をもって、吉化されると共に、環境も明るさを取り戻し、上昇気配が感じられる、運命の大転換期を暗示する。女性は吉運ではあるが鈍いので、横バイ型となりやすいが、不安定要因を内包しているので、⑨×年は慎重を要す。"}], "rep": true}, {"label": "戌⑤・申⑨×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "8", "4", "6", "○"], ["", "7", "9", "2", ""], ["✕", "3", "5", "1", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "戌⑤・申⑨×の周期は、男性は吉運となる。ただし、⑤数が準破壊または生月で⑤×となる人は、弱含み横バイ型となりやすい。"}, {"t": "text", "text": "女性は⑨×期だから、運気下降の暗示があるので、周半ばの中年から低迷気配となりやすい暗示がある。"}], "rep": true}, {"label": "亥⑥・未⑧", "board": {"t": "pair", "a": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "b": [["", "", "", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "亥⑥・未⑧の周期は、十二支が三合木局するので、男女共に吉運である。だが男性の十二支は亥で、冬の季質を内包しているから、上昇力は鈍るので、周前半は弱含みで推移するが、周初めの亥⑨×は緩和吉化される暗示がある。だから、周半ばの、卯④数年をキッカケに吉化の度合が強まり、上昇気配となる暗示がある。女性は吉運上昇型となり、亥⑨×年も吉化される暗示がある。"}], "rep": true}]}, {"id": 26, "num": "⑦", "numVal": 7, "branch": "午", "title": "⑦数午年の読み方", "headingRaw": "【p.232（本文なし）】【p.233】⑦数午年の読み方", "page": 233, "cycleText": "生年数⑦……七年周期（補助周期なし）", "male": {"head": "男性の場合（午年）破壊数は③×・⑨×", "jun": "7午→8未→9×申→1酉→2戌→3×亥→4子→5丑→6寅→7卯……", "gyaku": "7午→6巳→5辰→4卯→3×寅→2丑→1子→9×亥→8戌→7酉……"}, "femal ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "caption": ""}, "items": [{"t": "text", "text": "卯⑦・巳⑨×の周期は、十二支が陽性を帯びているので、男性は吉運で、上昇気配はあっても、B⑨×・B⑧の対応があるので、弱運上昇低迷となりやすい暗示がある。女性は巳⑨×で凶運ではあるが、巳⑨といえば、午月①数の理が潜象に作用するので、⑨×性は弱いとみなければならない。むしろ、生月いかんでは、凶変じて吉となりうる要素も含まれた周期だから、吉凶が混在し、動揺しやすい低迷期といえよう。だから、男女共に、⑨×は要注意【p.264】で特に女性は凶性を誘引しやすい暗示がある。辰②×年は男性は緩和吉化しやすい暗示があるが、生月によっては凶性の作用をうける可能性もみられる。別言すれば、ここまでの周期では、男女に関わらず、パットしない、不安定な運気を背負った周期が続いているといえよう。"}, {"t": "pair", "a": [["", "", "", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "▲", "", ""]], "b": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["▲", "", "✕", "", "▲"]], "caption": "⑧辰年6月（①午月）"}], "rep": true}, {"label": "寅⑥・午①", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "寅⑥・午①の周期は、十二支が火局軌道を形成し、波動数が水局しているので、水火合一の理が働き、男女共に青年期に向かっての吉運上昇型の周期となる暗示がある。また、補助波動がクロス期を形成し、十二支が水局しているので、上昇気運の到来といえるようだ。だから、亥⑨×・丑②×年の凶性は、緩和される可能性があるから、上潮の中に小さな部分的修正の下潮の意味がある。ただし、生月いかんでは、弱含み上昇型となるか、吉運低迷型となる暗示もある。なぜかといえば、C波動が主波動の火局軌道の陽性を補佐する力が弱く、周期前半は秋から冬へ向かった季質と、水局の陰性が強く作用するからである。また周期後半も冬から春へと向かっているが、力不足の感がみられるからである。"}], "rep": true}, {"label": "丑⑤・未②×", "board": {"t": "pair", "a": [["", "", "", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "", "", ""]], "b": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "丑⑤・未②×の周期は、主波動の丑・未が冲となり、補助波動の戌は生年辰と冲をなすと共に支のクロス期の中核を形成するので、運命変換期となりやすい暗示がある。"}, {"t": "text", "text": "【p.265】男性の主波動が丑⑤ということは、表面は吉運にみえても、潜象理とすれば、D⑤の意味が作用し、A②の意味が作用するので、不安定な動揺横バイ型となる可能性がある。特に周期後半が低迷動揺型の暗示がある。女性は夏の季質を帯びているので、また冲作用が働くので、緩和吉化しやすい要素も基層に内生する暗示があるので、生月いかんでは、凶性が緩和し、未②の意味から、A⑤となる場合とが考えられるので、周期前半はC波動の夏へ向かっての陽性により、吉運横バイ型となる可能性がみられるが、後半は低迷型となりやすく、運気も弱体化しやすい暗示がある。男女共に⑨×年と②×年を要注意。"}], "rep": true}, {"label": "子④・申③", "board": {"t": "pair", "a": [["✕", "", "✕", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "○", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "子④・申③の周期は、三合水局となるので、運気は男女共に大きな変化がみられない、横バイ型の吉運推移の暗示がある。だが、周期後半は弱いけれども、上昇気配となるので、上向における動揺が生じやすい暗示がある。だから⑨×年、②×年を要注意。"}], "rep": true}, {"label": "亥③・酉④", "board": {"t": "pair", "a": [["", "✕", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "○", ""]], "b": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "亥③・酉④の周期は、男女共に吉運上昇型となるが、男性は冬の季質があるので、またC波動も秋から冬、春へ向かう程度の季の推移だから、上昇型といっても小型の暗示がある。男女共に⑨×年を注意。"}], "rep": true}, {"label": "戌②×・戌⑤", "board": {"t": "pair", "a": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "戌②×・戌⑤の周期は、生年の辰と冲をなすので、また補助波動も周期前半は辰と【p.266】なっているから、主波動の戌とも相互に冲となっている暗示からみれば、物事が反転しやすい周期といえよう。だが前半の十二支の推移は辰から未の夏の季質が強いから、たとえ男性は戌②×期であっても、周初めの辰②×年の凶性を境として、緩和吉化される暗示がある。だが後半は秋から冬へ向かう季質となっているので、動揺、不安定の様相を呈しやすい暗示がある。ただし⑦数月生まれの男性は、②×作用は吉化される暗示がある。だが、子月の⑦数は弱運横バイ型となりやすい暗示がある。女性は前半は吉運は強く、後半は弱運化しやすい。"}, {"t": "pair", "a": [["", "", "", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "", "", "▲"]], "caption": "⑧辰年3月（⑦卯月）"}, {"t": "pair", "a": [["", "", "▲", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "○", "", "▲"]], "caption": "⑧辰年12月（⑦子月）"}], "rep": true}, {"label": "酉①・亥⑥", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "酉①・亥⑥の周期は、波動数が水局するので、運気も安泰で、大きな動揺はなく、男性は上昇吉運型となりやすいが、⑦数月生まれの人は、不安定低迷型となる暗示があり、特に卯月生まれの人は、反転が生じやすい暗示がある。周期前半の丑②×年は緩和吉化される可能性がある。"}, {"t": "pair", "a": [["", "", "", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "", "", "▲"]], "caption": "⑧辰年3月（⑦卯月）"}, {"t": "pair", "a": [["", "", "▲", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "○", "", "▲"]], "caption": "⑧辰年12月（⑦子月）"}, {"t": "text", "text": "女性は上昇吉運型ではあるが、主波動の十二支が冬型となっているので、上昇力は弱体化されるから、上昇型といっても、横バイ低迷型に近い、安泰型といえよう。だが、周期後半は上昇力がやや上向き加減に強まる暗示がある。だが、十二月⑦数生まれの人は、低迷横バイ型となりやすい暗示がある。"}, {"t": "pair", "a": [["", "", "▲", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "○", "", "▲"]], "caption": "⑧辰年12月（⑦子月）"} "num": "④", "branch": "酉", "board": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["▲", "", "", "", ""]]}, {"label": "10月　⑤戌", "month": 10, "num": "⑤", "branch": "戌", "board": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["▲", "", "", "", ""]]}, {"label": "11月　⑥亥", "month": 11, "num": "⑥", "branch": "亥", "board": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["▲", "", "", "○", "✕"]]}, {"label": "12月　⑦子", "month": 12, "num": "⑦", "branch": "子", "board": [["", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "○", "", ""]]}, {"label": "1月　⑧丑", "month": 1, "num": "⑧", "branch": "丑", "board": [["", "", "", "✕", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕▲", "○", "", "", ""]]}], "step1Head": "〔手順１〕座標となる生年月の対応数理と、十二支との関係を読む。", "step1": [{"t": "text", "text": "まず最初に考えなければならない点は、「未」は晩夏の季質を内包していると共に、木局軌道にある十二支だから、潜在には内向気質が希薄で、外向気質が強い性情があるので、物事の分岐点、変換点に引くことができづらい性情が見られる。だから内よ【p.269】りも表面にとらわれやすい暗示がある。"}, {"t": "text", "text": "表面にとらわれやすい性情はどこで醸成されるかといえば、A⑧はE③へ向かって吸引され、木局化しようとする潜象理があることと、未の場にあるG⑤にも吸合しようとする、同質の潜象理があるので、A⑧が木局化してA③に反転すれば、G⑤の場にG⑨の意味が変生して、自己中心型となりやすい面と、A⑧そのものがG⑤と融合しようとして、未の場であるG⑧に変移した場合は、A場はA②の作用を誘引することになって、A⑧そのものが破壊性を帯びて、⑧数が象徴する変革、変転、反転、乗り変わりを意味する物事、時期の把握を誤りやすく、外部環境に流されて内部環境とが不調となりやすい暗示がある。"}, {"t": "text", "text": "またD②×性を誘発した場合は、自分自身の管理能力が低下し、物事に対して、細部にとらわれ、考えが堂々巡りしやすい性情が表出されやすい面を潜在に内包しているが、環境的に良い場合は陽性が強く作用し、陰性の気質は影を潜め、外向的な陽性の強さが表出されやすい面がみられる。"}, {"t": "text", "text": "この陽性の外向型気質が強く誘発されてくるのが、木局軌道にある卯月⑦数生まれか夏へかけての生月で、同質の未②数月生まれの場合は、陽変じて陰を生む理が生じ、【p.270】外向性と内向性のアンバランスが生じやすい気質となっているのが分かる。別言すれば、A⑧・A②が変換された潜象理の在り方を暗示しているのが、B⑨・B⑧の対応であり、明の中の強を象徴しているようだ。これに反して、暗の中の混乱と低迷化を象徴しているのが、A⑧がG⑧×となってG⑤と対応し、A⑧はD②×が内在して対応し、G⑤がD⑤×となって、D②×・D⑤×となっている数理が、よくその不調和の在り方、片寄りの潜象をよく暗示しているといえよう。"}, {"t": "pair", "a": [["", "", "", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", ""], ["✕", "✕", "", "", ""]], "b": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "", "", ""]], "caption": "⑧未年3月（⑦卯月）"}, {"t": "pair", "a": [["", "", "", "○", "▲"], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕▲", "✕", "", "", ""]], "b": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["▲", "✕", "", "", ""]], "caption": "⑧未年7月（②未月）"}, {"t": "text", "text": "これに反して、亥⑥月の場合は、木局であっても冬の季質があるので、A⑧は陰性を帯びて、未の熱気を抑えて、陽と陰との調和がとれ、A⑧・A⑥と、C①・C⑧とが、X型に水局化しているので、A⑧そのものが内向性を帯びることを暗示する。また同数月となる春寅月の場合は、寅の場に陽気が強まり、D②×が逆転して、⑨数の意数を強めている。だが亥月の場合は、B⑦×となって、火気のB⑨の熱気がB⑦×によって欠ける暗示を象徴しているようだ。"}, {"t": "pair", "a": [["▲", "", "", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "", "", "▲"]], "b": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["▲", "", "", "○", "✕"]], "caption": "⑧未年11月（⑥亥月）"}, {"t": "pair", "a": [["", "", "", "○", "▲"], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "", "", "▲"]], "b": [["", "", "", "", ""], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["▲", "", "", "", "✕"]], "caption": "⑧未年2月（⑥寅月）"}], "step2Head": "〔手順２〕波動の流れを把握するためには、主周期の波動で掴み、十二支、クロス期、冲作用をよく注意し、補助波動を参考にする必要がある。", "step2Intro": [], "cycles": [{"label": "未⑧・未⑧", "board": {"t": "pair", "a": [["", "", "", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "", "", ""]], "b": [["", "", "", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "【p.271】未⑧・未⑧の周期は、男女共に吉運上昇型の運気で安泰ではあるが、周期後半は吉運上昇波が鈍る暗示がある。だから、C波動の戌②×年と、丑⑤数年は上昇波の中の小休止的な低迷年となりやすい可能性がある。特に生月で⑧×となる人は、動揺、不安定因子を内包しているので要注意。"}], "re "8", "1", ""], ["", "2", "4", "9", ""], ["✕", "✕", "", "", "▲"]], "b": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["▲", "", "", "○", "✕"]], "caption": "⑧未年11月（⑥亥月）"}], "rep": true}, {"label": "巳⑥・酉①", "board": {"t": "pair", "a": [["", "○", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "✕", "✕"]], "b": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["✕", "8", "1", "3", "○"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "巳⑥・酉①の周期は、十二支が金局し、波動数が水局しているので、幼児期から続いた吉運が、ようやく小山を形成し、安定化する周期だから、大きな波立ちはなく、【p.272】上方横バイ型となる暗示がある。ただし、男性に比べて女性の運気は、吉運ではあるが、秋の季質があるので、外部環境と内部環境とが陰性化に向かっているから、安泰横バイ型となりやすい暗示がある。ただし、⑦数月生まれの人は凶性を誘発しやすい、不安定要素をもっているので、横バイ低迷型となりやすい暗示がある。辰②×年は注意。"}, {"t": "pair", "a": [["", "", "", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", ""], ["✕", "✕", "", "", ""]], "b": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "", "", ""]], "caption": "⑧未年3月（⑦卯月）"}, {"t": "pair", "a": [["", "", "▲", "○", ""], ["", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", ""], ["✕", "✕", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "○", "", ""]], "caption": "⑧未年12月（⑦子月）"}], "rep": true}, {"label": "辰⑤・戌②×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "", "", ""]], "b": [["", "", "", "", "✕"], ["✕", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "○"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰⑤・戌②×の周期は、十二支が冲となっているので、ようやく運気変転の動揺期に入ったことを告げている。男性は吉運ではあるが、生年のD②×を誘発しやすいので、弱運横バイ型か、または低迷型となる可能性がある。特に周期後半が運気が鈍りやすい暗示があるので、丑②×年は要注意。女性は男性の吉運とは反対に、下降波瀾含みの、渋滞低迷型となりやすい暗示があり、特に周期後半の②×年は要注意。ただし周期終わりの寅③数年をもって、凶変 の対応数理と、十二支との関係を読む。", "step1": [{"t": "text", "text": "まず最初に考えなければならない点は、「戌」は晩秋の季質を内包していると共に、火局軌道にある十二支だから、潜在には陽性を帯びた外向志向型の気質があるから、外部環境の内向型の気質とが相互に攻めぎ合う、反発型の気質が誘発されやすい面も【p.276】同時に合わせもっているといえよう。"}, {"t": "text", "text": "戌⑧数年に対して、十月の戌⑤数月を対応させてみると、生年のA⑧数が生月ではD⑧となって、生年のD②×となっていることは、何を象徴しているかといえば、D②×はB⑨の火気が変換されて破壊数となっていることは、火気による熱気の消滅を象徴しているといえよう。そのD②×とA⑧が変移してD②×・D⑧となっていることは、A⑧の意味する理が、機能しなくなって、稔りが完了して、落葉ないしは落果する乗り変わりの意味を暗示しているようだ。この自然の移り変わりの理をさらによく暗示しているのが、秋を象徴するC場において、秋を象徴する⑦数が、C①・C⑦と対応していることは、秋の終末における収縮を暗示している意味をよく証しているようだ。また、A⑧・A⑤の対応を数読してみると、このA場の命質が変換して外部に表出しようとする無意識の変革理は、発出の門戸であるH場において、H⑥・H③となって生月のA場が互換している数理によって、抑圧された潜象理が、姿を変えて吹き出ることを暗示しているのである。だから、生月のD⑧がH③と合局吉化しようとして、誘引しようとする潜象理が作用するのも、この理が構築されているからである。"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["▲", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["▲", "", "", "", ""]], "caption": "⑧戌年10月（⑤戌月）"}, {"t": "text", "text": "この潜象理に対して、三合火局の軌道の理を対比して検討【p.277】してみれば、春二月の寅⑥数月は、秋十月の戌⑤数が反転した形象を示していることが分かる。従って、寅の場であるD場には、生年のD②×が新生の陽気を享けて蘇り、D⑨の暖気に変換され、A⑧は活動機能を象徴するA⑥となっているのは、戌月のA⑤が変換してA⑥となっていることを暗示している。別言すれば春の気質によって、抑圧を象徴するA⑤が、回転化を象徴するA⑥になったといえよう。だが、まだ潜在的には秋の冷質が一部残存していることを暗示しているのが、A①・A⑧の対応である。"}, {"t": "pair", "a": [["", "", "", "", "▲"], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", "▲"]], "b": [["▲", "", "", "", ""], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["▲", "", "", "", "✕"]], "caption": "⑧戌年2月（⑥寅月）"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["▲", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["▲", "", "", "", ""]], "caption": "⑧戌年10月（⑤戌月）"}, {"t": "text", "text": "これに対して、午月の夏の火気からみると、E場の熱気を帯びたE③・E⑤が、変換されて発出される理を暗示しているのが、H⑥・H⑧である。この潜象理の在り方をズバリ象徴しているのが、生年におけるA⑧・H⑥の配数構造である。"}, {"t": "pair", "a": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "▲", "", ""]], "b": [["▲", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["▲", "", "✕", "", ""]], "caption": "⑧戌年6月（①午月）"}], "step2Head": "〔手順２〕波動の流れを把握するためには、主周期の波動で掴み、十二支、クロス期、冲作用をよく注意し、補助波動を参考にする必要がある。", "step2Intro": [], "cycles": [{"label": "戌⑧・戌⑧", "board": {"t": "pair", "a": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "戌⑧・戌⑧の周期は、秋の収縮型の理があり、また火局性による膨脹型の、陰性化と陽性化を合わせもっているので、C波動における十二支の推移が、陰性なのか、陽性なのかをよく検討した後で、吉運なのか、凶運なのかの判断をすべきである。"}, {"t": "text", "text": "【p.278】周期前半はC波動における十二支が、戌年から冬へ向かっているので、男女共に弱運横バイ型となる暗示がある。だが春から夏の午月までに生まれた人は、吉運横バイ型となる可能性がある。だが、戌月から冬に生まれた人は低迷型となりやすい暗示がある。特に丑②×年は男女共に要注意年である。"}, {"t": "pair", "a": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "▲", "", ""]], "b": [["▲", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["▲", "", "✕", "", ""]], "caption": "⑧戌年6月（①午月）"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["▲", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["▲", "", "", "", ""]], "caption": "⑧戌年10月（⑤戌月）"}, {"t": "text", "text": "周期後半は男性は弱含みが続くけれども、女性は徐々に活力が出て、吉運横バイから、上昇気配が感じられる、上方指向型となる暗示がある。"}], "rep": true}, {"label": "酉⑦×・亥⑨", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["✕", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "b": [["", "✕", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", ""]], "caption": ""}, "items": [{"t": "text", "text": "酉⑦×・亥⑨の周期は、男性は⑦×期なので、運気は下降型の弱運低迷型となりやすい暗示がある。だが十二支は酉なので、またC波動は午から酉までが周期前半となって、後半が戌②×年から丑年となっているので、むしろ後半の運気が凶性を誘引しやすい暗示がある。だから②×年から下降気配が出てくるといえよう。特に生月で⑦×か、年月対応で⑦数が凶性と対応した人は、下降における凶性の影響を受けやすい。これに対して女性の場合は吉運上昇型ではあるが、波動数が亥⑨なので、A⑧の原点の作用が潜在で働くから、⑦数月生まれの人は弱含み横バイ型となる暗示がある。子月生まれの人は低迷型となりやすい。また周期後半が弱運となる。要注意年は⑦×年、②×年である。"}, {"t": "pair", "a": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["▲", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "", "", ""]], "caption": "⑧戌年3月（⑦卯月）"}, {"t": "pair", "a": [["", "", "▲", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["▲", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "○", "", ""]], "caption": "⑧戌年12月（⑦子月）"}], "rep": true}, {"label": "申⑥・子①", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "✕", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "【p.279】申⑥・子①の周期は、十二支も波動数も水局となっているので、吉運横バイ型となりやすい。男女共に申月の人は低迷型となりやすく、女性は⑦数月の人が低迷型となりやすい暗示がある。また、男女共に⑦×年で凶性を誘発しやすいのが⑦数月生まれの人である。②×年は男女共に生月で②×をもつ人は、特に要注意。"}, {"t": "pair", "a": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["▲", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕▲", "", "", "", ""]], "b": [["▲", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["▲", "", "", "", ""]], "caption": "⑧戌年8月（③申月）"}, {"t": "pair", "a": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["▲", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "", "", ""]], "caption": "⑧戌年3月（⑦卯月）"}, {"t": "pair", "a": [["", "", "▲", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["▲", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "○", "", ""]], "caption": "⑧戌年12月（⑦子月）"}], "rep": true}, {"label": "未⑤・丑②×", "board": {"t": "pair", "a": [["", "", "", "○", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "✕", "", "", ""]], "b": [["", "", "", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "未⑤・丑②×の周期は、男性は弱含み吉運であるが、女性は②×期ではあるが、十二支が冲となっているので、生年の原点にあるD②×を誘発しやすい暗示がある。ただし⑦数月生まれの人は緩和吉化されるので、弱含み吉運横バイ型となる暗示がある。男女共に注意すべき年は、子⑦×年で、生年にある②×・⑦×の凶性の影響を受けやすい年である。辰②×年は緩和される暗示がある。"}, {"t": "pair", "a": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["▲", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "", "", ""]], "caption": "⑧戌年3月（⑦卯月）"}, {"t": "pair", "a": [["", "", "▲", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["▲", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "○", "", ""]], "caption": "⑧戌年12月（⑦子月）"}], "rep": true}, {"label": "午④・寅③", "board": {"t": "pair", "a": [["✕", "", "○", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "✕"], ["✕", "1", "3", "5", ""], ["○", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "午④・寅③の周期は、十二支が三合火局するので、男女共に本格的な吉運上昇型となるが、男性は前周期の後半から徐々に上昇気配が強まっていたので、周期初めの午④数年は強く吉性が作用する年である。女性もこの午④数年から上昇が初まる暗示がある。従って、⑦×年・②×年は緩和されるが、②×年は周期後半の冬期に当たるので、緩和の力が弱体化するだけでなく、補助波動は大クロスの後期入りする境界の分岐年であり、主波動もクロス期の分岐年となるから、動揺が生じやすい年でもあるので、【p.280】特に要注意年である。また周全体からみれば、後半の戌⑧数年を境として、上潮の速度が鈍る可能性がある。別言すれば、上昇後の横バイといえよう。"}], "rep": true}, {"label": "巳③・卯④", "board": {"t": "pair", "a": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "b": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["○", "2", "4", "6", "✕"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "巳③・卯④の周期は、男女共に前周期の上昇路線にあるので、吉運である。だが上昇の高嶺圏にあるから、油断が生じやすい心理となりやすいので、自ら凶性を誘引、または誘発しやすいので、慎重に対処すべき周期といえよう。従って、前周期の終わりにある丑②×年に自ら凶性の種子を蒔いた人は、今周期はその影響で上昇が弱体化して、低迷型に失速する振れ現象が起きやすい暗示があるので、男女共に慎重に。特に男女共に⑨数月生まれの人は、午⑦×年は要注意である。"}, {"t": "pair", "a": [["", "", "▲", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", "▲"]], "b": [["▲", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["▲", "", "", "✕", ""]], "caption": "⑧戌年5月（⑨巳月）"}], "rep": true}, {"label": "辰②×・辰⑤", "board": {"t": "pair", "a": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["○", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "✕"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰②×・辰⑤の周期は、生年の戌と冲となるから、運命の転換期となりやすい暗示がある。"}, {"t": "text", "text": "波動数からみると、②×となる男性は凶性であり、生年のD②×を誘発する凶運期の下降とみられやすいのだが、生年の戌は秋の気質があり、波動の辰は春の季質であり、陽性を帯びていることと、冲となっているということは、反転、変換する暗示があるので、凶変じて吉となる理も潜在に作用していると判断しなければならない。また補助波動をみても、前半は戌であるから、波動も相互に冲作用を起こす要因がある【p.281】ので、周期の前半初めの戌②×年をもって反転、変換が生じ、前半は凶性が作用し渋滞気運の低迷型となるが、周期後半の卯⑦×年を境として、凶性は吉化して上昇型に変質する可能性を秘めている。ただし、卯⑦数月に生まれた人は、吉化する度合が強い暗示があるので、⑦×年は吉凶の振り分けだから要注意。"}, {"t": "pair", "a": [["", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", "▲"], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]], "b": [["▲", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["▲", "", "", "", ""]], "caption": "⑧戌年3月（⑦卯月）"}, {"t": "text", "text": "女性の場合は吉運であるが、十一月亥⑥数月生まれの人は、J⑤×とJ⑦×と対応する凶性を誘引するので、弱含み低迷型となりやすい暗示がある。②×年・⑦×年を注意する必要がある。特に周初めの戌②×年は要注意。"}, {"t": "pair", "a": [["▲", "", "", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", "▲"]], "b": [["▲", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["▲", "", "", "○", "✕"]], "caption": "⑧戌年11月（⑥亥月）"}], "rep": true}, {"label": "卯①・巳⑥", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "○", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "✕", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "卯①・巳⑥の周期は、波動数が水局しているので、吉運ではあっても、弱含み吉運の暗示が強い。周期前半の未②×年は、男性の場合、波動の卯と木局軌道を形成するので、凶性は緩和吉化される暗示がある。だが、後半の子⑦×年は要注意。周期内の運気も後半は弱含みとなりやすい。"}, {"t": "text", "text": "女性の場合は吉運で安泰期のように思われるが、波動巳⑥ということは、波動のA場に作用する潜象理は、A⑦の理があるので、弱含み吉運低迷型となりやすい。だから②×年と⑦×年は要注意である。また周前半より後半の方が弱運となりやすい。"}], "rep": true}]}, {"id": 32, "num": "⑨", "numVal": 9, "branch": "寅", "title": "⑨数寅年の読み方", "headingRaw": "【p.282（本文なし）】【p.283（本文なし）】【p.284（本文なし）】【p.285（本文なし）】【p.286】⑨数寅年の読み方", "page": 286, "cycleText": "生年数⑨……九年周期（補助周期三年）", "male": {"head": "男性の場合（寅年）破壊数は④×・⑥×", "jun": "9寅→1卯→2辰→3巳→4×午→5未→6×申→7酉→8戌→9亥……", "gyaku": "9寅→8丑→7子→6×亥→5戌→4×酉→3申→2未→1午→9巳……"}, "female": {"head": "女性の場合（寅年）破壊数は④×・⑥×", "jun": "9寅→8丑→7子→6×亥→5戌→4×酉→3申→2未→1午→9巳……", "gyaku": "9寅→1卯→2辰→3巳→4×午→5未→6×申→7酉→8戌→9亥……"}, "note": "（月の盤の▲は、生年の盤の破壊の場に重なる所）", "yearBoard": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", ""]], "months"  "子", "board": [["", "", "✕▲", "", "▲"], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]]}, {"label": "1月　②丑", "month": 1, "num": "②", "branch": "丑", "board": [["", "", "▲", "✕", "✕▲"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]]}], "step1Head": "〔手順１〕座標となる生年月の対応数理と、十二支との関係を読む。", "step1": [{"t": "text", "text": "まず最初に考えなければならない点は、「寅」は初春の季質を内包しているので、今まで寒冷の冬によって凍てついた大地に閉じこめられた生命が、自然の運行の巡りによって春を迎え、水温む季節に誘われて、内奥より外へ向かって発芽する理と同じ命【p.287】質があるので、陰性の内向型から陽性の外向型気質に変換する潜象理をもっている。"}, {"t": "text", "text": "この陰性から陽性に変換し、発展軌道に押し上げる潜勢力はどこにあるかといえば、十二支の寅は三合火局の軌道の一端に位置して、内奥において火気に変換される理を寅⑨数が象徴しているようだ。"}, {"t": "text", "text": "別言すれば寅の場はD場が原位置で、そのD場の気質を象徴しているのがD⑧数であるが、春の季を迎えることによって、D⑧はD③に反転し、春の季質を内包するといえよう。だが春を象徴するH場には、堅固の意味と、収縮型の秋の季質を逆投影したH⑦数があるので、堅い地殻を打ち破って一気に伸びるには、暖風としての熱気が不足している理を暗示しているのが、E④×であり、このE④×が変換し変移しているのがH⑦数である。"}, {"t": "text", "text": "だから、春の暖気が旺じてくると、二月寅と三月卯を比較すれば分かるように、H⑦・D③がH⑧・D④となって、X型に互換し、かつ変換しているのが分かる。また二月のA⑨が三月ではA①が回座することによって、交流の場であるJ⑨に変移していることは、また基層に冷気が残存しているようにみえるのだが、生年のA⑨と生月のA①との対応によって、気の交流が陽性の①数に反転したことを証しているのである。"}, {"t": "pair", "a": [["", "", "✕▲", "", "▲"], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", ""]], "b": [["", "", "✕▲", "", "▲"], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", ""]], "caption": "⑨寅年2月（⑨寅月）"}, {"t": "pair", "a": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", "▲"], ["○", "3", "5", "1", ""], ["", "", "▲", "", ""]], "b": [["", "", "▲", "", "▲"], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": "⑨寅年3月（①卯月）"}, {"t": "text", "text": "【p.288】また、夏の季質を帯びる午④数月は、火気が夏の熱気と熱風のA④の象意によって、燃え上がる意と、熱気を押さえ、緩和する意味を暗示しているのが、E⑤・E⑨×であることが数的に読める。"}, {"t": "pair", "a": [["▲", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "▲ caption": ""}, "items": [{"t": "text", "text": "卯①・丑⑧の周期は、男女共に吉運ではあるが、女性は弱含み横バイ型となりやすい暗示がある。男性の人で低迷動揺型となりやすいのが、五月生まれ、八月生まれの人である。だからC波動で特に凶性を誘引しやすい年が子①数年である。また寅③数年も注意すべきである。卯④×年は特に要注意である。その意味では、巳⑥×年までは低迷期が続きやすい暗示がある。女性で特に弱運低迷型となりやすい人が、生月で⑧×となっている人、準破壊となる人は凶性を誘発しやすいので、④×年と⑥×年は要注意である。だが巳⑥×年は波動丑と金局軌道を形成するので、凶性は緩和される暗示がある。また周期全体を通読すると、周半ば頃から運気が波立ち初め、吉凶が一年毎【p.290】に繰り返しながら、男性は上昇気運が高まり、女性は吉運横バイ型から、少しずつ上昇気運となるが、周半ばまでは力不足で、巳⑥×を分岐点として上方指向となる暗示がある。だから、⑥×年は緩和吉化される暗示もあるが、完全に吉化はされないので、多少の動揺はあるとして注意すべきである。"}, {"t": "pair", "a": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["▲", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", "▲"]], "b": [["", "○", "▲", "", "▲"], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "caption": "⑨寅年5月（③巳月）"}, {"t": "pair", "a": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["▲", "", "", "", "▲"]], "b": [["", "", "▲", "", "▲"], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "caption": "⑨寅年8月（⑥申月）"}], "rep": true}, {"label": "辰②・子⑦", "board": {"t": "pair", "a": [["", "", "", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", ""]], "b": [["", "", "✕", "", ""], ["", "6", "2", "4", ""], ["", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "○", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "辰②・子⑦の周期は、十二支は水局となり、波動数は火局するので、男性は上昇型となるが、女性は波動数⑦によって生年⑨数が破壊されるから、また十二支も真冬型の子のうえに、水局しているので、低迷型横バイとなる暗示がある。だが、年月対応で⑦数が準破壊となる人、生月に⑦×をもつ人は、運気渋滞し、下降指向型の低迷となりやすい暗示がある。だから、④×年と⑥×年は要注意となり、次の⑦数年も要注意が続く低運年となる暗示がある。"}], "rep": true}, {"label": "巳③・亥⑥×", "board": {"t": "pair", "a": [["", "○", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", ""]], "b": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "巳③・亥⑥×の周期は、十二支が冲となっているので、男女共に反転が起きやすい周期といえる。この変調を象徴するかのように、補助波動においても、周前半の三年間が主波動の巳・亥の冲と同じ十二支冲となっており、周半ばの三年間が補助波動数が反転しているので、主波動にその影響を与える暗示がある。"}, {"t": "text", "text": "運気は男性は吉運ではあるが、生年⑨数が波動数③によって、G⑥×と対応するの【p.291】で、また波動数巳③ということは、波動のA場に作用するのはA④となり、A④は生年のE④×であると共に、A④によって、波動③数はJ③×となる潜象理が作動するから、吉運ではあっても不安定で動揺し、反転しやすい暗示がある。なぜかといえば、波動における巳③は潜在ではJ③×に該当する理が作用するのだが、生年のJ場にはJ⑧があって、木局吉化される暗示もあり、巳③によってA場に作用するA④は、生年との対応ではE④×ではあっても、生年A⑨と金局吉化される要因があるからである。だが、緩和吉化されるまでが多少不安定となることは避けられない。そこに動揺を生じる要素があるといえよう。"}, {"t": "text", "text": "女性は凶運期だから、低迷下降型となりやすいので、特に④×と⑥×年を要注意。また周期全体の運気は前半は弱含み吉運で横バイとなるが、周半ば頃から低迷型となり、後半から下降型となりやすい暗示がある。この傾向は男性も同じだから、④×・⑥×年を注意。"}], "rep": true}, {"label": "午④×・戌⑤", "board": {"t": "pair", "a": [["✕", "", "○", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "午④×・戌⑤の周期は、十二支が火局するので、男性の④×は吉化する可能性がある。その意味では吉運化する暗示が強い。ただし④数月生まれの人は凶運を併発するので、吉凶の動揺不安定が生じるので、低迷型となりやすい。⑦数月生まれもこれに準じ【p.292】た弱含みの運気といえる。だから④×・⑥×年を注意する必要がある。女性は吉運上昇型となる暗示がある。ただし、①数月生まれの人は、低迷不安定型となりやすい。だから④×年、⑤数年、⑥×年、⑦数年を特に要注意。"}, {"t": "pair", "a": [["▲", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "▲", "", ""]], "b": [["✕", "", "○▲", "", "▲"], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "caption": "⑨寅年6月（④午月）"}, {"t": "pair", "a": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["▲", "7", "9", "2", "▲"], ["○", "3", "5", "1", ""], ["", "", "", "", ""]], "b": [["", "", "▲", "", "▲"], ["", "6", "2", "4", ""], ["✕", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "caption": "⑨寅年9月（⑦酉月）"}, {"t": "pair", "a": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", "▲"], ["○", "3", "5", "1", ""], ["", "", "▲", "", ""]], "b": [["", "", "▲", "", "▲"], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "caption": "⑨寅年3月（①卯月）"}, {"t": "pair", "a": [["", "", "✕▲", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "▲", "", ""]], "b": [["", "", "✕▲", "", "▲"], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]], "caption": "⑨寅年12月（①子月）"}], "rep": true}, {"label": "未⑤・酉④×", "board": {"t": "pair", "a": [["", "", "", "○", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "✕", "", "", ""]], "b": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "未⑤・酉④×の周期は、男性は吉運上昇型となり、女性は④×の意味が誘発しやすい、不安定動揺型の暗示がある。だから特に④×・⑥×年を要注意。また周期全体からみれば、前半は弱含み、央半ば頃から男性は上昇型となるが④×年は注意。後半は吉運が強まるが⑥×年は要注意。女性は前半は弱含み横バイ型となり、央半ば頃から動揺不安定型で、波立ってくるが、後半の⑥×年を境として、以後、④×作用が鎮静化する暗示がある。特に④数月の人は凶性を誘発しやすい暗示がある。"}], "rep": true}, {"label": "申⑥×・申③", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "b": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "申⑥×・申③の周期は、男性は凶性を誘発しやすい傾向がある。これは生年寅と波動申とが冲となって、原点にあるG⑥×性を刺激し、誘引するからである。特に申月⑥数生まれの人、生月に⑥×をもつ人は下降運の暗示が強い。特に④×・⑥×年、申年、寅年を要注意。ただし、④数月生まれの人は弱含み横バイ型と緩和される暗示もある。女性は表面上は吉運にみえるけれども、申③ということはA⑥の作用が潜在で作用するので、吉運ではあるが、不安動揺し、反転しやすい。③×を生月にもつ人は低迷型。"}, {"t": "pair", "a": [["", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["▲", "", "", "", "▲"]], "b": [["", "", "▲", "", "▲"], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕"]], "caption": "⑨寅年8月（⑥申月）"}, {"t": "pair", "a": [["▲", "", "✕", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "▲", "", ""]], "b": [["✕", "", "○▲", "", "▲"], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", ""]], "caption": "⑨寅年6月（④午月）"}], "rep": true}]}, {"id": 33, "num": "⑨", "numVal": 9, "branch": "巳", "title": "⑨数巳年の読み方", "headingRaw": "【p.293（本文なし）】【p.294】⑨数巳年の読み方", "page": 294, "cycleText": "生年数⑨……九年周期（補助周期三年）", "male": {"head": "男性の場合（巳年）破壊数は①×・④×", "jun": "9巳→1×午→2未→3申→4×酉→5戌→6亥→7子→8丑→9寅……", "gyaku": "9巳→8辰→7卯→6寅→5丑→4×子→3亥→2戌→1×酉→9申……"}, "female": {"head": "女性の場合（巳年）破壊数は①×・④×", "jun": "9巳→8辰→7卯→6寅→5丑→4×子→3亥→2戌→1×酉→9申……", "gyaku": "9巳→1×午→2未→3申→4×酉→5戌→6亥→7子→8丑→9寅……"}, "note": "（月の盤の▲は、生年の盤の破壊の場に重なる所）", "yearBoard": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "months": [{"label": "2月　⑨寅", "month": 2, "num": "⑨", "branch": "寅", "board": [["", "", "✕▲", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", "▲"]]}, {"label": "3月　①卯", "month": 3, "num": "①", "branch": "卯", "board": [["", "", "▲", "", ""], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", "▲"]]}, {"label": "4月　②辰", "month": 4, "num": "②", "branch": "辰", "board": [["", "", "▲", "", "✕"], ["○", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", "✕"], ["", "", "", "", "▲"]]}, {"label": "5月　③巳", "month": 5, "num": "③", "branch": "巳", "board": [["", "○", "▲", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", "▲"]]}, {"label": "6月　④午", "month": 6, "num": "④", "branch": "午", "board": [["✕", "", "○▲", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", "▲"]]}, {"label": "7月　⑤未", "month": 7, "num": "⑤", "branch": "未", "board": [["", "", "▲", "○", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "✕", "", "", "▲"]]}, {"label": "8月　⑥申", "month": 8, "num": "⑥", "branch": "申", "board": [["", "", "▲", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕▲"]]}, {"label": "9月　⑦酉", "month": 9, "num": "⑦", "branch": "酉", "board": [["", "", "▲", "", ""], ["", "6", "2", "4", ""], ["✕", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["", "", "", "", "▲"]]}, {"label": "10月　⑧戌", "month": 10, "num": "⑧", "branch": "戌", "board": [["", "", "▲", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", "▲"]]}, {"label": "11月　⑨亥", "month": 11, "num": "⑨", "branch": "亥", "board": [["", "✕", "✕▲", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", "▲"]]}, {"label": "12月　①子", "month": 12, "num": "①", "branch": "子", "board": [["", "", "✕▲", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", "▲"]]}, {"label": "1月　②丑", "month": 1, "num": "②", "branch": "丑", "board": [["", "", "▲", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", "▲"]]}], "step1Head": "〔手順１〕座標となる生年月の対応数理と、十二支との関係を読む。", "step1": [{"t": "text", "text": "まず最初に考えなければならない点は、「巳」は初夏の季質を内包し、外へ向かって内より萌え出る潜勢力があり、繁茂しようとする拡大の心理を秘めているので、内向性は希薄で、陽性としての外向的気質が旺盛となる暗示がある。"}, {"t": "text", "text": "【p.295】この夏の季を享けた陽性の気を数的に表現しているのがA⑨で、⑨数は光熱を象徴するだけでなく、精神性の向上、人気性をも同時に象徴する数で、A⑨は天数系列上に引かれると共に、燃え上がる火気によって、E④×と合局し、強固になろうとして金局軌道に伝達する潜象理の働きがある。この金局につながる理が十二支の巳であり、巳・酉・丑の軌道を形成して金局化する潜在の軌道による変化の理をもよく知る必要がある。だから、⑨数そのものは陽性の外向性は強いのだが、十二支的な解釈をすれば、金局化するので、収縮性が場によって変生することを暗示している。"}, {"t": "text", "text": "これらの潜象理をよく象徴しているのが、巳月・酉月・丑月の三合金局の軌道である。順を追って説明すれば、巳③数月のA③は感覚的に鋭敏さと、活力に満ちて、A⑨との対応によって萌え上がり拡大する外向性の旺盛さを暗示しているといえる。またA⑨は生月との対応でG⑥・G⑨となり、動的な回転力、行動力、権威性、理想に向かって行動する数理を秘めているのが読める。また、生年のJ⑧は変換して月ではA③となり、A⑨は変換して巳の場であるJ場へJ②となって、相互に互換した数位を示しているのが読める。別言すれば、金局軌道に変移する意味を、潜象理として内包する命質を備えているといえよう。だからE④×がE⑦に反転するのである。この反転し【p.296】た⑦数は秋を象徴する収縮型の気質があり、この気質によって秋酉月には、E④×がA⑦に変換され、A⑨がC⑨×となって、火気力の衰えとなって、土質を意味する②数と、C②・C⑨×と対応して、その変質理を示している。また冬の丑月へ向かう三合金局理から読むと、J⑧・A⑨・B①×の／線上の数が、丑月には逆転して、J①・A②・B③となって変換されている理によって、⑨数の象意と、三合金局における軌道の変換作用との包合的機能の一端が、よく写し出されているといえよう。"}, {"t": "pair", "a": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["▲", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", "▲"]], "b": [["", "○", "▲", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", "▲"]], "caption": "⑨巳年5月（③巳月）"}, {"t": "pair", "a": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["▲", "7", "9", "2", "▲"], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "b": [["", "", "▲", "", ""], ["", "6", "2", "4", ""], ["✕", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["", "", "", "", "▲"]], "caption": "⑨巳年9月（⑦酉月）"}, {"t": "pair", "a": [["", "○", "✕", "", "▲"], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "b": [["", "", "▲", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", "▲"]], "caption": "⑨巳年1月（②丑月）"}], "step2Head": "〔手順２〕波動の流れを把握するためには、主周期の波動で掴み、十二支、クロス期、冲作用をよく注意し、補助波動を参考にする必要がある。", "step2Intro": [], "cycles": [{"label": "巳⑨・巳⑨", "board": {"t": "pair", "a": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "b": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "caption": ""}, "items": [{"t": "text", "text": "巳⑨・巳⑨の周期は、男女共に吉運で、周期を通して順調に推移するので、たとえ①×年・④×年があったとしても、緩和される暗示がある。だが周期後半は弱含みとなるので、横バイ型となる傾向がみられる。特に亥⑥数年は冲となるので、この年から弱含みとなる、また子⑦数年も弱含みとなりやすい。また生月によれば、好運期であっても低迷型となりやすい生月があり、生月で⑨×の人は低迷横バイ型となりやすい暗示がある。従って①×年と④×年は不安定となって動揺しやすいので注意。"}], "rep": true}, {"label": "午①×・辰⑧", "board": {"t": "pair", "a": [["", "", "○", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕", "", ""]], "b": [["", "", "", "", ""], ["○", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "✕"], ["✕", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "【p.297】午①×・辰⑧の周期は、男性は凶性が誘発されやすい不安定さがあるので、運気は弱含み下降型の低迷の暗示がある。女性は吉運である。その意味では、前周期から緩やかな上昇気運が続く暗示がある。ただし、生月で⑧×をもつ人は、弱含み低迷型となる暗示がある。だから①×・④×年は要注意である。男性は生月で①×となる月の人は、凶性が強く誘発するので、下降型の低迷となりやすいので、①×・④×年は特に要注意。また①数が準破壊となる人も、下降型の低迷となりやすい。特に八月⑥数月の人は凶性が強く誘発されやすい暗示がある。また①数月生まれの人も、これに準じた凶性を誘発する暗示があるので、運気は弱含み低迷型となりやすい。"}, {"t": "pair", "a": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["▲", "", "", "✕", "▲"]], "b": [["", "", "▲", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕▲"]], "caption": "⑨巳年8月（⑥申月）"}, {"t": "pair", "a": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", "▲"], ["", "3", "5", "1", ""], ["", "", "▲", "✕", ""]], "b": [["", "", "▲", "", ""], ["", "9", "5", "7", ""], ["○", "8", "1", "3", "✕"], ["", "4", "6", "2", ""], ["", "", "✕", "", "▲"]], "caption": "⑨巳年3月（①卯月）"}, {"t": "pair", "a": [["", "○", "✕▲", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "▲", "✕", ""]], "b": [["", "", "✕▲", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", "▲"]], "caption": "⑨巳年12月（①子月）"}], "rep": true}, {"label": "未②・卯⑦△", "board": {"t": "pair", "a": [["", "", "", "○", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "✕", "", "", ""]], "b": [["", "", "", "", ""], ["", "6", "2", "4", ""], ["○", "5", "7", "9", "✕"], ["", "1", "3", "8", ""], ["", "", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "未②・卯⑦△の周期は、十二支が木局軌道にあり、波動数が火局するので、男女共に吉運上昇型となるが、女性の場合は男性よりやや弱含上昇の、緩やかな上昇波といえよう。周期全体からみれば、男女共に前半期が弱含みとなるから、子①×年は多少の低迷はある。だが周半ばの卯④×年は、波動の未・卯と呼び合うので、緩和吉化される暗示があり、後半にかけて、上昇波は強まる傾向がみられる。ただし、男性の場合、生月で②×となる人、または準破壊となる人は、上昇波が鈍る暗示がある。女性の場合は、③数月生まれ、⑥数月生まれ、酉月生まれの人は、弱含みとなる可能性がある。"}, {"t": "pair", "a": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["▲", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", "▲"]], "b": [["", "○", "▲", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", "▲"]], "caption": "⑨巳年5月（③巳月）"}, {"t": "pair", "a": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["▲", "", "", "✕", "▲"]], "b": [["", "", "▲", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕▲"]], "caption": "⑨巳年8月（⑥申月）"}, {"t": "pair", "a": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["▲", "7", "9", "2", "▲"], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "b": [["", "", "▲", "", ""], ["", "6", "2", "4", ""], ["✕", "5", "7", "9", "✕○"], ["", "1", "3", "8", ""], ["", "", "", "", "▲"]], "caption": "⑨巳年9月（⑦酉月）"}], "rep": true}, {"label": "申③・寅⑥", "board": {"t": "pair", "a": [["", "", "", "", ""], ["", "2", "7", "9", "○"], ["✕", "1", "3", "5", ""], ["✕", "6", "8", "4", ""], ["", "", "", "", ""]], "b": [["", "", "", "", ""], ["", "5", "1", "3", "✕"], ["", "4", "6", "8", ""], ["○", "9", "2", "7", ""], ["", "", "", "", "✕"]], "caption": ""}, "items": [{"t": "text", "text": "【p.298】申③・寅⑥の周期は、十二支が申と寅が冲をなしているだけでなく、補助波動は大クロス期となって、主波動の前半の三年間が、やはり寅と申が冲となっているので、吉凶に関わらず、方向転換、反転が生じやすい周期といえる。この反転作用をよく象徴しているのが、生年におけるD③とG⑥の変革性を秘めた数理となっていることからみても、運気の変動をよく暗示しているようだ。波動数からみれば男女共に吉運ではあるが、生年巳と波動数申・寅の共鳴作用によって、X形象を形成するから、潜在の亥の場にあるB①×性を誘引する暗示があるので、①×年は特に要注意である。また④×年も注意すべき年といえる。というのは、周半ばのC波動が冬の季質を示しているので、陰性が強まるからである。その意味では、男女共に吉運といっても、V字形の運気の形象を示現する暗示がある。"}, {"t": "text", "text": "生月数理との兼ね合いから読むと、男性は十月生まれの、生月に③×をもつ人は弱含み低迷型となりやすく、女性は生月に⑥×をもつ人は弱含み低迷型となりやすい。また男女共に、寅月生まれ、申月生まれの人は運気の変動、反転が生じやすい暗示がある。男性は亥年、寅年、女性は申年、亥年が反転しやすい年である。要注意。"}, {"t": "pair", "a": [["▲", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["▲", "", "", "✕", ""]], "b": [["", "", "▲", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", "▲"]], "caption": "⑨巳年10月（⑧戌月）"}, {"t": "pair", "a": [["", "○", "✕▲", "", "▲"], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", ""]], "b": [["", "", "✕▲", "", ""], ["", "8", "4", "6", "✕"], ["", "7", "9", "2", ""], ["○", "3", "5", "1", ""], ["", "", "", "", "▲"]], "caption": "⑨巳年2月（⑨寅月）"}, {"t": "pair", "a": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["▲", "", "", "✕", "▲"]], "b": [["", "", "▲", "", ""], ["", "5", "1", "3", "○"], ["", "4", "6", "8", ""], ["✕", "9", "2", "7", ""], ["", "", "", "", "✕▲"]], "caption": "⑨巳年8月（⑥申月）"}], "rep": true}, {"label": "酉④×・丑⑤", "board": {"t": "pair", "a": [["✕", "", "", "", ""], ["", "3", "8", "1", ""], ["✕", "2", "4", "6", "○"], ["", "7", "9", "5", ""], ["", "", "", "", ""]], "b": [["", "", "", "✕", ""], ["", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", ""], ["", "○", "", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "酉④×・丑⑤の周期は、十二支が三合金局なので、酉④×は凶性は緩和吉化される暗示【p.299】がある。酉④×ということは、A⑨・A④で金局する理と、C④の理ともなるから、生年A⑨が反転してA②となった理が、潜象に作用するといえる。その意味では、吉化される可能性は強いといえる。だから、凶性にみえて吉運となりやすい暗示がある。だがA④の作用からみれば、生年A⑨は波動ではF⑨となるので、不安定要素を一部内包する暗示があるといえよう。だから、③数月生まれの男性は、吉化しないまま凶性を誘発しやすく、低迷動揺型となりやすい。従って①×、④×年は凶性を帯びやすい年なので、要注意年といえる。"}, {"t": "pair", "a": [["", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["▲", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "✕", "▲"]], "b": [["", "○", "▲", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "✕", "▲"]], "caption": "⑨巳年5月（③巳月）"}, {"t": "text", "text": "女性は吉運上昇型となるが、上昇の中の緩やかな横バイが周後半に起きやすい。①×年は子①数月の人は特に要注意。凶性を誘発する暗示があるので、不安定動揺が生じやすい。また周半ばの酉④×は緩和吉化されやすいので、無難な年に変生する可能性がある。ただし生月で④×をもつ人は、不安動揺が生じる暗示もあるので注意。"}, {"t": "pair", "a": [["", "○", "✕▲", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "▲", "✕", ""]], "b": [["", "", "✕▲", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", "▲"]], "caption": "⑨巳年12月（①子月）"}], "rep": true}, {"label": "戌⑤・子④×", "board": {"t": "pair", "a": [["", "", "", "", ""], ["✕", "4", "9", "2", ""], ["", "3", "5", "7", ""], ["", "8", "1", "6", "○"], ["", "", "", "", ""]], "b": [["✕", "", "✕", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "○", "", ""]], "caption": ""}, "items": [{"t": "text", "text": "戌⑤・子④×の周期は、前周期とクロス期を形成するので、今までの運気とは違った状況となる暗示がある。男性は吉運であるが、戌⑤ということは、A④の理も潜在では作用するので、弱含み上昇型で、周半ばに一つの小山を築く形象がみられるので、午④×は緩和吉化されやすい。女性は④×期であるが、④×が十二支子となっている【p.300】ので、F④の潜象理があるので、凶性は弱体化されやすいが、⑧数が凶性を帯びるので、⑧数の意味に関連した不安動揺を誘発しやすい暗示がある。その意味では、吉凶相半ばする不安定期といえよう。特に午④×年は要注意。①×年は③数月の人は特に要注意で、④×年も凶性を誘発しやすいので、弱含み下降低迷型となりやすい。また④数月生まれの女性は、午月生まれなので、午④×年は、④×の凶性を誘引しやすく、反転動揺が生じやすいので要注意。"}, {"t": "pair", "a": [["▲", "○", "✕", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "▲", "✕", ""]], "b": [["✕", "", "○▲", "", ""], ["", "3", "8", "1", ""], ["", "2", "4", "6", ""], ["", "7", "9", "5", ""], ["", "", "✕", "", "▲"]], "caption": "⑨巳年6月（④午月）"}], "rep": true}, {"label": "亥⑥・亥③", "board": {"t": "pair", "a": [["", "✕", "", "", ""], ["", "5", "1", "3", ""], ["", "4", "6", "8", ""], ["", "9", "2", "7", ""], ["", "", "", "○", "✕"]], "b": [["", "✕", "", "", ""], ["", "2", "7", "9", ""], ["✕", "1", "3", "5", ""], ["", "6", "8", "4", ""], ["", "", "", "○", ""]], "caption": ""}, "items": [{"t": "text", "text": "亥⑥・亥③の周期は、十二支の亥と生年の巳とが冲する周期なので、また補助波動も大クロス期で、しかも亥となって、共に冲作用を引き起こす潜勢力が強いから、運気の変動が生じやすく、反転しやすい暗示が、特に周期初めの亥年と、後半初めの巳年が、反転変動の回転軸となりやすい要注意年といえる。特に④数月生まれの人は凶性に誘引される暗示があるので要注意。また男性の①数月生まれ、女性の⑧数月生まれの人は、弱含み低迷型となりやすく、④数月生まれの人はこれに準じた弱い運気で、横バイ型となりやすい暗示がある。また男女に関わらず③数月生まれの人は、①×年は注意。また④×年も注意。凶性を誘引しやすい年だから、慎重に対処すべきである。その他の人は、多少の強弱の差はあっても、吉運変革期であるが、 h": "戌", "board": [["▲", "", "▲", "", ""], ["✕", "7", "3", "5", ""], ["", "6", "8", "1", ""], ["", "2", "4", "9", "○"], ["✕", "", "", "", ""]]}, {"label": "11月　⑨亥", "month": 11, "num": "⑨", "branch": "亥", "board": [["▲", "✕", "✕▲", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", ""]]}, {"label": "12月　①子", "month": 12, "num": "①", "branch": "子", "board": [["▲", "", "✕▲", "", ""], ["", "9", "5", "7", ""], ["", "8", "1", "3", ""], ["", "4", "6", "2", ""], ["", "", "✕○", "", ""]]}, {"label": "1月　②丑", "month": 1, "num": "②", "branch": "丑", "board": [["▲", "", "▲", "✕", "✕"], ["", "1", "6", "8", ""], ["", "9", "2", "4", ""], ["", "5", "7", "3", ""], ["", "○", "", "", ""]]}], "step1Head": "〔手順１〕座標となる生年月の対応数理と、十二支との関係を読む。", "step1": [{"t": "text", "text": "まず最初に考えなければならない点は、「亥」は初冬の季質を内包しているので、収縮型の陰性の気質をもっているので、暖気を欲して、十二支の亥と合局する木局の気質を誘引する性情が内奥にあるので、この潜勢力の流れをよく把握する必要がある。"}, {"t": "text", "text": "【p.311】この隠れた潜勢力の保気は、A場⑨であり、亥年⑨・亥月⑨の年月対応になる。冬の季質をもつF場には、F⑤・F⑤となって、A⑨・A⑨の並列によって、その内奥に生成されるのがF⑤・F⑤であるから、F⑤の中には常にA⑨の保気としての暖気が保有されてあると考えなければならない。別言すれば、外部環境は厳しい収縮型の内向気質があったとしても、外部が厳しくなればなるほど、それに抗した反発力となって、内奥に陽気が自生する。陰陽合体の理を内包している命質である。だから、運気が弱い時には、F場の⑤数は、F場の原点に作用する①数が、５＋５＝⑩の意味を生じて、土局作用を起こし、渋滞の運気を耐ねるように、陰性を帯びた気質となり、運気が強張ってくると、F⑨の意味を自生して変換する。だから気質も、陰性から陽性の外向型に命質が変生する暗示がある。"}, {"t": "pair", "a": [["▲", "✕", "✕▲", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", ""]], "b": [["▲", "✕", "✕▲", "", ""], ["", "8", "4", "6", ""], ["", "7", "9", "2", ""], ["", "3", "5", "1", ""], ["", "", "", "○", ""]], "caption": "⑨亥年11月（⑨亥月）"}, {"t": "text", "text": "この潜在に起生する潜勢力の在り方をよく検索すると、F場に⑩数が自生することは、順逆の回転作用からみると、その中央には、もう一段階変転した、⑤から⑥への変換作用が起こり、F⑤はその対向する熱気の象徴場であるE⑤に変生し、逆に陰数⑥はF場に留まって、陰陽分離となり、A場は⑩と①の陰陽合体において、陽数①が顕在界へ、陰数⑩が潜在界の基層に残留する。この潜象理を暗示しているのが、木局【p.312】軌道にある春三月卯A数である。そして、A⑨は春の季を受けてJ⑨となって変移する。だが、まだ冷気が中心に残留しているので、水温む状況は、A⑨の熱気によって、変生するのだが、卯月の春の場であるH場には、門戸を象徴する⑧数が閉じられ、しかも、春を象徴する③数がC場でC③×となっているので、まだ活力が噴出されない const CIRC = {'1':'①','2':'②','3':'③','4':'④','5':'⑤','6':'⑥','7':'⑦','8':'⑧','9':'⑨'};
const KANJI_MONTH = {1:'一月',2:'二月',3:'三月',4:'四月',5:'五月',6:'六月',7:'七月',8:'八月',9:'九月',10:'十月',11:'十一月',12:'十二月'};
let selNum = null, selBranch = null, selSex = 'male', selMonth = null;

const byKey = {};
DATA.forEach(c => byKey[c.numVal + '_' + c.branch] = c);

const numPick = document.getElementById('numPick');
const brPick = document.getElementById('brPick');
const chapterEl = document.getElementById('chapter');

for (let n = 1; n <= 9; n++) {
  const b = document.createElement('button');
  b.className = 'pk'; b.textContent = CIRC[String(n)] + '数';
  b.setAttribute('aria-pressed','false');
  b.onclick = () => { selNum = n; selBranch = null; selMonth = null; renderPicks(); renderChapter(); };
  b.dataset.num = n;
  numPick.appendChild(b);
}
function branchesOf(n){ return DATA.filter(c => c.numVal === n).map(c => c.branch); }

document.querySelectorAll('#sexPick .pk').forEach(b => {
  b.onclick = () => { selSex = b.dataset.sex; renderPicks(); renderChapter(); };
});

function renderPicks(){
  numPick.querySelectorAll('.pk').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.num) === selNum)));
  document.querySelectorAll('#sexPick .pk').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sex === selSex)));
  brPick.innerHTML = '';
  if (selNum) {
    branchesOf(selNum).forEach(br => {
      const b = document.createElement('button');
      b.className = 'pk'; b.textContent = br + '年';
      b.setAttribute('aria-pressed', String(br === selBranch));
      b.onclick = () => { selBranch = br; selMonth = null; renderPicks(); renderChapter(); };
      brPick.appendChild(b);
    });
  }
}

function cellCls(v, r, c){
  let cls = '';
  if (v.includes('▲')) cls = 'tri';
  else if (v.includes('✕') || v.includes('×')) cls = 'bad';
  else if (v.includes('○')) cls = 'mk';
  if (r === 2 && c === 2 && !cls) cls = 'ctr';
  return cls;
}
function boardHTML(g, small){
  let h = '<div class="board' + (small ? ' small' : '') + '">';
  g.forEach((row, r) => row.forEach((v, c) => {
    h += '<span class="' + cellCls(v, r, c) + '">' + (v || '') + '</span>';
  }));
  return h + '</div>';
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function monthTerms(ch){
  if (!selMonth) return [];
  const m = ch.months.find(x => x.month === selMonth);
  if (!m) return [];
  return [KANJI_MONTH[selMonth], m.num + m.branch + '月', m.num + m.branch, selMonth + '月', m.branch + '月']
    .sort((a,b) => b.length - a.length);
}
function hl(text, ch){
  let h = esc(text);
  const terms = monthTerms(ch);
  if (!terms.length) return h;
  const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')', 'g');
  return h.replace(re, '<mark>$1</mark>');
}
function captionMonth(cap){
  const m = cap.match(/年(\d+)月/);
  return m ? Number(m[1]) : null;
}
function itemHTML(it, ch){
  if (it.t === 'text') return '<p class="txt">' + hl(it.text, ch) + '</p>';
  if (it.t === 'bikou') return '<div class="bikou">' + esc(it.text) + '</div>';
  if (it.t === 'pair' || it.t === 'board') {
    const cm = it.caption ? captionMonth(it.caption) : null;
    const hlCls = (selMonth && cm === selMonth) ? ' hl' : '';
    let h = '<div class="pair' + hlCls + '">';
    if (it.t === 'pair') {
      h += '<div class="pb">' + boardHTML(it.a, true) + '</div><div class="pb">' + boardHTML(it.b, true) + '</div>';
    } else {
      h += '<div class="pb">' + boardHTML(it.a, true) + '</div>';
    }
    h += '</div>';
    if (it.caption) h += '<div class="cap" style="text-align:left">' + esc(it.caption) + '</div>';
    return h;
  }
  return '';
}
function flowSteps(flowStr){
  return flowStr.split('→').map(s => s.trim()).filter(Boolean);
}
function stepMainKey(step){
  const m = step.match(/^(\d+)(×|x)?(.)$/);
  if (!m) return null;
  return m[3] + CIRC[m[1]];
}
function flowHTML(flowStr, ch){
  const steps = flowSteps(flowStr);
  let h = '<div class="frow">';
  steps.forEach((s, i) => {
    if (i) h += '<span class="farr">→</span>';
    const key = stepMainKey(s.replace('……',''));
    const ci = key ? ch.cycles.findIndex(cy => {
      const mm = cy.label.split('・')[0].replace(/[×△]/g,'');
      return mm === key;
    }) : -1;
    const x = (s.includes('×') || s.includes('✕')) ? ' x' : '';
    if (ci >= 0) h += '<button class="fstep' + x + '" data-cyc="' + ci + '">' + esc(s) + '</button>';
    else h += '<span class="fstep' + x + '" style="cursor:default;opacity:.75">' + esc(s) + '</span>';
  });
  return h + '</div>';
}

function renderChapter(){
  if (!selNum || !selBranch) {

    return;
  }

  if (!ch) { chapterEl.innerHTML = '<p class="empty">該当する章がありません。</p>'; return; }

  const otherName = selSex === 'male' ? '女性' : '男性';
  let h = '';

  h += '<div class="cyc">' + esc(sex.head) + '</div></div>';

  h += '<h2 class="sec">波動の流れ（' + (selSex === 'male' ? '男性' : '女性') + '）</h2>';
  h += '<div class="flowbox"><div class="fl">（順）</div>' + flowHTML(sex.jun, ch);
  h += '<div class="fl">（逆）</div>' + flowHTML(sex.gyaku, ch);

  h += '<details class="other"><summary>' + otherName + 'の場合：' + esc(other.head) + '</summary><div class="flowbox"><div class="fl">（順）</div>' + flowHTML(other.jun, ch) + '<div class="fl">（逆）</div>' + flowHTML(other.gyaku, ch) + '</div></details>';

  h += '<h2 class="sec">生年' + ch.num + ch.branch + 'と各月の数理盤</h2>';
  h += '<p class="note">' + esc(ch.note) + '</p>';
  h += '<div class="picklabel">生月（選ぶと、その月に触れた本文が目立ちます）</div><div class="picker" id="monthPick">';
  const monthsSorted = [...ch.months].sort((a,b) => a.month - b.month);
  monthsSorted.forEach(m => {
    h += '<button class="pk" data-month="' + m.month + '" aria-pressed="' + String(selMonth === m.month) + '">' + (selMonth === m.month ? '▲' : '') + m.month + '月<small>' + esc(m.num + m.branch) + '</small></button>';
  });
  h += '</div>';
  h += '<div class="yearwrap"><div><div class="cap" style="font-size:14px;color:var(--muted)">生年' + ch.num + ch.branch + '</div>' + boardHTML(ch.yearBoard, false) + '</div></div>';
  h += '<div class="months">';
  monthsSorted.forEach(m => {
    h += '<button class="mbox" data-month="' + m.month + '" aria-pressed="' + String(selMonth === m.month) + '"><div class="mlab">' + (selMonth === m.month ? '▲' : '') + esc(m.label) + '</div>' + boardHTML(m.board, true) + '</button>';
  });
  h += '</div>';

  h += '<h2 class="sec">' + esc(ch.step1Head) + '</h2>';
  ch.step1.forEach(it => h += itemHTML(it, ch));

  h += '<h2 class="sec">' + esc(ch.step2Head) + '</h2>';
  ch.step2Intro.forEach(it => h += itemHTML(it, ch));
  ch.cycles.forEach((cy, i) => {
    h += '<details class="cyc" id="cyc' + i + '"><summary>' + esc(cy.label) + '</summary><div class="cin">';
    if (cy.board) {
      const parts = cy.label.split('・');
      h += '<div class="pair"><div class="pb">' + boardHTML(cy.board.a, true) + '<div class="cap">主波動 ' + esc(parts[0] || '') + '</div></div><div class="pb">' + boardHTML(cy.board.b, true) + '<div class="cap">副波動 ' + esc(parts[1] || '') + '</div></div></div>';
    }
    cy.items.forEach(it => h += itemHTML(it, ch));
    h += '</div></details>';
  });
  chapterEl.innerHTML = h;

  chapterEl.querySelectorAll('#monthPick .pk').forEach(b => {
    b.onclick = () => { const m = Number(b.dataset.month); selMonth = (selMonth === m ? null : m); renderChapter(); };
  });
  chapterEl.querySelectorAll('.mbox').forEach(b => {
    b.onclick = () => { const m = Number(b.dataset.month); selMonth = (selMonth === m ? null : m); renderChapter(); };
  });
  chapterEl.querySelectorAll('.fstep').forEach(b => {
    b.onclick = () => {
      const ci = Number(b.dataset.cyc);
      if (ci >= 0) {
        const d = document.getElementById('cyc' + ci);
        if (d) { d.open = true; d.scrollIntoView({behavior:'smooth', block:'start'}); }
      }
    };
  });
}
